# Cases for "aws datapipeline" (scripts/console_db/overrides/
# datapipeline.yaml): every resolver target answers 404, so the console
# home, with or without a pipeline id.

- argv: [datapipeline]
  url: "https://console.aws.amazon.com/console/home?region=us-west-2"
  source: curated
- argv: [datapipeline, describe-pipelines, --pipeline-ids, df-0123456789ABCDEFGHIJ]
  url: "https://console.aws.amazon.com/console/home?region=us-west-2"
  source: curated
- argv: [datapipeline, get-pipeline-definition, --pipeline-id, df-0123456789ABCDEFGHIJ]
  region: eu-west-1
  url: "https://console.aws.amazon.com/console/home?region=eu-west-1"
  source: curated
- argv: [datapipeline, activate-pipeline]
  url: "https://console.aws.amazon.com/console/home?region=us-west-2"
  source: curated
- argv: [datapipeline, create-pipeline]
  url: "https://console.aws.amazon.com/console/home?region=us-west-2"
  source: curated
- argv: [datapipeline, deactivate-pipeline]
  url: "https://console.aws.amazon.com/console/home?region=us-west-2"
  source: curated
- argv: [datapipeline, delete-pipeline]
  url: "https://console.aws.amazon.com/console/home?region=us-west-2"
  source: curated
- argv: [datapipeline, list-pipelines]
  url: "https://console.aws.amazon.com/console/home?region=us-west-2"
  source: curated
- argv: [datapipeline, put-pipeline-definition]
  url: "https://console.aws.amazon.com/console/home?region=us-west-2"
  source: curated
- argv: [datapipeline, validate-pipeline-definition]
  url: "https://console.aws.amazon.com/console/home?region=us-west-2"
  source: curated
