# Cases for the "aws cloudwatch" generated entries.  No override file: every
# generated entry reviewed (alarms by --alarm-names / --alarm-name, the
# alarms list, dashboards list and dashboard page) is already the resolver's
# page, and the metrics pages (list-metrics, get-metric-data,
# get-metric-statistics, put-metric-data) have no resolver, documented or
# reference-project URL, so they keep the CloudWatch home.  Sample alarm
# myalarm and dashboard mydash from scripts/console_db/snapshots/view-samples.tsv.

- argv: [cloudwatch, describe-alarms]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#alarmsV2:"
- argv: [cloudwatch, describe-alarms, --alarm-names, myalarm]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#alarmsV2:alarm/myalarm"
- argv: [cloudwatch, describe-alarms, --alarm-names, "my alarm"]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#alarmsV2:alarm/my%20alarm"
- argv: [cloudwatch, describe-alarms, --alarm-names, myalarm, otheralarm]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#alarmsV2:"
- argv: [cloudwatch, set-alarm-state, --alarm-name, myalarm, --state-value, ALARM, --state-reason, test]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#alarmsV2:alarm/myalarm"
- argv: [cloudwatch, describe-alarm-history, --alarm-name, myalarm]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#alarmsV2:alarm/myalarm"
- argv: [cloudwatch, list-dashboards]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#dashboards/"
- argv: [cloudwatch, get-dashboard, --dashboard-name, mydash]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home#dashboards:name=mydash"
- argv: [cloudwatch, list-metrics, --namespace, AWS/Lambda]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home"
