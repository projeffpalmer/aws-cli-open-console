# Cases for scripts/console_db/overrides/backup.yaml (curator W3) plus
# generated entries that were reviewed and kept.  Sample vault myvault and
# account 123456789012 come from view-samples.tsv; the plan id from the
# live backup-plan ARN probe.
- argv: [backup, list-backup-vaults]
  url: "https://us-west-2.console.aws.amazon.com/backup/home?region=us-west-2#/backupvaults"
  source: resolver:list
- argv: [backup, get-backup-plan, --backup-plan-id, 0123abcd-0123-0123-0123-0123456789ab]
  url: "https://us-west-2.console.aws.amazon.com/backup/home?region=us-west-2#/backupplan/details/0123abcd-0123-0123-0123-0123456789ab"
- argv: [backup, describe-backup-vault, --backup-vault-name, myvault]
  account: "123456789012"
  url: "https://us-west-2.console.aws.amazon.com/backup/home?region=us-west-2#/backupvaults/details/myvault?owner-account-id=123456789012"
  source: curated
- argv: [backup, describe-backup-vault, --backup-vault-name, myvault]
  url: "https://us-west-2.console.aws.amazon.com/backup/home?region=us-west-2#/backupvaults/details/myvault"
  source: curated
- argv: [backup, list-recovery-points-by-backup-vault, --backup-vault-name, myvault]
  account: "123456789012"
  url: "https://us-west-2.console.aws.amazon.com/backup/home?region=us-west-2#/backupvaults/details/myvault?owner-account-id=123456789012"
  source: curated
- argv: [backup, start-backup-job, --backup-vault-name, myvault, --resource-arn, "arn:aws:dynamodb:us-west-2:123456789012:table/MyTable", --iam-role-arn, "arn:aws:iam::123456789012:role/service-role/AWSBackupDefaultServiceRole"]
  url: "https://us-west-2.console.aws.amazon.com/backup/home?region=us-west-2#/backupvaults/details/myvault"
  source: curated
