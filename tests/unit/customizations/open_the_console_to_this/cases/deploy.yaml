# Cases for the curated "aws deploy" nodes (scripts/console_db/overrides/deploy.yaml).
# Sample application myapp and deployment group mydg come from the go/view?arn= probes.
- argv: [deploy, list-applications]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codedeploy/applications?region=us-west-2"
- argv: [deploy, get-application, --application-name, myapp]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codedeploy/applications/myapp?region=us-west-2"
- argv: [deploy, create-application, --application-name, myapp]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codedeploy/application/new?region=us-west-2"
  source: curated
- argv: [deploy, list-deployment-groups, --application-name, myapp]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codedeploy/applications/myapp?region=us-west-2"
  source: curated
- argv: [deploy, create-deployment-group, --application-name, myapp, --deployment-group-name, mydg, --service-role-arn, "arn:aws:iam::123456789012:role/cd"]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codedeploy/applications/myapp?region=us-west-2"
  source: curated
- argv: [deploy, batch-get-deployment-groups, --application-name, myapp, --deployment-group-names, mydg]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codedeploy/applications/myapp?region=us-west-2"
  source: curated
- argv: [deploy, push, --application-name, myapp, --s3-location, "s3://mybucket/app.zip"]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codedeploy/applications/myapp?region=us-west-2"
  source: curated
- argv: [deploy, get-deployment-group, --application-name, myapp, --deployment-group-name, mydg]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codedeploy/applications/myapp/deployment-groups/mydg?region=us-west-2"
  source: curated
- argv: [deploy, delete-deployment-group, --application-name, myapp, --deployment-group-name, mydg]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codedeploy/applications/myapp/deployment-groups/mydg?region=us-west-2"
  source: curated
- argv: [deploy, update-deployment-group, --application-name, myapp, --current-deployment-group-name, mydg, --new-deployment-group-name, mydg2]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codedeploy/applications/myapp/deployment-groups/mydg?region=us-west-2"
  source: curated
- argv: [deploy, create-deployment, --application-name, myapp, --deployment-group-name, mydg, --s3-location, "bucket=mybucket,key=app.zip,bundleType=zip"]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codedeploy/applications/myapp/deployment-groups/mydg?region=us-west-2"
  source: curated
- argv: [deploy, list-deployments, --application-name, myapp]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codedeploy/applications/myapp?region=us-west-2"
  source: curated
- argv: [deploy, list-deployments]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codedeploy/applications?region=us-west-2"
  source: curated
