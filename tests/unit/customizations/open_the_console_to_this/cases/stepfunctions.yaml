# Cases for scripts/console_db/overrides/stepfunctions.yaml.  Sample state
# machine mysm and execution exec1 from
# scripts/console_db/snapshots/view-samples.tsv.

- argv: [stepfunctions, create-state-machine, --name, mysm, --definition, "file://sm.json", --role-arn, "arn:aws:iam::123456789012:role/myrole"]
  url: "https://us-west-2.console.aws.amazon.com/states/home?region=us-west-2#/v2/statemachines/create"
  source: curated

# State machine page.
- argv: [stepfunctions, start-execution, --state-machine-arn, "arn:aws:states:us-west-2:123456789012:stateMachine:mysm", --input, "{}"]
  url: "https://us-west-2.console.aws.amazon.com/states/home?region=us-west-2#/statemachines/view/arn:aws:states:us-west-2:123456789012:stateMachine:mysm"
  source: curated
- argv: [stepfunctions, start-sync-execution, --state-machine-arn, "arn:aws:states:us-west-2:123456789012:stateMachine:mysm"]
  url: "https://us-west-2.console.aws.amazon.com/states/home?region=us-west-2#/statemachines/view/arn:aws:states:us-west-2:123456789012:stateMachine:mysm"
  source: curated
- argv: [stepfunctions, list-executions, --state-machine-arn, "arn:aws:states:us-west-2:123456789012:stateMachine:mysm"]
  url: "https://us-west-2.console.aws.amazon.com/states/home?region=us-west-2#/statemachines/view/arn:aws:states:us-west-2:123456789012:stateMachine:mysm"
  source: curated
- argv: [stepfunctions, list-executions]
  url: "https://us-west-2.console.aws.amazon.com/states/home?region=us-west-2#/statemachines"
  source: curated

# Execution details page.
- argv: [stepfunctions, describe-execution, --execution-arn, "arn:aws:states:us-west-2:123456789012:execution:mysm:exec1"]
  url: "https://us-west-2.console.aws.amazon.com/states/home?region=us-west-2#/executions/details/arn:aws:states:us-west-2:123456789012:execution:mysm:exec1"
  source: curated
- argv: [stepfunctions, stop-execution, --execution-arn, "arn:aws:states:us-west-2:123456789012:execution:mysm:exec1"]
  url: "https://us-west-2.console.aws.amazon.com/states/home?region=us-west-2#/executions/details/arn:aws:states:us-west-2:123456789012:execution:mysm:exec1"
  source: curated
- argv: [stepfunctions, get-execution-history, --execution-arn, "arn:aws:states:eu-west-1:123456789012:execution:mysm:exec1"]
  region: eu-west-1
  url: "https://eu-west-1.console.aws.amazon.com/states/home?region=eu-west-1#/executions/details/arn:aws:states:eu-west-1:123456789012:execution:mysm:exec1"
  source: curated
- argv: [stepfunctions, redrive-execution, --execution-arn, "arn:aws:states:us-west-2:123456789012:execution:mysm:exec1"]
  url: "https://us-west-2.console.aws.amazon.com/states/home?region=us-west-2#/executions/details/arn:aws:states:us-west-2:123456789012:execution:mysm:exec1"
  source: curated
- argv: [stepfunctions, describe-state-machine-for-execution, --execution-arn, "arn:aws:states:us-west-2:123456789012:execution:mysm:exec1"]
  url: "https://us-west-2.console.aws.amazon.com/states/home?region=us-west-2#/executions/details/arn:aws:states:us-west-2:123456789012:execution:mysm:exec1"
  source: curated

# Not curated: generated list and state machine page stay.
- argv: [stepfunctions, list-state-machines]
  url: "https://us-west-2.console.aws.amazon.com/states/home?region=us-west-2#/statemachines"
- argv: [stepfunctions, describe-state-machine, --state-machine-arn, "arn:aws:states:us-west-2:123456789012:stateMachine:mysm"]
  url: "https://us-west-2.console.aws.amazon.com/states/home?region=us-west-2#/statemachines/view/arn:aws:states:us-west-2:123456789012:stateMachine:mysm"
