# Cases for "aws identitystore".  Nothing is curated: the resolver sends
# every AWS::IdentityStore type and go/view?arn= of an identity store ARN to
# the Identity Center home (singlesignon/home?region=<r>#/), and no
# reference shows a users or groups page, so the generated entries stay.

- argv: [identitystore, list-users, --identity-store-id, d-abc]
  url: "https://us-west-2.console.aws.amazon.com/singlesignon/home?region=us-west-2#/"
  source: "resolver:list"
- argv: [identitystore, list-groups, --identity-store-id, d-abc]
  region: eu-west-1
  url: "https://eu-west-1.console.aws.amazon.com/singlesignon/home?region=eu-west-1#/"
  source: "resolver:list"
- argv: [identitystore, describe-user, --identity-store-id, d-abc, --user-id, abc]
  url: "https://us-west-2.console.aws.amazon.com/singlesignon/home?region=us-west-2#/"
  source: "resolver:list"
