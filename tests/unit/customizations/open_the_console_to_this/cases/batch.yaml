  source: curated
- argv: [batch, list-jobs, --job-queue, myjq, --job-status, RUNNING]
  region: eu-west-1
  url: "https://eu-west-1.console.aws.amazon.com/batch/home?region=eu-west-1#queues/detail/myjq"
  source: curated
- argv: [batch, describe-jobs, --jobs, 0123abcd-1234-5678-9abc-def012345678]
