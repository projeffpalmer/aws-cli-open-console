# Cases for scripts/console_db/overrides/batch.yaml.  Sample names and
# ARNs from scripts/console_db/snapshots/view-samples.tsv (myjq) and the
# go/view?arn= probes (myce, myjd:1).
- argv: [batch, describe-job-queues, --job-queues, myjq]
  url: "https://us-west-2.console.aws.amazon.com/batch/home?region=us-west-2#queues/detail/myjq"
  source: curated
- argv: [batch, describe-job-queues, --job-queues, "arn:aws:batch:us-west-2:123456789012:job-queue/myjq"]
  url: "https://us-west-2.console.aws.amazon.com/batch/home?region=us-west-2#queues/detail/arn:aws:batch:us-west-2:123456789012:job-queue/myjq"
  source: curated
- argv: [batch, describe-job-queues]
  url: "https://us-west-2.console.aws.amazon.com/batch/home?region=us-west-2#queues"
  source: curated
- argv: [batch, describe-compute-environments, --compute-environments, "arn:aws:batch:us-west-2:123456789012:compute-environment/myce"]
  url: "https://us-west-2.console.aws.amazon.com/batch/home?region=us-west-2#compute-environments/to-detail/arn:aws:batch:us-west-2:123456789012:compute-environment/myce"
  source: curated
- argv: [batch, describe-compute-environments, --compute-environments, myce, otherce]
  url: "https://us-west-2.console.aws.amazon.com/batch/home?region=us-west-2#compute-environments"
