  source: curated
- argv: [elbv2, describe-rules, --listener-arn, "arn:aws:elasticloadbalancing:us-west-2:123456789012:listener/app/my-alb/0123456789abcdef/0123456789abcdef"]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2#ELBListenerV2:listenerArn=arn:aws:elasticloadbalancing:us-west-2:123456789012:listener/app/my-alb/0123456789abcdef/0123456789abcdef"
  source: curated
- argv: [elbv2, create-rule, --listener-arn, "arn:aws:elasticloadbalancing:us-west-2:123456789012:listener/app/my-alb/0123456789abcdef/0123456789abcdef", --priority, "10"]
