# Cases for the curated "aws codebuild" nodes (scripts/console_db/overrides/codebuild.yaml).
# Sample project myproj and account 123456789012 come from view-samples.tsv.
- argv: [codebuild, list-projects]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/projects?region=us-west-2"
- argv: [codebuild, create-project, --name, myproj]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/project/new?region=us-west-2"
- argv: [codebuild, batch-get-projects, --names, myproj]
  account: "123456789012"
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/123456789012/projects/myproj"
  source: curated
- argv: [codebuild, batch-get-projects, --names, myproj]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/projects?region=us-west-2"
  source: curated
- argv: [codebuild, batch-get-projects, --names, myproj, otherproj]
  account: "123456789012"
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/projects?region=us-west-2"
  source: curated
- argv: [codebuild, update-project, --name, myproj, --description, x]
  account: "123456789012"
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/123456789012/projects/myproj"
  source: curated
- argv: [codebuild, delete-project, --name, myproj]
  account: "123456789012"
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/123456789012/projects/myproj"
  source: curated
- argv: [codebuild, start-build, --project-name, myproj]
  account: "123456789012"
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/123456789012/projects/myproj/history?region=us-west-2"
  source: curated
- argv: [codebuild, start-build, --project-name, myproj]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/projects?region=us-west-2"
  source: curated
- argv: [codebuild, start-build-batch, --project-name, myproj]
  account: "123456789012"
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/123456789012/projects/myproj/history?region=us-west-2"
  source: curated
- argv: [codebuild, list-builds-for-project, --project-name, myproj]
  account: "123456789012"
  region: eu-west-1
  url: "https://eu-west-1.console.aws.amazon.com/codesuite/codebuild/123456789012/projects/myproj/history?region=eu-west-1"
  source: curated
# Build page: project before the first ":" of the build id (needs the account).
- argv: [codebuild, batch-get-builds, --ids, "myproj:01234567-89ab-cdef-0123-456789abcdef"]
  account: "123456789012"
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/123456789012/projects/myproj/build/myproj:01234567-89ab-cdef-0123-456789abcdef"
  source: curated
- argv: [codebuild, batch-get-builds, --ids, "myproj:01234567-89ab-cdef-0123-456789abcdef"]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/projects?region=us-west-2"
  source: curated
- argv: [codebuild, batch-get-builds, --ids, "myproj:01234567-89ab-cdef-0123-456789abcdef", "myproj:11111111-2222-3333-4444-555555555555"]
  account: "123456789012"
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/projects?region=us-west-2"
  source: curated
- argv: [codebuild, stop-build, --id, "myproj:01234567-89ab-cdef-0123-456789abcdef"]
  account: "123456789012"
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/123456789012/projects/myproj/build/myproj:01234567-89ab-cdef-0123-456789abcdef"
  source: curated
- argv: [codebuild, retry-build, --id, "myproj:01234567-89ab-cdef-0123-456789abcdef"]
  account: "123456789012"
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/123456789012/projects/myproj/build/myproj:01234567-89ab-cdef-0123-456789abcdef"
  source: curated
- argv: [codebuild, stop-build, --id, "myproj:01234567-89ab-cdef-0123-456789abcdef"]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/projects?region=us-west-2"
  source: curated
- argv: [codebuild, retry-build, --id, "myproj:01234567-89ab-cdef-0123-456789abcdef"]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/projects?region=us-west-2"
  source: curated
- argv: [codebuild, list-builds]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codebuild/projects?region=us-west-2"
  source: curated
