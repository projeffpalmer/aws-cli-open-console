# Cases for the curated "aws waf-regional" create pages (scripts/
# console_db/overrides/waf-regional.yaml): the resolver's create page on
# the global host.

- argv: [waf-regional, create-ip-set, --name, my-ip-set, --change-token, "token"]
  url: "https://console.aws.amazon.com/wafv2/homev2/ip-sets/new?region=us-west-2"
  source: curated
- argv: [waf-regional, create-regex-pattern-set, --name, my-patterns, --change-token, "token"]
  region: eu-central-1
  url: "https://console.aws.amazon.com/wafv2/homev2/regex-pattern-sets/new?region=eu-central-1"
  source: curated
