# Cases for scripts/console_db/overrides/opensearch.yaml.  Sample domain
# from scripts/console_db/snapshots/view-samples.tsv (mydomain).
- argv: [opensearch, list-domain-names]
  url: "https://us-west-2.console.aws.amazon.com/aos/home?region=us-west-2#opensearch/domains"
  source: curated
- argv: [opensearch, describe-domain, --domain-name, mydomain]
  url: "https://us-west-2.console.aws.amazon.com/aos/home?region=us-west-2#opensearch/domains/mydomain"
  source: curated
- argv: [opensearch, describe-domain]
  url: "https://us-west-2.console.aws.amazon.com/aos/home?region=us-west-2#opensearch/domains"
  source: curated
- argv: [opensearch, delete-domain, --domain-name, mydomain]
  region: eu-west-1
  url: "https://eu-west-1.console.aws.amazon.com/aos/home?region=eu-west-1#opensearch/domains/mydomain"
  source: curated
- argv: [opensearch, describe-domain-config, --domain-name, mydomain]
  url: "https://us-west-2.console.aws.amazon.com/aos/home?region=us-west-2#opensearch/domains/mydomain"
  source: curated
- argv: [opensearch, update-domain-config, --domain-name, mydomain, --cluster-config, InstanceCount=3]
  url: "https://us-west-2.console.aws.amazon.com/aos/home?region=us-west-2#opensearch/domains/mydomain"
  source: curated
- argv: [opensearch, describe-domains, --domain-names, mydomain]
  url: "https://us-west-2.console.aws.amazon.com/aos/home?region=us-west-2#opensearch/domains/mydomain"
  source: curated
- argv: [opensearch, describe-domains, --domain-names, mydomain, otherdomain]
  url: "https://us-west-2.console.aws.amazon.com/aos/home?region=us-west-2#opensearch/domains"
  source: curated
- argv: [opensearch, create-domain, --domain-name, mydomain, --engine-version, OpenSearch_2.11]
  url: "https://us-west-2.console.aws.amazon.com/aos/home?region=us-west-2#opensearch/domains/create-domain"
  source: curated
