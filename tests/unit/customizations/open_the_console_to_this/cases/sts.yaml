# Cases for the curated "aws sts" operations (scripts/console_db/overrides/
# sts.yaml).  Role ARNs are the samples from snapshots/view-samples.tsv.

- argv: [sts, get-caller-identity]
  url: "https://console.aws.amazon.com/iam/home#/home"
  source: curated
- argv: [sts, get-caller-identity]
  region: cn-north-1
  partition: aws-cn
  url: "https://console.amazonaws.cn/iam/home#/home"
  source: curated

# assume-role: the role page; a role path is dropped like go/view?arn= does.
- argv: [sts, assume-role, --role-arn, "arn:aws:iam::123456789012:role/MyRole", --role-session-name, s1]
  url: "https://console.aws.amazon.com/iam/home#/roles/details/MyRole"
  source: curated
- argv: [sts, assume-role, --role-session-name, s1, --role-arn, "arn:aws:iam::123456789012:role/service-role/MyRole"]
  url: "https://console.aws.amazon.com/iam/home#/roles/details/MyRole"
  source: curated
- argv: [sts, assume-role, --role-session-name, s1]
  url: "https://console.aws.amazon.com/iam/home#/roles"
  source: curated

- argv: [sts, get-session-token, --serial-number, "arn:aws:iam::123456789012:mfa/alice", --token-code, "123456"]
  url: "https://console.aws.amazon.com/iam/home#/security_credentials"
  source: curated
- argv: [sts, get-federation-token, --name, bob]
  url: "https://console.aws.amazon.com/iam/home#/security_credentials"
  source: curated

# Not curated: the IAM console home stays.
- argv: [sts, get-access-key-info]
  url: "https://console.aws.amazon.com/iam/home"
  source: service-home
