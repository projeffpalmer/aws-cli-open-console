# Cases for scripts/console_db/overrides/scheduler.yaml.  Sample schedule
# mysched in groups default / mygroup from
# scripts/console_db/snapshots/view-samples.tsv.

- argv: [scheduler, get-schedule, --name, mysched]
  url: "https://us-west-2.console.aws.amazon.com/scheduler/home?region=us-west-2#/schedules/default/mysched"
  source: curated
- argv: [scheduler, get-schedule, --name, mysched, --group-name, mygroup]
  url: "https://us-west-2.console.aws.amazon.com/scheduler/home?region=us-west-2#/schedules/mygroup/mysched"
  source: curated
- argv: [scheduler, get-schedule]
  url: "https://us-west-2.console.aws.amazon.com/scheduler/home?region=us-west-2#/schedules"
  source: curated
- argv: [scheduler, update-schedule, --name, mysched, --schedule-expression, "rate(1 hour)"]
  url: "https://us-west-2.console.aws.amazon.com/scheduler/home?region=us-west-2#/schedules/default/mysched"
  source: curated
- argv: [scheduler, delete-schedule, --name, mysched, --group-name, mygroup]
  region: eu-west-1
  url: "https://eu-west-1.console.aws.amazon.com/scheduler/home?region=eu-west-1#/schedules/mygroup/mysched"
  source: curated

# Not curated: generated list and create wizard stay.
- argv: [scheduler, list-schedules]
  url: "https://us-west-2.console.aws.amazon.com/scheduler/home?region=us-west-2#/schedules"
- argv: [scheduler, create-schedule, --name, mysched]
  url: "https://us-west-2.console.aws.amazon.com/scheduler/home?region=us-west-2#create-schedule"
