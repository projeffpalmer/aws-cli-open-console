# Cases for the curated "aws iam" operations (scripts/console_db/overrides/
# iam.yaml).  Names and ARNs are the samples from snapshots/view-samples.tsv.
# Tier-1 "aws iam" stays in services.yaml.

# Users.
- argv: [iam, list-users]
  url: "https://console.aws.amazon.com/iam/home#/users"
  source: curated
- argv: [iam, get-user, --user-name, alice]
  url: "https://console.aws.amazon.com/iam/home#/users/details/alice"
  source: curated
- argv: [iam, get-user]
  url: "https://console.aws.amazon.com/iam/home#/users"
  source: curated
- argv: [iam, create-user, --user-name, alice]
  url: "https://console.aws.amazon.com/iam/home#/users/create"
  source: curated
- argv: [iam, list-attached-user-policies, --user-name, alice]
  url: "https://console.aws.amazon.com/iam/home#/users/details/alice"
  source: curated
- argv: [iam, wait, user-exists, --user-name, alice]
  url: "https://console.aws.amazon.com/iam/home#/users/details/alice"
  source: curated
- argv: [iam, list-access-keys, --user-name, alice]
  url: "https://console.aws.amazon.com/iam/home#/users/details/alice"
  source: curated
- argv: [iam, list-access-keys]
  url: "https://console.aws.amazon.com/iam/home#/security_credentials"
  source: curated
- argv: [iam, create-access-key, --user-name, alice]
  url: "https://console.aws.amazon.com/iam/home#/users/details/alice"
  source: curated

# Roles.
- argv: [iam, list-roles]
  url: "https://console.aws.amazon.com/iam/home#/roles"
  source: curated
- argv: [iam, get-role, --role-name, MyRole]
  url: "https://console.aws.amazon.com/iam/home#/roles/details/MyRole"
  source: curated
- argv: [iam, create-role, --role-name, MyRole, --assume-role-policy-document, "file://trust.json"]
  url: "https://console.aws.amazon.com/iam/home#/roles/create"
  source: curated
- argv: [iam, list-attached-role-policies, --role-name, MyRole]
  url: "https://console.aws.amazon.com/iam/home#/roles/details/MyRole"
  source: curated
- argv: [iam, put-role-policy, --role-name, MyRole, --policy-name, inline, --policy-document, "file://p.json"]
  url: "https://console.aws.amazon.com/iam/home#/roles/details/MyRole"
  source: curated
- argv: [iam, attach-role-policy, --policy-arn, "arn:aws:iam::123456789012:policy/MyPolicy", --role-name, MyRole]
  url: "https://console.aws.amazon.com/iam/home#/roles/details/MyRole"
  source: curated
- argv: [iam, wait, role-exists, --role-name, MyRole]
  url: "https://console.aws.amazon.com/iam/home#/roles/details/MyRole"
  source: curated

# Groups.
- argv: [iam, list-groups]
  url: "https://console.aws.amazon.com/iam/home#/groups"
  source: curated
- argv: [iam, get-group, --group-name, MyGroup]
  url: "https://console.aws.amazon.com/iam/home#/groups/details/MyGroup"
  source: curated
- argv: [iam, create-group, --group-name, MyGroup]
  url: "https://console.aws.amazon.com/iam/home#/groups/create"
  source: curated

# Policies: the ARN is percent-encoded like go/view?arn= does.
- argv: [iam, list-policies, --scope, Local]
  url: "https://console.aws.amazon.com/iam/home#/policies"
  source: curated
- argv: [iam, get-policy, --policy-arn, "arn:aws:iam::123456789012:policy/MyPolicy"]
  url: "https://console.aws.amazon.com/iam/home#/policies/details/arn%3Aaws%3Aiam%3A%3A123456789012%3Apolicy%2FMyPolicy"
  source: curated
- argv: [iam, get-policy, --policy-arn, "arn:aws:iam::aws:policy/AdministratorAccess"]
  url: "https://console.aws.amazon.com/iam/home#/policies/details/arn%3Aaws%3Aiam%3A%3Aaws%3Apolicy%2FAdministratorAccess"
  source: curated
- argv: [iam, get-policy-version, --policy-arn, "arn:aws:iam::123456789012:policy/MyPolicy", --version-id, v1]
  url: "https://console.aws.amazon.com/iam/home#/policies/details/arn%3Aaws%3Aiam%3A%3A123456789012%3Apolicy%2FMyPolicy"
  source: curated
- argv: [iam, wait, policy-exists, --policy-arn, "arn:aws:iam::123456789012:policy/MyPolicy"]
  url: "https://console.aws.amazon.com/iam/home#/policies/details/arn%3Aaws%3Aiam%3A%3A123456789012%3Apolicy%2FMyPolicy"
  source: curated
- argv: [iam, create-policy, --policy-name, MyPolicy, --policy-document, "file://p.json"]
  url: "https://console.aws.amazon.com/iam/home#/policies/create"
  source: curated

# Account-wide.
- argv: [iam, get-account-summary]
  url: "https://console.aws.amazon.com/iam/home#/home"
  source: curated
- argv: [iam, get-account-authorization-details, --filter, Role]
  url: "https://console.aws.amazon.com/iam/home#/home"
  source: curated

# Identity providers.
- argv: [iam, list-saml-providers]
  url: "https://console.aws.amazon.com/iam/home#/identity_providers"
  source: curated
- argv: [iam, list-open-id-connect-providers]
  url: "https://console.aws.amazon.com/iam/home#/identity_providers"
  source: curated
- argv: [iam, get-saml-provider, --saml-provider-arn, "arn:aws:iam::123456789012:saml-provider/myidp"]
  url: "https://console.aws.amazon.com/iam/home#/identity_providers/details/SAML/arn%3Aaws%3Aiam%3A%3A123456789012%3Asaml-provider%2Fmyidp"
  source: curated
- argv: [iam, get-open-id-connect-provider, --open-id-connect-provider-arn, "arn:aws:iam::123456789012:oidc-provider/token.actions.githubusercontent.com"]
  url: "https://console.aws.amazon.com/iam/home#/identity_providers/details/OPENID/arn%3Aaws%3Aiam%3A%3A123456789012%3Aoidc-provider%2Ftoken.actions.githubusercontent.com"
  source: curated

# Partitions: the global host follows the partition.
- argv: [iam, get-role, --role-name, MyRole]
  region: us-gov-west-1
  partition: aws-us-gov
  url: "https://console.amazonaws-us-gov.com/iam/home#/roles/details/MyRole"
  source: curated

# Not curated: instance profiles have no resolver page; the IAM home stays.
- argv: [iam, list-instance-profiles]
  url: "https://console.aws.amazon.com/iam/home"
  source: derived
