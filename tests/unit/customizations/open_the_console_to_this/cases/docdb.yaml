# Cases for "aws docdb" (curator W3).  No override file: the resolver sends
# every DocumentDB type, id and ARN (arn:aws:docdb:...:cluster:mydocdb,
# view-samples.tsv) to #dashboard, and no other source shows a detail page,
# so the generated entries stay.
- argv: [docdb, describe-db-clusters]
  url: "https://us-west-2.console.aws.amazon.com/docdb/home?region=us-west-2#dashboard"
  source: resolver:list
- argv: [docdb, describe-db-clusters, --db-cluster-identifier, mydocdb]
  url: "https://us-west-2.console.aws.amazon.com/docdb/home?region=us-west-2#dashboard"
- argv: [docdb, describe-db-instances, --db-instance-identifier, mydocdb]
  url: "https://us-west-2.console.aws.amazon.com/docdb/home?region=us-west-2#dashboard"
- argv: [docdb, wait, db-instance-available, --db-instance-identifier, mydocdb]
  url: "https://us-west-2.console.aws.amazon.com/docdb/home?region=us-west-2#dashboard"
