# Cases for the curated "aws s3api" operations (scripts/console_db/
# overrides/s3api.yaml).  Sample bucket and key come from the go/view?arn=
# samples in scripts/console_db/snapshots/view-samples.tsv.
# Tier-1 "aws s3api" stays in services.yaml.

# Buckets list and create page.
- argv: [s3api, list-buckets]
  url: "https://console.aws.amazon.com/s3/buckets?region=us-west-2"
  source: curated
- argv: [s3api, list-buckets]
  region: us-gov-west-1
  partition: aws-us-gov
  url: "https://console.amazonaws-us-gov.com/s3/buckets?region=us-gov-west-1"
  source: curated
- argv: [s3api, create-bucket, --bucket, mybucket, --create-bucket-configuration, "LocationConstraint=us-west-2"]
  url: "https://console.aws.amazon.com/s3/bucket/create?region=us-west-2"
  source: curated

# Bucket page.
- argv: [s3api, head-bucket, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2"
  source: curated
- argv: [s3api, get-bucket-location, "--bucket=mybucket"]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2"
  source: curated
- argv: [s3api, delete-bucket, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2"
  source: curated
- argv: [s3api, list-multipart-uploads, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2"
  source: curated

# Object listings: bucket page, folder view with --prefix.  list-objects
# and list-objects-v2 cut --prefix back to its last "/" (prefix_dir); a
# prefix with no "/" gives the bucket page.
- argv: [s3api, list-objects, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2"
  source: curated
- argv: [s3api, list-objects, --bucket, mybucket, --prefix, "photos/2026"]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&prefix=photos%2F&showversions=false"
  source: curated
- argv: [s3api, list-objects, --bucket, mybucket, --prefix, "photos/2026/"]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&prefix=photos%2F2026%2F&showversions=false"
  source: curated
- argv: [s3api, list-objects-v2, --bucket, mybucket, --prefix, "some/"]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&prefix=some%2F&showversions=false"
  source: curated
- argv: [s3api, list-objects-v2, --bucket, mybucket, --prefix, "photos/2026"]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&prefix=photos%2F&showversions=false"
  source: curated
- argv: [s3api, list-objects-v2, --bucket, mybucket, --prefix, "photos"]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2"
  source: curated
- argv: [s3api, list-object-versions, --bucket, mybucket, --prefix, "some/"]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&prefix=some%2F&showversions=false"
  source: curated

# Object page (--bucket, --key); a trailing outfile is ignored.
- argv: [s3api, get-object, --bucket, mybucket, --key, "some/key.txt", "key.txt"]
  url: "https://console.aws.amazon.com/s3/object/mybucket?region=us-west-2&prefix=some%2Fkey.txt"
  source: curated
# Without --bucket: the buckets list.
- argv: [s3api, get-object]
  url: "https://console.aws.amazon.com/s3/buckets?region=us-west-2"
  source: curated
- argv: [s3api, head-object, --bucket, mybucket, --key, "some/key.txt"]
  url: "https://console.aws.amazon.com/s3/object/mybucket?region=us-west-2&prefix=some%2Fkey.txt"
  source: curated
- argv: [s3api, put-object, --bucket, mybucket, --key, "some/key.txt", --body, "key.txt"]
  url: "https://console.aws.amazon.com/s3/object/mybucket?region=us-west-2&prefix=some%2Fkey.txt"
  source: curated
- argv: [s3api, delete-object, --bucket, mybucket, --key, "some/key.txt"]
  url: "https://console.aws.amazon.com/s3/object/mybucket?region=us-west-2&prefix=some%2Fkey.txt"
  source: curated
- argv: [s3api, copy-object, --copy-source, "mybucket/other.txt", --bucket, mybucket, --key, "some/key.txt"]
  url: "https://console.aws.amazon.com/s3/object/mybucket?region=us-west-2&prefix=some%2Fkey.txt"
  source: curated
- argv: [s3api, get-object-tagging, --bucket, mybucket, --key, "some/key.txt"]
  url: "https://console.aws.amazon.com/s3/object/mybucket?region=us-west-2&prefix=some%2Fkey.txt"
  source: curated
- argv: [s3api, get-object-acl, --bucket, mybucket, --key, "some/key.txt"]
  url: "https://console.aws.amazon.com/s3/object/mybucket?region=us-west-2&prefix=some%2Fkey.txt"
  source: curated

# Permissions tab.
- argv: [s3api, get-bucket-policy, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=permissions"
  source: curated
- argv: [s3api, put-bucket-policy, --bucket, mybucket, --policy, "file://policy.json"]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=permissions"
  source: curated
- argv: [s3api, get-bucket-acl, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=permissions"
  source: curated
- argv: [s3api, get-public-access-block, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=permissions"
  source: curated
- argv: [s3api, get-bucket-cors, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=permissions"
  source: curated

# Properties tab.
- argv: [s3api, get-bucket-versioning, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=properties"
  source: curated
- argv: [s3api, get-bucket-encryption, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=properties"
  source: curated
- argv: [s3api, get-bucket-tagging, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=properties"
  source: curated
- argv: [s3api, get-bucket-website, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=properties"
  source: curated
- argv: [s3api, put-bucket-website, --bucket, mybucket, --website-configuration, "file://website.json"]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=properties"
  source: curated
- argv: [s3api, get-bucket-logging, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=properties"
  source: curated
- argv: [s3api, get-bucket-notification-configuration, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=properties"
  source: curated

# Management tab.
- argv: [s3api, get-bucket-lifecycle-configuration, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=management"
  source: curated
- argv: [s3api, put-bucket-lifecycle-configuration, --bucket, mybucket, --lifecycle-configuration, "file://lifecycle.json"]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=management"
  source: curated
- argv: [s3api, get-bucket-replication, --bucket, mybucket]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=management"
  source: curated
