# Cases for the curated "aws acm" operations (scripts/console_db/overrides/
# acm.yaml).  The certificate ARN is the sample from snapshots/view-samples.tsv.

- argv: [acm, describe-certificate, --certificate-arn, "arn:aws:acm:us-west-2:123456789012:certificate/11111111-2222-3333-4444-555555555555"]
  url: "https://us-west-2.console.aws.amazon.com/acm/home?region=us-west-2#/certificates/11111111-2222-3333-4444-555555555555"
  source: curated
- argv: [acm, describe-certificate, --certificate-arn, "arn:aws:acm:eu-west-1:123456789012:certificate/11111111-2222-3333-4444-555555555555"]
  url: "https://eu-west-1.console.aws.amazon.com/acm/home?region=eu-west-1#/certificates/11111111-2222-3333-4444-555555555555"
  source: curated
- argv: [acm, describe-certificate]
  url: "https://us-west-2.console.aws.amazon.com/acm/home?region=us-west-2#/certificates/list"
  source: curated
- argv: [acm, delete-certificate, --certificate-arn, "arn:aws:acm:us-west-2:123456789012:certificate/11111111-2222-3333-4444-555555555555"]
  url: "https://us-west-2.console.aws.amazon.com/acm/home?region=us-west-2#/certificates/11111111-2222-3333-4444-555555555555"
  source: curated
- argv: [acm, get-certificate, --certificate-arn, "arn:aws:acm:us-west-2:123456789012:certificate/11111111-2222-3333-4444-555555555555"]
  url: "https://us-west-2.console.aws.amazon.com/acm/home?region=us-west-2#/certificates/11111111-2222-3333-4444-555555555555"
  source: curated
- argv: [acm, export-certificate, --certificate-arn, "arn:aws:acm:us-west-2:123456789012:certificate/11111111-2222-3333-4444-555555555555", --passphrase, "fileb://pass.txt"]
  url: "https://us-west-2.console.aws.amazon.com/acm/home?region=us-west-2#/certificates/11111111-2222-3333-4444-555555555555"
  source: curated
- argv: [acm, renew-certificate, --certificate-arn, "arn:aws:acm:us-west-2:123456789012:certificate/11111111-2222-3333-4444-555555555555"]
  url: "https://us-west-2.console.aws.amazon.com/acm/home?region=us-west-2#/certificates/11111111-2222-3333-4444-555555555555"
  source: curated
- argv: [acm, wait, certificate-validated, --certificate-arn, "arn:aws:acm:us-west-2:123456789012:certificate/11111111-2222-3333-4444-555555555555"]
  url: "https://us-west-2.console.aws.amazon.com/acm/home?region=us-west-2#/certificates/11111111-2222-3333-4444-555555555555"
  source: curated
- argv: [acm, request-certificate, --domain-name, www.example.com, --validation-method, DNS]
  url: "https://us-west-2.console.aws.amazon.com/acm/home?region=us-west-2#/certificates/request"
  source: curated
- argv: [acm, import-certificate, --certificate, "fileb://cert.pem", --private-key, "fileb://key.pem"]
  url: "https://us-west-2.console.aws.amazon.com/acm/home?region=us-west-2#/certificates/list"
  source: curated
- argv: [acm, import-certificate, --certificate-arn, "arn:aws:acm:us-west-2:123456789012:certificate/11111111-2222-3333-4444-555555555555", --certificate, "fileb://cert.pem", --private-key, "fileb://key.pem"]
  url: "https://us-west-2.console.aws.amazon.com/acm/home?region=us-west-2#/certificates/11111111-2222-3333-4444-555555555555"
  source: curated

# Not curated: the generated go/list page stays.
- argv: [acm, list-certificates]
  url: "https://us-west-2.console.aws.amazon.com/acm/home?region=us-west-2#/certificates/list"
  source: "resolver:list"
