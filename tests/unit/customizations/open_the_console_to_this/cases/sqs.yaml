# Cases for scripts/console_db/overrides/sqs.yaml.  Sample queue myqueue in
# account 123456789012 from scripts/console_db/snapshots/view-samples.tsv.

# Queue page keyed by the URL-encoded queue URL.
- argv: [sqs, get-queue-attributes, --queue-url, "https://sqs.us-west-2.amazonaws.com/123456789012/myqueue", --attribute-names, All]
  url: "https://us-west-2.console.aws.amazon.com/sqs/v3/home?region=us-west-2#/queues/https%3A%2F%2Fsqs.us-west-2.amazonaws.com%2F123456789012%2Fmyqueue"
  source: curated
- argv: [sqs, get-queue-attributes]
  url: "https://us-west-2.console.aws.amazon.com/sqs/v3/home?region=us-west-2#/queues"
  source: curated
- argv: [sqs, set-queue-attributes, --queue-url, "https://sqs.us-west-2.amazonaws.com/123456789012/myqueue", --attributes, "VisibilityTimeout=60"]
  url: "https://us-west-2.console.aws.amazon.com/sqs/v3/home?region=us-west-2#/queues/https%3A%2F%2Fsqs.us-west-2.amazonaws.com%2F123456789012%2Fmyqueue"
  source: curated
- argv: [sqs, send-message, --queue-url, "https://sqs.us-west-2.amazonaws.com/123456789012/myqueue", --message-body, hello]
  url: "https://us-west-2.console.aws.amazon.com/sqs/v3/home?region=us-west-2#/queues/https%3A%2F%2Fsqs.us-west-2.amazonaws.com%2F123456789012%2Fmyqueue"
  source: curated
- argv: [sqs, send-message-batch, --queue-url, "https://sqs.us-west-2.amazonaws.com/123456789012/myqueue.fifo", --entries, "file://batch.json"]
  url: "https://us-west-2.console.aws.amazon.com/sqs/v3/home?region=us-west-2#/queues/https%3A%2F%2Fsqs.us-west-2.amazonaws.com%2F123456789012%2Fmyqueue.fifo"
  source: curated
- argv: [sqs, receive-message, --queue-url, "https://sqs.us-west-2.amazonaws.com/123456789012/myqueue"]
  url: "https://us-west-2.console.aws.amazon.com/sqs/v3/home?region=us-west-2#/queues/https%3A%2F%2Fsqs.us-west-2.amazonaws.com%2F123456789012%2Fmyqueue"
  source: curated
- argv: [sqs, purge-queue, --queue-url, "https://sqs.eu-west-1.amazonaws.com/123456789012/myqueue"]
  region: eu-west-1
  url: "https://eu-west-1.console.aws.amazon.com/sqs/v3/home?region=eu-west-1#/queues/https%3A%2F%2Fsqs.eu-west-1.amazonaws.com%2F123456789012%2Fmyqueue"
  source: curated
- argv: [sqs, delete-queue, --queue-url, "https://sqs.us-west-2.amazonaws.com/123456789012/myqueue"]
  url: "https://us-west-2.console.aws.amazon.com/sqs/v3/home?region=us-west-2#/queues/https%3A%2F%2Fsqs.us-west-2.amazonaws.com%2F123456789012%2Fmyqueue"
  source: curated

# --queue-name: the list, or the create wizard.
- argv: [sqs, get-queue-url, --queue-name, myqueue]
  url: "https://us-west-2.console.aws.amazon.com/sqs/v3/home?region=us-west-2#/queues"
  source: curated
- argv: [sqs, create-queue, --queue-name, myqueue]
  url: "https://us-west-2.console.aws.amazon.com/sqs/v3/home?region=us-west-2#/create-queue"
  source: curated

# Not curated: the generated queues list stays.
- argv: [sqs, list-queues]
  url: "https://us-west-2.console.aws.amazon.com/sqs/v3/home?region=us-west-2#/queues"
