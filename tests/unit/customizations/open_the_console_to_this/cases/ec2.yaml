# Cases for "aws ec2" (scripts/console_db/overrides/ec2.yaml).  Sample ids
# come from scripts/console_db/snapshots/view-samples.tsv; the reserved
# instance, spot request and placement group ids are the placeholders used
# in the live resolver probes.  Tier-1 "aws ec2" stays in services.yaml.
# The first block covers reviewed generated entries (not curated).

# Generated entries kept as they are.
- argv: [ec2, describe-instances]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2#Instances:"
  source: "resolver:list+view"
- argv: [ec2, describe-instances, --instance-ids, i-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2#InstanceDetails:instanceId=i-0123456789abcdef0"
  source: "resolver:list+view"
- argv: [ec2, stop-instances, --instance-ids, i-0123456789abcdef0, i-0123456789abcdef1]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2#Instances:"
  source: "resolver:list+view"
- argv: [ec2, run-instances, --image-id, ami-0123456789abcdef0, --instance-type, t3.micro]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2#LaunchInstances:"
  source: "resolver:create"
- argv: [ec2, wait, instance-running, --instance-ids, i-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2#InstanceDetails:instanceId=i-0123456789abcdef0"
  source: "resolver:list+view"
- argv: [ec2, describe-vpcs, --vpc-ids, vpc-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/vpc/home?region=us-west-2#VpcDetails:VpcId=vpc-0123456789abcdef0"
  source: "resolver:list+view"
- argv: [ec2, describe-volumes, --volume-ids, vol-0123456789abcdef0]
  region: eu-central-1
  url: "https://eu-central-1.console.aws.amazon.com/ec2/home?region=eu-central-1#VolumeDetails:volumeId=vol-0123456789abcdef0"
  source: "resolver:list+view"

