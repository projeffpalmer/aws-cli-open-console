# Cases for scripts/console_db/overrides/kinesis.yaml (curator W3) plus
# generated entries that were reviewed and kept.  Sample stream mystream and
# its ARN come from view-samples.tsv.
- argv: [kinesis, list-streams]
  url: "https://us-west-2.console.aws.amazon.com/kinesis/home?region=us-west-2#/streams/list"
  source: resolver:list
- argv: [kinesis, describe-stream, --stream-name, mystream]
  url: "https://us-west-2.console.aws.amazon.com/kinesis/home?region=us-west-2#/streams/details/mystream/details"
  source: curated
- argv: [kinesis, describe-stream, --stream-arn, "arn:aws:kinesis:us-west-2:123456789012:stream/mystream"]
  url: "https://us-west-2.console.aws.amazon.com/kinesis/home?region=us-west-2#/streams/details/mystream/details"
  source: curated
- argv: [kinesis, describe-stream-summary, --stream-name, mystream]
  url: "https://us-west-2.console.aws.amazon.com/kinesis/home?region=us-west-2#/streams/details/mystream/details"
  source: curated
- argv: [kinesis, describe-stream-summary]
  url: "https://us-west-2.console.aws.amazon.com/kinesis/home?region=us-west-2#/streams/list"
  source: curated
- argv: [kinesis, create-stream, --stream-name, mystream, --shard-count, "1"]
  url: "https://us-west-2.console.aws.amazon.com/kinesis/home?region=us-west-2#/streams/create"
  source: curated
- argv: [kinesis, put-record, --stream-name, mystream, --partition-key, k, --data, aGVsbG8=]
  url: "https://us-west-2.console.aws.amazon.com/kinesis/home?region=us-west-2#/streams/details/mystream/monitoring"
  source: curated
- argv: [kinesis, put-records, --stream-arn, "arn:aws:kinesis:us-west-2:123456789012:stream/mystream", --records, "Data=aGVsbG8=,PartitionKey=k"]
  url: "https://us-west-2.console.aws.amazon.com/kinesis/home?region=us-west-2#/streams/details/mystream/monitoring"
  source: curated
- argv: [kinesis, delete-stream, --stream-name, mystream]
  url: "https://us-west-2.console.aws.amazon.com/kinesis/home?region=us-west-2#/streams/details/mystream/monitoring"
  source: curated
- argv: [kinesis, wait, stream-exists, --stream-name, mystream]
  url: "https://us-west-2.console.aws.amazon.com/kinesis/home?region=us-west-2#/streams/details/mystream/monitoring"
  source: curated
- argv: [kinesis, wait, stream-not-exists, --stream-arn, "arn:aws:kinesis:us-west-2:123456789012:stream/mystream"]
  url: "https://us-west-2.console.aws.amazon.com/kinesis/home?region=us-west-2#/streams/details/mystream/monitoring"
  source: curated
