- argv: [bedrock, get-custom-model, --model-identifier, "arn:aws:bedrock:us-west-2:123456789012:custom-model/mycm"]
  url: "https://us-west-2.console.aws.amazon.com/bedrock/home#/finetune/model?arn=arn:aws:bedrock:us-west-2:123456789012:custom-model/mycm"
  source: curated
- argv: [bedrock, get-custom-model, --model-identifier, mycm]
  url: "https://us-west-2.console.aws.amazon.com/bedrock/home"
  source: curated
- argv: [bedrock, get-model-customization-job, --job-identifier, "arn:aws:bedrock:us-west-2:123456789012:model-customization-job/abc"]
  url: "https://us-west-2.console.aws.amazon.com/bedrock/home#/finetune/job?arn=arn:aws:bedrock:us-west-2:123456789012:model-customization-job/abc"
  source: curated
- argv: [bedrock, stop-model-customization-job, --job-identifier, "arn:aws:bedrock:us-west-2:123456789012:model-customization-job/abc"]
  url: "https://us-west-2.console.aws.amazon.com/bedrock/home#/finetune/job?arn=arn:aws:bedrock:us-west-2:123456789012:model-customization-job/abc"
