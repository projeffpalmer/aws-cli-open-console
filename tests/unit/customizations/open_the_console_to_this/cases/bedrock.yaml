- argv: [bedrock, list-inference-profiles]
  url: "https://us-west-2.console.aws.amazon.com/bedrock/home?region=us-west-2#/inference-profiles"
  source: curated
- argv: [bedrock, get-inference-profile, --inference-profile-identifier, us.anthropic.claude-3]
