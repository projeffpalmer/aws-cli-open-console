- argv: [bedrock, get-inference-profile, --inference-profile-identifier, "arn:aws:bedrock:us-east-1:123456789012:inference-profile/us.anthropic.claude-3"]
  region: us-east-1
  url: "https://us-east-1.console.aws.amazon.com/bedrock/home?region=us-east-1#/inference-profiles/us.anthropic.claude-3"
  source: curated
