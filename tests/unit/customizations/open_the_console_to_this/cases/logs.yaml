# Cases for scripts/console_db/overrides/logs.yaml.  Sample group, stream
# and ARNs come from scripts/console_db/snapshots/view-samples.tsv (log
# group /aws/lambda/myfn, account 123456789012).  Slashes encode as %2F,
# which is what the resolver returns for the go/view?arn= form.

# Log group page from --log-group-name or --log-group-identifier.
- argv: [logs, describe-log-streams, --log-group-name, /aws/lambda/myfn]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#logsV2:log-groups/log-group/%2Faws%2Flambda%2Fmyfn"
  source: curated
- argv: [logs, describe-log-streams, --log-group-identifier, "arn:aws:logs:us-west-2:123456789012:log-group:/aws/lambda/myfn"]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#logsV2:log-groups/log-group/%2Faws%2Flambda%2Fmyfn"
  source: curated
- argv: [logs, describe-log-streams, --log-group-identifier, /aws/lambda/myfn]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#logsV2:log-groups/log-group/%2Faws%2Flambda%2Fmyfn"
  source: curated
- argv: [logs, describe-log-streams]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home"
  source: curated
- argv: [logs, filter-log-events, --log-group-name, /aws/lambda/myfn, --filter-pattern, ERROR]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#logsV2:log-groups/log-group/%2Faws%2Flambda%2Fmyfn"
  source: curated
- argv: [logs, put-retention-policy, --log-group-name, /aws/lambda/myfn, --retention-in-days, "14"]
  region: ap-southeast-2
  url: "https://ap-southeast-2.console.aws.amazon.com/cloudwatch/home?region=ap-southeast-2#logsV2:log-groups/log-group/%2Faws%2Flambda%2Fmyfn"
  source: curated
- argv: [logs, put-metric-filter, --log-group-name, /aws/lambda/myfn, --filter-name, errors, --filter-pattern, ERROR]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#logsV2:log-groups/log-group/%2Faws%2Flambda%2Fmyfn"
  source: curated
- argv: [logs, describe-metric-filters, --log-group-name, /aws/lambda/myfn]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#logsV2:log-groups/log-group/%2Faws%2Flambda%2Fmyfn"
  source: curated

# Log events of one stream; brackets and $ are encoded like the resolver.
- argv: [logs, get-log-events, --log-group-name, /aws/lambda/myfn, --log-stream-name, "2026/01/01/[$LATEST]abc"]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#logsV2:log-groups/log-group/%2Faws%2Flambda%2Fmyfn/log-events/2026%2F01%2F01%2F%5B%24LATEST%5Dabc"
  source: curated
- argv: [logs, get-log-events, --log-group-identifier, "arn:aws:logs:us-west-2:123456789012:log-group:/aws/lambda/myfn", --log-stream-name, abc]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#logsV2:log-groups/log-group/%2Faws%2Flambda%2Fmyfn/log-events/abc"
  source: curated
- argv: [logs, get-log-events, --log-group-name, /aws/lambda/myfn]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#logsV2:log-groups/log-group/%2Faws%2Flambda%2Fmyfn"
  source: curated

# Create wizard, even with a name.
- argv: [logs, create-log-group, --log-group-name, /aws/lambda/myfn]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#logsV2:log-groups/create-log-group"
  source: curated

# Custom subcommands: tail (positional) and start-live-tail.
- argv: [logs, tail, /aws/lambda/myfn, --follow]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#logsV2:log-groups/log-group/%2Faws%2Flambda%2Fmyfn"
  source: curated
- argv: [logs, tail, "arn:aws:logs:us-west-2:123456789012:log-group:/aws/lambda/myfn", --since, 1h]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#logsV2:log-groups/log-group/%2Faws%2Flambda%2Fmyfn"
  source: curated
- argv: [logs, tail]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home"
  source: curated
- argv: [logs, start-live-tail, --log-group-identifiers, "arn:aws:logs:us-west-2:123456789012:log-group:/aws/lambda/myfn"]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#logsV2:log-groups/log-group/%2Faws%2Flambda%2Fmyfn"
  source: curated
- argv: [logs, start-live-tail, --log-group-identifiers, /aws/lambda/myfn]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#logsV2:log-groups/log-group/%2Faws%2Flambda%2Fmyfn"
  source: curated

# Not curated: the generated delete-log-group page stays.
- argv: [logs, delete-log-group, --log-group-name, /aws/lambda/myfn]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#logsV2:log-groups/log-group/%2Faws%2Flambda%2Fmyfn"
