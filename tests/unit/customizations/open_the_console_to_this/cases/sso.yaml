# Cases for the curated "aws sso" commands (scripts/console_db/overrides/
# sso.yaml): the IAM Identity Center console of the region.

- argv: [sso, login]
  url: "https://us-west-2.console.aws.amazon.com/singlesignon/home?region=us-west-2"
  source: curated
- argv: [sso, logout]
  region: eu-central-1
  url: "https://eu-central-1.console.aws.amazon.com/singlesignon/home?region=eu-central-1"
  source: curated
- argv: [sso, list-accounts, --access-token, token]
  url: "https://us-west-2.console.aws.amazon.com/singlesignon/home?region=us-west-2"
  source: curated

# Not curated: the generated service home stays.
- argv: [sso, get-role-credentials, --role-name, MyRole, --account-id, "111111111111", --access-token, token]
  url: "https://us-west-2.console.aws.amazon.com/singlesignon/home"
  source: service-home
