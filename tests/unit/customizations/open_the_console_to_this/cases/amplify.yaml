# Cases for the curated "aws amplify" nodes (scripts/console_db/overrides/amplify.yaml).
# Sample app id abc and branch main come from view-samples.tsv and the go/view?arn= probes.
- argv: [amplify, list-apps]
  url: "https://us-west-2.console.aws.amazon.com/amplify/apps?region=us-west-2"
- argv: [amplify, get-app, --app-id, abc]
  url: "https://us-west-2.console.aws.amazon.com/amplify/apps/abc/overview?region=us-west-2"
- argv: [amplify, create-app, --name, myapp]
  url: "https://us-west-2.console.aws.amazon.com/amplify/create/add-repo?selectTemplate"
  source: curated
- argv: [amplify, list-branches, --app-id, abc]
  url: "https://us-west-2.console.aws.amazon.com/amplify/apps/abc/overview?region=us-west-2"
  source: curated
- argv: [amplify, create-branch, --app-id, abc, --branch-name, dev]
  url: "https://us-west-2.console.aws.amazon.com/amplify/apps/abc/overview?region=us-west-2"
  source: curated
- argv: [amplify, get-branch, --app-id, abc, --branch-name, main]
  url: "https://us-west-2.console.aws.amazon.com/amplify/apps/abc/branches/main?region=us-west-2"
  source: curated
- argv: [amplify, update-branch, --app-id, abc, --branch-name, main, --enable-auto-build]
  url: "https://us-west-2.console.aws.amazon.com/amplify/apps/abc/branches/main?region=us-west-2"
  source: curated
- argv: [amplify, delete-branch, --app-id, abc, --branch-name, main]
  url: "https://us-west-2.console.aws.amazon.com/amplify/apps/abc/branches/main?region=us-west-2"
  source: curated
- argv: [amplify, start-job, --app-id, abc, --branch-name, main, --job-type, RELEASE]
  url: "https://us-west-2.console.aws.amazon.com/amplify/apps/abc/branches/main?region=us-west-2"
  source: curated
- argv: [amplify, list-jobs, --app-id, abc, --branch-name, main]
  url: "https://us-west-2.console.aws.amazon.com/amplify/apps/abc/branches/main?region=us-west-2"
  source: curated
- argv: [amplify, get-job, --app-id, abc, --branch-name, main, --job-id, "1"]
  url: "https://us-west-2.console.aws.amazon.com/amplify/apps/abc/branches/main?region=us-west-2"
  source: curated
- argv: [amplify, stop-job, --app-id, abc, --branch-name, main, --job-id, "1"]
  url: "https://us-west-2.console.aws.amazon.com/amplify/apps/abc/branches/main?region=us-west-2"
  source: curated
- argv: [amplify, create-deployment, --app-id, abc, --branch-name, main]
  url: "https://us-west-2.console.aws.amazon.com/amplify/apps/abc/branches/main?region=us-west-2"
  source: curated
- argv: [amplify, list-jobs, --app-id, abc]
  url: "https://us-west-2.console.aws.amazon.com/amplify/apps/abc/overview?region=us-west-2"
  source: curated
