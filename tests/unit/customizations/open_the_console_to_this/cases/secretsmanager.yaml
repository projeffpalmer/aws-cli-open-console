# Cases for "aws secretsmanager" (scripts/console_db/overrides/
# secretsmanager.yaml curates create-secret only).  Secret names are the
# samples from snapshots/view-samples.tsv.

- argv: [secretsmanager, create-secret, --name, mysecret, --secret-string, "{}"]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/newsecret?region=us-west-2"
  source: curated
- argv: [secretsmanager, create-secret, --name, prod/db/password]
  region: eu-west-1
  url: "https://eu-west-1.console.aws.amazon.com/secretsmanager/newsecret?region=eu-west-1"
  source: curated

# Secret page from --secret-id (secret_name): a secret ARN loses its
# -AbCdEf suffix like go/view?arn= does; a plain name is kept.
- argv: [secretsmanager, describe-secret, --secret-id, mysecret]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/secret?region=us-west-2&name=mysecret"
  source: curated
- argv: [secretsmanager, describe-secret, --secret-id, "arn:aws:secretsmanager:us-west-2:123456789012:secret:mysecret-AbCdEf"]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/secret?region=us-west-2&name=mysecret"
  source: curated
- argv: [secretsmanager, get-secret-value, --secret-id, "arn:aws:secretsmanager:us-west-2:123456789012:secret:prod/db/password-AbCdEf"]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/secret?region=us-west-2&name=prod%2Fdb%2Fpassword"
  source: curated
- argv: [secretsmanager, get-secret-value, --secret-id, prod/db/password]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/secret?region=us-west-2&name=prod%2Fdb%2Fpassword"
  source: curated
- argv: [secretsmanager, put-secret-value, --secret-id, mysecret, --secret-string, "{}"]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/secret?region=us-west-2&name=mysecret"
  source: curated
- argv: [secretsmanager, update-secret, --secret-id, "arn:aws:secretsmanager:us-west-2:123456789012:secret:mysecret-AbCdEf", --description, x]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/secret?region=us-west-2&name=mysecret"
  source: curated
- argv: [secretsmanager, update-secret-version-stage, --secret-id, mysecret, --version-stage, AWSCURRENT]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/secret?region=us-west-2&name=mysecret"
  source: curated
- argv: [secretsmanager, list-secret-version-ids, --secret-id, mysecret]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/secret?region=us-west-2&name=mysecret"
  source: curated
- argv: [secretsmanager, rotate-secret, --secret-id, mysecret]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/secret?region=us-west-2&name=mysecret"
  source: curated
- argv: [secretsmanager, cancel-rotate-secret, --secret-id, "arn:aws:secretsmanager:us-west-2:123456789012:secret:mysecret-AbCdEf"]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/secret?region=us-west-2&name=mysecret"
  source: curated
- argv: [secretsmanager, replicate-secret-to-regions, --secret-id, mysecret, --add-replica-regions, Region=eu-west-1]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/secret?region=us-west-2&name=mysecret"
  source: curated
- argv: [secretsmanager, delete-secret, --secret-id, mysecret, --recovery-window-in-days, "7"]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/secret?region=us-west-2&name=mysecret"
  source: curated
- argv: [secretsmanager, restore-secret, --secret-id, mysecret]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/secret?region=us-west-2&name=mysecret"
  source: curated
- argv: [secretsmanager, describe-secret]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/listsecrets?region=us-west-2"
  source: curated

# Generated entry that stays.
- argv: [secretsmanager, list-secrets]
  url: "https://us-west-2.console.aws.amazon.com/secretsmanager/listsecrets?region=us-west-2"
  source: "resolver:list"
