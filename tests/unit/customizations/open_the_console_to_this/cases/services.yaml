# Tier-1 cases: service homes, special hosts, partitions and fallbacks.
# Only tier-1 nodes here, so these stay true while tier-2/3 URLs change.

# Regional service home.
- argv: [ec2]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2"
  source: "resolver:service"
- argv: [ec2]
  region: eu-central-1
  url: "https://eu-central-1.console.aws.amazon.com/ec2/home?region=eu-central-1"
  source: "resolver:service"
- argv: [sqs]
  url: "https://us-west-2.console.aws.amazon.com/sqs/v3/home"
  source: "resolver:service"

# Global service homes.
- argv: [iam]
  url: "https://console.aws.amazon.com/iam/home"
  source: "resolver:service"
- argv: [s3]
  url: "https://console.aws.amazon.com/s3/buckets?region=us-west-2"
  source: curated
- argv: [s3api]
  url: "https://console.aws.amazon.com/s3/home"
  source: "resolver:service"
- argv: [route53]
  url: "https://console.aws.amazon.com/route53/v2/home"
  source: "resolver:service"

# Special hosts are literal.
- argv: [lightsail]
  url: "https://lightsail.aws.amazon.com/ls/webapp/home"
  source: "resolver:service"
- argv: [quicksight]
  url: "https://quicksight.aws.amazon.com/sn/start"
  source: "resolver:service"
- argv: [support]
  url: "https://support.console.aws.amazon.com/support/home#/"
  source: "resolver:service"

# Partitions.
- argv: [iam]
  region: us-gov-west-1
  partition: aws-us-gov
  url: "https://console.amazonaws-us-gov.com/iam/home"
- argv: [ec2]
  region: cn-north-1
  partition: aws-cn
  url: "https://cn-north-1.console.amazonaws.cn/ec2/home?region=cn-north-1"

# Custom tier-1 command without a console page: the console home.
- argv: [configure]
  url: "https://console.aws.amazon.com/console/home?region=us-west-2"
  source: "console-home"

# An unknown subcommand keeps the deepest matched node (the service home);
# options after the service do not change a tier-1 page.
- argv: [ec2, not-a-real-subcommand, extra]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2"
  source: "resolver:service"
- argv: [iam, --no-paginate]
  url: "https://console.aws.amazon.com/iam/home"
  source: "resolver:service"

# A command that is not in the database: the console resolver.
- argv: [not-a-real-service]
  url: "https://console.aws.amazon.com/go/view?service=not-a-real-service&region=us-west-2"
  source: "resolver:fallback"
