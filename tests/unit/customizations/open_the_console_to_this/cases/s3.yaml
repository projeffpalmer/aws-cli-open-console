# Cases for the curated "aws s3" subcommands (scripts/console_db/overrides/
# s3.yaml).  Sample bucket and keys come from the go/view?arn= samples in
# scripts/console_db/snapshots/view-samples.tsv and the contract example.
# Tier-1 "aws s3" stays in services.yaml.

# ls: buckets list, bucket page, folder view.
- argv: [s3, ls]
  url: "https://console.aws.amazon.com/s3/buckets?region=us-west-2"
  source: curated
- argv: [s3, ls, "s3://mybucket"]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2"
  source: curated
- argv: [s3, ls, "s3://photos/2026/"]
  url: "https://console.aws.amazon.com/s3/buckets/photos?region=us-west-2&prefix=2026%2F&showversions=false"
  source: curated

# cp / mv / sync: the S3 side of the transfer.  A single key opens its
# object page (s3_target_object); a key ending in "/" or --recursive opens
# the folder view.
- argv: [s3, cp, ./report.csv, "s3://mybucket/reports/2026/report.csv"]
  url: "https://console.aws.amazon.com/s3/object/mybucket?region=us-west-2&prefix=reports%2F2026%2Freport.csv"
  source: curated
- argv: [s3, cp, "s3://mybucket/some/key.txt", ./key.txt]
  url: "https://console.aws.amazon.com/s3/object/mybucket?region=us-west-2&prefix=some%2Fkey.txt"
  source: curated
- argv: [s3, cp, ./report.csv, "s3://mybucket/reports/2026/"]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&prefix=reports%2F2026%2F&showversions=false"
  source: curated
- argv: [s3, cp, ./site, "s3://mybucket/site/", --recursive]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&prefix=site%2F&showversions=false"
  source: curated
- argv: [s3, cp, --recursive, ./site, "s3://mybucket/site"]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2"
  source: curated
- argv: [s3, mv, ./key.txt, "s3://mybucket/some/key.txt"]
  url: "https://console.aws.amazon.com/s3/object/mybucket?region=us-west-2&prefix=some%2Fkey.txt"
  source: curated
- argv: [s3, mv, "s3://mybucket/some/", "s3://mybucket/archive/", --recursive]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&prefix=archive%2F&showversions=false"
  source: curated
- argv: [s3, mv, ./key.txt, "s3://mybucket"]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2"
  source: curated
- argv: [s3, sync, ./site, "s3://mybucket/site/", --delete]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&prefix=site%2F&showversions=false"
  source: curated
- argv: [s3, sync, "s3://mybucket/site/", ./site]
  region: eu-central-1
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=eu-central-1&prefix=site%2F&showversions=false"
  source: curated

# rm: object page, or the folder view for a path ending in "/" or for
# --recursive (the path is a folder: logs -> logs/).
- argv: [s3, rm, "s3://mybucket/logs", --recursive]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&prefix=logs%2F&showversions=false"
  source: curated
- argv: [s3, rm, --recursive, "s3://mybucket/logs"]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&prefix=logs%2F&showversions=false"
  source: curated
- argv: [s3, rm, "s3://mybucket/logs"]
  url: "https://console.aws.amazon.com/s3/object/mybucket?region=us-west-2&prefix=logs"
  source: curated
- argv: [s3, rm, "s3://mybucket", --recursive]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2"
  source: curated
- argv: [s3, rm, "s3://mybucket/some/key.txt"]
  url: "https://console.aws.amazon.com/s3/object/mybucket?region=us-west-2&prefix=some%2Fkey.txt"
  source: curated
- argv: [s3, rm, "s3://mybucket/some/", --recursive]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&prefix=some%2F&showversions=false"
  source: curated

# mb / rb.
- argv: [s3, mb, "s3://mybucket"]
  url: "https://console.aws.amazon.com/s3/bucket/create?region=us-west-2"
  source: curated
- argv: [s3, rb, "s3://mybucket", --force]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2"
  source: curated

# presign: object page; a space is encoded %20 like the resolver does.
- argv: [s3, presign, "s3://mybucket/some/key.txt", --expires-in, "604800"]
  url: "https://console.aws.amazon.com/s3/object/mybucket?region=us-west-2&prefix=some%2Fkey.txt"
  source: curated
- argv: [s3, presign, "s3://mybucket/a b.txt"]
  url: "https://console.aws.amazon.com/s3/object/mybucket?region=us-west-2&prefix=a%20b.txt"
  source: curated

# website: the bucket's Properties tab.
- argv: [s3, website, "s3://mybucket/", --index-document, index.html]
  url: "https://console.aws.amazon.com/s3/buckets/mybucket?region=us-west-2&tab=properties"
  source: curated
