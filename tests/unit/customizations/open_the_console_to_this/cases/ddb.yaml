# Cases for the curated "aws ddb" subcommands (staged by curator W3).
- argv: [ddb, put, MyTable, '{"pk": "a"}']
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#table?name=MyTable"
  source: curated
- argv: [ddb, select, MyTable, --projection, pk]
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#table?name=MyTable"
  source: curated
- argv: [ddb, select, MyTable]
  region: eu-west-1
  url: "https://eu-west-1.console.aws.amazon.com/dynamodbv2/home?region=eu-west-1#table?name=MyTable"
  source: curated
