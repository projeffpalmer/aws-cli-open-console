# Cases for scripts/console_db/overrides/dynamodb.yaml (curator W3) plus
# generated entries that were reviewed and kept.  Sample table MyTable and
# the backup ARN come from the go/view?arn= probes in the override file.

# Kept generated entries: tables list, table page.
- argv: [dynamodb, list-tables]
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#table"
  source: resolver:list
- argv: [dynamodb, describe-table, --table-name, MyTable]
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#table?name=MyTable"
  source: resolver:list+view
- argv: [dynamodb, wait, table-exists, --table-name, MyTable]
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#table?name=MyTable"

# Create wizards.
- argv: [dynamodb, create-table, --table-name, MyTable, --billing-mode, PAY_PER_REQUEST]
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#create-table"
  source: curated
- argv: [dynamodb, wizard, new-table]
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#create-table"
  source: curated

# Item operations and table settings: the table page.
- argv: [dynamodb, scan, --table-name, MyTable]
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#table?name=MyTable"
  source: curated
- argv: [dynamodb, scan]
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#table"
  source: curated
- argv: [dynamodb, query, --table-name, MyTable, --key-condition-expression, "pk = :v"]
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#table?name=MyTable"
  source: curated
- argv: [dynamodb, get-item, --table-name, MyTable, --key, '{"pk": {"S": "a"}}']
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#table?name=MyTable"
  source: curated
- argv: [dynamodb, put-item, --table-name, MyTable, --item, '{"pk": {"S": "a"}}']
  region: eu-west-1
  url: "https://eu-west-1.console.aws.amazon.com/dynamodbv2/home?region=eu-west-1#table?name=MyTable"
  source: curated
- argv: [dynamodb, update-item, --table-name, MyTable, --key, '{"pk": {"S": "a"}}']
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#table?name=MyTable"
  source: curated
- argv: [dynamodb, delete-item, --table-name, MyTable, --key, '{"pk": {"S": "a"}}']
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#table?name=MyTable"
  source: curated
- argv: [dynamodb, describe-time-to-live, --table-name, MyTable]
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#table?name=MyTable"
  source: curated
- argv: [dynamodb, update-time-to-live, --table-name, MyTable, --time-to-live-specification, "Enabled=true,AttributeName=ttl"]
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#table?name=MyTable"
  source: curated
- argv: [dynamodb, describe-continuous-backups, --table-name, MyTable]
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#table?name=MyTable"
  source: curated

# Backups.
- argv: [dynamodb, list-backups, --table-name, MyTable]
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#table?name=MyTable"
  source: curated
- argv: [dynamodb, list-backups]
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home"
  source: curated
- argv: [dynamodb, describe-backup, --backup-arn, "arn:aws:dynamodb:us-west-2:123456789012:table/MyTable/backup/01234567890123-abcdefgh"]
  url: "https://us-west-2.console.aws.amazon.com/dynamodbv2/home?region=us-west-2#backup-details?backupArn=arn:aws:dynamodb:us-west-2:123456789012:table/MyTable/backup/01234567890123-abcdefgh"
  source: curated
