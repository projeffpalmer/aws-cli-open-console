# Cases for "aws neptune" (curator W3).  No override file: the resolver
# sends every Neptune type, id and ARN (arn:aws:neptune-db:...:cluster:
# myneptune, view-samples.tsv) to /neptune/home?region=<r>, and no other
# source shows a detail page, so the generated entries stay.
- argv: [neptune, describe-db-clusters]
  url: "https://us-west-2.console.aws.amazon.com/neptune/home?region=us-west-2"
  source: derived
- argv: [neptune, describe-db-clusters, --db-cluster-identifier, myneptune]
  url: "https://us-west-2.console.aws.amazon.com/neptune/home?region=us-west-2"
- argv: [neptune, describe-db-instances, --db-instance-identifier, myneptune]
  url: "https://us-west-2.console.aws.amazon.com/neptune/home?region=us-west-2"
