# Cases for "aws elb" (Classic Load Balancers;
# scripts/console_db/overrides/elb.yaml).  "my-elb" is the name used in the
# live go/view?arn=...:loadbalancer/my-elb probe.  Tier-1 "aws elb" stays
# in services.yaml.

- argv: [elb, describe-load-balancers]
  url: "https://us-west-2.console.aws.amazon.com/ec2/v2/home?region=us-west-2#LoadBalancers:sort=loadBalancerName"
  source: curated
- argv: [elb, describe-load-balancers, --load-balancer-names, my-elb]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2#LoadBalancer:loadBalancerArn=my-elb"
  source: curated
- argv: [elb, describe-load-balancers, --load-balancer-names, my-elb, other-elb]
  url: "https://us-west-2.console.aws.amazon.com/ec2/v2/home?region=us-west-2#LoadBalancers:sort=loadBalancerName"
  source: curated
- argv: [elb, describe-instance-health, --load-balancer-name, my-elb]
  region: eu-central-1
  url: "https://eu-central-1.console.aws.amazon.com/ec2/home?region=eu-central-1#LoadBalancer:loadBalancerArn=my-elb"
  source: curated
- argv: [elb, register-instances-with-load-balancer, --load-balancer-name, my-elb, --instances, i-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2#LoadBalancer:loadBalancerArn=my-elb"
  source: curated
- argv: [elb, deregister-instances-from-load-balancer, --load-balancer-name, my-elb, --instances, i-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2#LoadBalancer:loadBalancerArn=my-elb"
  source: curated
- argv: [elb, configure-health-check, --load-balancer-name, my-elb, --health-check, "Target=HTTP:80/,Interval=30,UnhealthyThreshold=2,HealthyThreshold=2,Timeout=3"]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2#LoadBalancer:loadBalancerArn=my-elb"
  source: curated
- argv: [elb, describe-load-balancer-attributes, --load-balancer-name, my-elb]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2#LoadBalancer:loadBalancerArn=my-elb"
  source: curated
- argv: [elb, wait, any-instance-in-service, --load-balancer-name, my-elb]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2#LoadBalancer:loadBalancerArn=my-elb"
  source: curated
- argv: [elb, wait, instance-in-service, --load-balancer-name, my-elb, --instances, InstanceId=i-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2#LoadBalancer:loadBalancerArn=my-elb"
  source: curated
- argv: [elb, wait, instance-deregistered, --load-balancer-name, my-elb]
  url: "https://us-west-2.console.aws.amazon.com/ec2/home?region=us-west-2#LoadBalancer:loadBalancerArn=my-elb"
  source: curated
