# Cases for scripts/console_db/overrides/efs.yaml (curator W3) plus
# generated entries that were reviewed and kept.  Sample ids come from
# view-samples.tsv and the live access-point ARN probe.
- argv: [efs, describe-file-systems, --file-system-id, fs-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/efs/home?region=us-west-2#/file-systems/fs-0123456789abcdef0"
  source: resolver:list+view
- argv: [efs, create-file-system, --creation-token, demo]
  url: "https://us-west-2.console.aws.amazon.com/efs/home?region=us-west-2#/file-systems"
- argv: [efs, describe-mount-targets, --file-system-id, fs-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/efs/home?region=us-west-2#/file-systems/fs-0123456789abcdef0"
  source: curated
- argv: [efs, describe-mount-targets, --mount-target-id, fsmt-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/efs/home?region=us-west-2#/file-systems"
  source: curated
- argv: [efs, describe-access-points, --access-point-id, fsap-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/efs/home?region=us-west-2#/access-points/fsap-0123456789abcdef0"
  source: curated
- argv: [efs, describe-access-points, --file-system-id, fs-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/efs/home?region=us-west-2#/file-systems/fs-0123456789abcdef0"
  source: curated
- argv: [efs, describe-access-points]
  url: "https://us-west-2.console.aws.amazon.com/efs/home?region=us-west-2#/access-points"
  source: curated
