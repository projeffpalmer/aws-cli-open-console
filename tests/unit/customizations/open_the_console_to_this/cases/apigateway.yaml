# Cases for the curated "aws apigateway" nodes (scripts/console_db/overrides/apigateway.yaml).
# Sample REST API id abc123, stage prod and key k123 come from view-samples.tsv and the probes.
- argv: [apigateway, get-rest-apis]
  url: "https://us-west-2.console.aws.amazon.com/apigateway/main/apis?region=us-west-2"
- argv: [apigateway, get-rest-api, --rest-api-id, abc123]
