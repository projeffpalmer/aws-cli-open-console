# Cases for "aws bedrock-runtime".  No override file: a foundation-model ARN
# resolves to /bedrock/home (go/view?arn=, 2026-11-04).  The AWS docs
# (bedrock/latest/userguide/model-access.md, fetched 2026-11-04) show only
# https://console.aws.amazon.com/bedrock/home#/providers/anthropic, and
# before_dot of an inference-profile id such as
# us.anthropic.claude-3-haiku-20240307-v1:0 (inference-profiles-support.md)
# gives "us", not the provider, so no provider page is curated; no docs page
# shows a model catalog URL.  invoke-model-with-response-stream is not in
# the database (event-stream output), so it falls back to the service node.
- argv: [bedrock-runtime, invoke-model, --model-id, anthropic.claude-3, --body, file://body.json, out.json]
  url: "https://us-west-2.console.aws.amazon.com/bedrock/home?region=us-west-2"
  source: service-home
- argv: [bedrock-runtime, converse, --model-id, anthropic.claude-3, --messages, file://messages.json]
  url: "https://us-west-2.console.aws.amazon.com/bedrock/home?region=us-west-2"
  source: service-home
- argv: [bedrock-runtime, invoke-model-with-response-stream, --model-id, anthropic.claude-3, --body, file://body.json, out.json]
  region: us-east-1
  url: "https://us-east-1.console.aws.amazon.com/bedrock/home?region=us-east-1"
