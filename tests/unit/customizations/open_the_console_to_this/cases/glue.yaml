# Cases for scripts/console_db/overrides/glue.yaml (curator W3) plus
# generated entries that were reviewed and kept.  Sample database mydb,
# table mytable and job myjob come from view-samples.tsv.
- argv: [glue, get-databases]
  url: "https://us-west-2.console.aws.amazon.com/glue/home?region=us-west-2#/v2/data-catalog/databases"
  source: resolver:list
- argv: [glue, get-database, --name, mydb]
  url: "https://us-west-2.console.aws.amazon.com/glue/home?region=us-west-2#database:name=mydb"
- argv: [glue, get-crawler, --name, mycrawler]
  url: "https://us-west-2.console.aws.amazon.com/glue/home?region=us-west-2#crawler:name=mycrawler"
- argv: [glue, start-job-run, --job-name, myjob]
  url: "https://us-west-2.console.aws.amazon.com/gluestudio/home?region=us-west-2#/editor/job/myjob"
- argv: [glue, get-tables, --database-name, mydb]
  url: "https://us-west-2.console.aws.amazon.com/glue/home?region=us-west-2#database:name=mydb"
  source: curated
- argv: [glue, get-tables]
  url: "https://us-west-2.console.aws.amazon.com/glue/home?region=us-west-2#/v2/data-catalog/tables"
  source: curated
- argv: [glue, get-table, --database-name, mydb, --name, mytable]
  url: "https://us-west-2.console.aws.amazon.com/glue/home?region=us-west-2#table:name=mytable;namespace=mydb"
  source: curated
- argv: [glue, update-table, --database-name, mydb, --table-input, '{"Name": "mytable"}']
  url: "https://us-west-2.console.aws.amazon.com/glue/home?region=us-west-2#database:name=mydb"
  source: curated
- argv: [glue, delete-table, --database-name, mydb, --name, mytable]
  url: "https://us-west-2.console.aws.amazon.com/glue/home?region=us-west-2#table:name=mytable;namespace=mydb"
  source: curated
- argv: [glue, get-partitions, --database-name, mydb, --table-name, mytable]
  url: "https://us-west-2.console.aws.amazon.com/glue/home?region=us-west-2#table:name=mytable;namespace=mydb"
  source: curated
