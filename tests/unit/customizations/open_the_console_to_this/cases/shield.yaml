# Cases for the curated Shield pages (scripts/console_db/overrides/
# shield.yaml): the protected resources list on the global host, detail
# pages as the resolver builds them.  Ids are made-up samples.

- argv: [shield, list-protections]
  url: "https://console.aws.amazon.com/wafv2/shieldv2/protected_resources?region=us-west-2#/"
  source: curated
- argv: [shield, list-protection-groups]
  url: "https://console.aws.amazon.com/wafv2/shieldv2/protected_resources?region=us-west-2#/"
  source: curated
- argv: [shield, describe-protection]
  url: "https://console.aws.amazon.com/wafv2/shieldv2/protected_resources?region=us-west-2#/"
  source: curated
- argv: [shield, describe-protection, --protection-id, a1b2c3d4-5678-90ab-cdef-EXAMPLE11111]
  url: "https://console.aws.amazon.com/wafv2/shieldv2#/protected_resources/a1b2c3d4-5678-90ab-cdef-EXAMPLE11111"
  source: curated
- argv: [shield, delete-protection, --protection-id, a1b2c3d4-5678-90ab-cdef-EXAMPLE11111]
  url: "https://console.aws.amazon.com/wafv2/shieldv2#/protected_resources/a1b2c3d4-5678-90ab-cdef-EXAMPLE11111"
  source: curated
- argv: [shield, describe-protection-group, --protection-group-id, my-group]
  url: "https://console.aws.amazon.com/wafv2/shieldv2#/protection_groups/my-group"
  source: curated
- argv: [shield, delete-protection-group, --protection-group-id, my-group]
  url: "https://console.aws.amazon.com/wafv2/shieldv2#/protection_groups/my-group"
  source: curated
- argv: [shield, list-resources-in-protection-group, --protection-group-id, my-group]
  url: "https://console.aws.amazon.com/wafv2/shieldv2#/protection_groups/my-group"
  source: curated
- argv: [shield, update-protection-group]
  url: "https://console.aws.amazon.com/wafv2/shieldv2/protected_resources?region=us-west-2#/"
  source: curated
