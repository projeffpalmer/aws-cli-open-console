# Cases for the curated "aws cloudfront" nodes (scripts/console_db/overrides/cloudfront.yaml).
# CloudFront is global: the host has no region.  Sample ids E1234567890ABC,
# the cache policy 658327ea-... and function myfn come from view-samples.tsv and the probes.
- argv: [cloudfront, list-distributions]
  url: "https://console.aws.amazon.com/cloudfront/v4/home#/distributions"
  source: curated
- argv: [cloudfront, list-distributions]
