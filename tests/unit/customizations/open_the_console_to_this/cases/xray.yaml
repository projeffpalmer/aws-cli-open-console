# Cases for scripts/console_db/overrides/xray.yaml.  Sample group mygroup
# and ARN shape from scripts/console_db/snapshots/view-samples.tsv.

- argv: [xray, get-group, --group-name, mygroup]
  url: "https://us-west-2.console.aws.amazon.com/xray/home?region=us-west-2#/groups/detail/mygroup"
  source: curated
- argv: [xray, get-group, --group-arn, "arn:aws:xray:us-west-2:123456789012:group/mygroup/abc"]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#xray:settings/groups"
  source: curated
- argv: [xray, update-group, --group-name, mygroup, --filter-expression, "service(\"api\")"]
  url: "https://us-west-2.console.aws.amazon.com/xray/home?region=us-west-2#/groups/detail/mygroup"
  source: curated
- argv: [xray, delete-group, --group-name, mygroup]
  region: eu-west-1
  url: "https://eu-west-1.console.aws.amazon.com/xray/home?region=eu-west-1#/groups/detail/mygroup"
  source: curated

# Not curated: generated list pages and the X-Ray home stay.
- argv: [xray, get-groups]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#xray:settings/groups"
- argv: [xray, get-sampling-rules]
  url: "https://us-west-2.console.aws.amazon.com/cloudwatch/home?region=us-west-2#xray:settings/sampling-rules"
- argv: [xray, get-trace-summaries, --start-time, "2026-11-04T00:00:00Z", --end-time, "2026-11-04T01:00:00Z"]
  url: "https://us-west-2.console.aws.amazon.com/xray/home"
- argv: [xray, get-service-graph, --start-time, "2026-11-04T00:00:00Z", --end-time, "2026-11-04T01:00:00Z"]
  url: "https://us-west-2.console.aws.amazon.com/xray/home"
