# Cases for the curated "aws codecommit" nodes (scripts/console_db/overrides/codecommit.yaml).
# Sample repository myrepo comes from view-samples.tsv.
- argv: [codecommit, list-repositories]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codecommit/repositories?region=us-west-2"
- argv: [codecommit, get-repository, --repository-name, myrepo]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codecommit/repositories/myrepo/browse?region=us-west-2"
- argv: [codecommit, create-repository, --repository-name, myrepo]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codecommit/repository/create?region=us-west-2"
  source: curated
- argv: [codecommit, list-branches, --repository-name, myrepo]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codecommit/repositories/myrepo/browse?region=us-west-2"
  source: curated
- argv: [codecommit, get-branch, --repository-name, myrepo, --branch-name, main]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codecommit/repositories/myrepo/browse?region=us-west-2"
  source: curated
- argv: [codecommit, create-branch, --repository-name, myrepo, --branch-name, dev, --commit-id, 0123456789abcdef0123456789abcdef01234567]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codecommit/repositories/myrepo/browse?region=us-west-2"
  source: curated
- argv: [codecommit, delete-branch, --repository-name, myrepo, --branch-name, dev]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codecommit/repositories/myrepo/browse?region=us-west-2"
  source: curated
- argv: [codecommit, update-default-branch, --repository-name, myrepo, --default-branch-name, main]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codecommit/repositories/myrepo/browse?region=us-west-2"
  source: curated
- argv: [codecommit, list-pull-requests, --repository-name, myrepo]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codecommit/repositories/myrepo/browse?region=us-west-2"
  source: curated
- argv: [codecommit, list-branches]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codecommit/repositories?region=us-west-2"
  source: curated
- argv: [codecommit, credential-helper, get]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codecommit/repositories?region=us-west-2"
  source: curated
- argv: [codecommit, credential-helper, store]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codecommit/repositories?region=us-west-2"
  source: curated
- argv: [codecommit, credential-helper, erase]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codecommit/repositories?region=us-west-2"
  source: curated
- argv: [codecommit, credential-helper]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codecommit/repositories?region=us-west-2"
  source: curated
