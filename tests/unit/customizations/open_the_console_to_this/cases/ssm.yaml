# Cases for scripts/console_db/overrides/ssm.yaml.  Sample names come from
# scripts/console_db/snapshots/view-samples.tsv (parameter /my/param,
# managed node mi-abc, document mydoc) and the contract's sample instance.

# Parameter page in the resolver's ARN shape: one leading "/" is removed
# (strip_leading_slash) and the rest is inserted raw.
- argv: [ssm, get-parameter, --name, /my/param, --with-decryption]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/parameters/my/param/description?region=us-west-2"
  source: curated
- argv: [ssm, get-parameter, --name, myparam]
  region: eu-west-1
  url: "https://eu-west-1.console.aws.amazon.com/systems-manager/parameters/myparam/description?region=eu-west-1"
  source: curated
- argv: [ssm, get-parameter-history, --name, /my/param]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/parameters/my/param/description?region=us-west-2"
  source: curated
- argv: [ssm, put-parameter, --name, /my/param, --value, v1, --type, String, --overwrite]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/parameters/my/param/description?region=us-west-2"
  source: curated
- argv: [ssm, delete-parameter, --name, /my/param]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/parameters/my/param/description?region=us-west-2"
  source: curated
- argv: [ssm, get-parameters, --names, /my/param]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/parameters/my/param/description?region=us-west-2"
  source: curated
- argv: [ssm, get-parameters, --names, /my/param, myparam]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/parameters?region=us-west-2&tab=Table"
  source: curated
- argv: [ssm, describe-parameters]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/parameters?region=us-west-2&tab=Table"
  source: curated
- argv: [ssm, get-parameters-by-path, --path, /my/, --recursive]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/parameters?region=us-west-2&tab=Table"
  source: curated
# Generated entry that stays.
- argv: [ssm, describe-document, --name, mydoc]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/documents/mydoc/description?region=us-west-2"

# Sessions and managed nodes.
- argv: [ssm, start-session, --target, i-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/fleet-manager/managed-nodes/i-0123456789abcdef0?region=us-west-2"
  source: curated
- argv: [ssm, start-session, --target, mi-abc, --document-name, AWS-StartPortForwardingSession]
  region: ap-northeast-1
  url: "https://ap-northeast-1.console.aws.amazon.com/systems-manager/fleet-manager/managed-nodes/mi-abc?region=ap-northeast-1"
  source: curated
- argv: [ssm, start-session]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/session-manager/sessions?region=us-west-2"
  source: curated
- argv: [ssm, describe-instance-information]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/fleet-manager/managed-nodes?region=us-west-2"
  source: curated

# Run Command.
- argv: [ssm, send-command, --document-name, AWS-RunShellScript, --instance-ids, i-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/run-command?region=us-west-2"
  source: curated
- argv: [ssm, list-commands]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/run-command?region=us-west-2"
  source: curated
- argv: [ssm, list-command-invocations, --command-id, 0123abcd-1234-5678-9abc-def012345678]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/run-command?region=us-west-2"
  source: curated
- argv: [ssm, get-command-invocation, --command-id, 0123abcd-1234-5678-9abc-def012345678, --instance-id, i-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/run-command?region=us-west-2"
  source: curated
- argv: [ssm, wait, command-executed, --command-id, 0123abcd-1234-5678-9abc-def012345678, --instance-id, i-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/run-command?region=us-west-2"
  source: curated

# Automation.
- argv: [ssm, get-automation-execution, --automation-execution-id, 0123abcd-1234-5678-9abc-def012345678]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/automation/execution/0123abcd-1234-5678-9abc-def012345678?region=us-west-2"
  source: curated
- argv: [ssm, start-automation-execution, --document-name, AWS-RestartEC2Instance, --parameters, InstanceId=i-0123456789abcdef0]
  url: "https://us-west-2.console.aws.amazon.com/systems-manager/documents/AWS-RestartEC2Instance/description?region=us-west-2"
  source: curated
