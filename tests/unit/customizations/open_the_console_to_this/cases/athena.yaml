# Cases for scripts/console_db/overrides/athena.yaml (curator W3) plus
# generated entries that were reviewed and kept.  Sample workgroup primary
# and catalog AwsDataCatalog come from view-samples.tsv and the live probes.
- argv: [athena, list-work-groups]
  url: "https://us-west-2.console.aws.amazon.com/athena/home?region=us-west-2#/workgroups"
  source: resolver:list
- argv: [athena, list-data-catalogs]
  url: "https://us-west-2.console.aws.amazon.com/athena/home?region=us-west-2#/data-sources"
- argv: [athena, get-work-group, --work-group, primary]
  url: "https://us-west-2.console.aws.amazon.com/athena/home?region=us-west-2#/workgroups/details/primary"
  source: curated
- argv: [athena, update-work-group, --work-group, primary, --description, demo]
  url: "https://us-west-2.console.aws.amazon.com/athena/home?region=us-west-2#/workgroups/details/primary"
  source: curated
- argv: [athena, delete-work-group, --work-group, primary]
  url: "https://us-west-2.console.aws.amazon.com/athena/home?region=us-west-2#/workgroups/details/primary"
  source: curated
- argv: [athena, get-data-catalog, --name, AwsDataCatalog]
  url: "https://us-west-2.console.aws.amazon.com/athena/home?region=us-west-2#/data-sources/details/AwsDataCatalog"
  source: curated
- argv: [athena, list-databases, --catalog-name, AwsDataCatalog]
  url: "https://us-west-2.console.aws.amazon.com/athena/home?region=us-west-2#/data-sources/details/AwsDataCatalog"
  source: curated
- argv: [athena, list-table-metadata, --catalog-name, AwsDataCatalog, --database-name, mydb]
  url: "https://us-west-2.console.aws.amazon.com/athena/home?region=us-west-2#/data-sources/details/AwsDataCatalog"
  source: curated
