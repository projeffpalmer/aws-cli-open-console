# Cases for "aws codepipeline".  No override file: every generated entry
# reviewed (list, view, create, executions) already opens the evidenced page.
# Sample pipeline mypipeline comes from view-samples.tsv.
- argv: [codepipeline, list-pipelines]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codepipeline/pipelines?region=us-west-2"
- argv: [codepipeline, get-pipeline, --name, mypipeline]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codepipeline/pipelines/mypipeline/view?region=us-west-2"
- argv: [codepipeline, get-pipeline-state, --name, mypipeline]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codepipeline/pipelines/mypipeline/view?region=us-west-2"
- argv: [codepipeline, start-pipeline-execution, --name, mypipeline]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codepipeline/pipelines/mypipeline/view?region=us-west-2"
- argv: [codepipeline, list-pipeline-executions, --pipeline-name, mypipeline]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codepipeline/pipelines/mypipeline/view?region=us-west-2"
- argv: [codepipeline, get-pipeline-execution, --pipeline-name, mypipeline, --pipeline-execution-id, 01234567-89ab-cdef-0123-456789abcdef]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codepipeline/pipelines/mypipeline/view?region=us-west-2"
- argv: [codepipeline, create-pipeline, --cli-input-json, "file://pipeline.json"]
  url: "https://us-west-2.console.aws.amazon.com/codesuite/codepipeline/pipeline/new?region=us-west-2"
