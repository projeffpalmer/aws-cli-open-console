# Cases for the curated "aws eks" nodes (scripts/console_db/overrides/eks.yaml).
# Sample names come from the go/view?arn= probes (mycluster, myng, myfp, vpc-cni).
- argv: [eks, list-clusters]
  url: "https://us-west-2.console.aws.amazon.com/eks/home?region=us-west-2#/clusters"
- argv: [eks, describe-cluster, --name, mycluster]
  url: "https://us-west-2.console.aws.amazon.com/eks/home?region=us-west-2#/clusters/mycluster"
- argv: [eks, list-nodegroups, --cluster-name, mycluster]
  url: "https://us-west-2.console.aws.amazon.com/eks/home?region=us-west-2#/clusters/mycluster"
  source: curated
- argv: [eks, list-fargate-profiles, --cluster-name, mycluster]
