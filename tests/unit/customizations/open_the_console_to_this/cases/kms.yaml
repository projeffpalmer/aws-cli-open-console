# Cases for the curated "aws kms" operations (scripts/console_db/overrides/
# kms.yaml).  Key ids and ARNs are the samples from snapshots/view-samples.tsv.

- argv: [kms, describe-key, --key-id, 11111111-2222-3333-4444-555555555555]
  url: "https://us-west-2.console.aws.amazon.com/kms/home?region=us-west-2#/kms/keys/11111111-2222-3333-4444-555555555555"
  source: curated
- argv: [kms, describe-key, --key-id, "arn:aws:kms:us-east-1:123456789012:key/11111111-2222-3333-4444-555555555555"]
  url: "https://us-east-1.console.aws.amazon.com/kms/home?region=us-east-1#/kms/keys/11111111-2222-3333-4444-555555555555"
  source: curated
- argv: [kms, describe-key, --key-id, alias/myalias]
  url: "https://us-west-2.console.aws.amazon.com/kms/home?region=us-west-2#/kms/keys/alias/myalias"
  source: curated
- argv: [kms, describe-key]
  url: "https://us-west-2.console.aws.amazon.com/kms/home?region=us-west-2#/kms/keys"
  source: curated
- argv: [kms, get-key-policy, --key-id, 11111111-2222-3333-4444-555555555555, --policy-name, default]
  url: "https://us-west-2.console.aws.amazon.com/kms/home?region=us-west-2#/kms/keys/11111111-2222-3333-4444-555555555555"
  source: curated
- argv: [kms, enable-key-rotation, --key-id, "arn:aws:kms:us-west-2:123456789012:key/11111111-2222-3333-4444-555555555555"]
  region: eu-west-1
  url: "https://us-west-2.console.aws.amazon.com/kms/home?region=us-west-2#/kms/keys/11111111-2222-3333-4444-555555555555"
  source: curated
- argv: [kms, schedule-key-deletion, --key-id, 11111111-2222-3333-4444-555555555555, --pending-window-in-days, "7"]
  url: "https://us-west-2.console.aws.amazon.com/kms/home?region=us-west-2#/kms/keys/11111111-2222-3333-4444-555555555555"
  source: curated
- argv: [kms, list-aliases]
  url: "https://us-west-2.console.aws.amazon.com/kms/home?region=us-west-2#/kms/keys"
  source: curated

# Not curated: the generated resolver pages stay.
- argv: [kms, list-keys]
  url: "https://us-west-2.console.aws.amazon.com/kms/home?region=us-west-2#/kms/keys"
  source: "resolver:list"
- argv: [kms, create-key]
  url: "https://us-west-2.console.aws.amazon.com/kms/home?region=us-west-2#/kms/keys/create"
  source: "resolver:create"
