# Curated pages for classic "aws waf" operations whose resolver target is
# dead on the regional host (same fix as wafv2.yaml).
#
# Evidence (2026-11-04, unauthenticated GET, no redirect following):
#   go/list?resourceType=AWS::WAF::WebACL&region=us-west-2
#     -> https://us-west-2.console.aws.amazon.com/wafv2/homev2/web-acls?region=us-west-2#/
#   (AWS::WAF::IPSet -> .../ip-sets?region=...#/ and .../ip-sets/new?region=...)
#   https://us-west-2.console.aws.amazon.com/wafv2/homev2/<page>?...  404
#   https://console.aws.amazon.com/wafv2/homev2/<page>?...  302 to the
#     same path on us-east-1.console.aws.amazon.com, which answers 200
# The templates are the resolver's own with the host swapped, so they keep
# its "#/" fragment and the date.  with_id is the generated classic-console
# page (global host, unchanged) and is repeated because an override
# replaces the whole url object.
# Not curated: the web-acls/new create pages; the regional host answers 302
# to the global host there (re-probed 2026-11-04), not 404.

aws.waf.create-ip-set:
  url:
    best: "https://{host}/wafv2/homev2/ip-sets/new?region={region}"
    source: curated
    verified: "2026-11-04"
    note: resolver create page on the global host; the regional host answers 404

aws.waf.delete-ip-set:
  url:
    best: "https://{host}/wafv2/homev2/ip-sets?region={region}#/"
    with_id: "https://{host}/wafv2/home?region=global#/ipsets/{id}"
    source: curated
    verified: "2026-11-04"
    note: resolver list page on the global host; the regional host answers 404

aws.waf.delete-web-acl:
  url:
    best: "https://{host}/wafv2/homev2/web-acls?region={region}#/"
    with_id: "https://{host}/wafv2/home?region=global#/webacls/requests/{id}"
    source: curated
    verified: "2026-11-04"
    note: resolver list page on the global host; the regional host answers 404

