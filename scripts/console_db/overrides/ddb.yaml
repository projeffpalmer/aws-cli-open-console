# Curated console pages for the custom "aws ddb" subcommands (curator W3).
# Same evidence as dynamodb.yaml: go/view?resourceType=AWS::DynamoDB::Table
# &resourceId=zz9idzz9 -> #table?name=zz9idzz9 (view-by-id.tsv).  The item
# explorer fragment has no evidence, so the positional table opens the
# table page.  The tier-1 node aws.ddb is not curated.
# The table name is a positional, so it is a curated param (id_args only
# name options with the leading --, contract section 1).

aws.ddb.put: &ddb_table
  intent:
    verb: view
    resource_type: AWS::DynamoDB::Table
    id_args: []
    params:
      table: {arg: table_name, parse: first}
  url:
    best: "https://{region}.{host}/dynamodbv2/home?region={region}#table"
    variants:
      - when: [table]
        template: "https://{region}.{host}/dynamodbv2/home?region={region}#table?name={table}"
    source: curated
    verified: "2026-11-04"
    note: the table page of the positional table name

aws.ddb.select: *ddb_table
