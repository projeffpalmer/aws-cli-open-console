# Curated console pages for "aws cloudtrail" (plan step 2.4, curator W5).
# CloudTrail is regional: https://{region}.{host}/cloudtrailv2/...
#
# Evidence (2026-11-04):
#   go/list   AWS::CloudTrail::Trail -> /cloudtrailv2/home?region=<r>#/trails
#   go/create AWS::CloudTrail::Trail -> /cloudtrailv2/home?region=<r>#/create
#   go/view?arn=arn:aws:cloudtrail:...:trail/mytrail
#       -> #/trails/arn:aws:cloudtrail:us-west-2:123456789012:trail/mytrail (raw)
#   go/view?resourceType=AWS::CloudTrail::Trail&resourceId=<arn> -> same, raw
#   go/list AWS::CloudTrail::EventDataStore -> #/lake/eventDataStores
# The generated get-trail used {id}, which percent-encodes an ARN that the
# resolver keeps raw; trail names have no reserved characters, so {id:raw}
# is right for both forms.  create-trail had a with_id on --name, the trail
# that does not exist yet.  Not curated: lookup-events (no evidence for the
# Event history fragment), describe-trails and list-event-data-stores
# (already right).

aws.cloudtrail.get-trail: &trail_view
  intent: {verb: view, resource_type: AWS::CloudTrail::Trail, id_args: [--name]}
  url:
    best: "https://{region}.{host}/cloudtrailv2/home?region={region}#/trails"
    with_id: "https://{region}.{host}/cloudtrailv2/home?region={region}#/trails/{id:raw}"
    source: curated
    verified: "2026-11-04"
    note: trail page; a name or ARN is placed raw as the resolver does

aws.cloudtrail.get-trail-status: *trail_view
aws.cloudtrail.start-logging: *trail_view
aws.cloudtrail.stop-logging: *trail_view

aws.cloudtrail.create-trail:
  intent: {verb: create, resource_type: AWS::CloudTrail::Trail, id_args: []}
  url:
    best: "https://{region}.{host}/cloudtrailv2/home?region={region}#/create"
    source: curated
    verified: "2026-11-04"
    note: create-trail wizard (go/create); --name is the new trail, not a page

aws.cloudtrail.validate-logs:
  intent: {verb: view, resource_type: AWS::CloudTrail::Trail, id_args: [--trail-arn]}
  url:
    best: "https://{region}.{host}/cloudtrailv2/home?region={region}#/trails"
    with_id: "https://{region}.{host}/cloudtrailv2/home?region={region}#/trails/{id:raw}"
    source: curated
    verified: "2026-11-04"
    note: the page of the trail whose log files are validated (--trail-arn)

aws.cloudtrail.verify-query-results:
  intent: {verb: list, resource_type: AWS::CloudTrail::EventDataStore, id_args: []}
  url:
    best: "https://{region}.{host}/cloudtrailv2/home?region={region}#/lake/eventDataStores"
    source: curated
    verified: "2026-11-04"
    note: CloudTrail Lake event data stores, where Lake queries are run
