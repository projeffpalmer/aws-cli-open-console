# Curated console pages for "aws organizations" (plan step 2.4).
# Organizations is a global console (tier-1 https://{host}/organizations/v2/home);
# the resolver's go/list and go/create redirects use the regional host, so
# those pages are path-only here; go/view?arn= pages are global and exact.
#
# Evidence (2026-11-04):
#   go/list  AWS::Organizations::Account -> <r>.../organizations/v2/home/accounts?region=<r>
#   go/list  AWS::Organizations::Policy  -> <r>.../organizations/v2/home/policies
#   go/create AWS::Organizations::Account -> <r>.../organizations/v2/home/accounts/add/create
#   go/view?arn=...:account/o-abc/111111111111 -> /organizations/v2/home/accounts/111111111111
#   go/view?arn=...:root/o-abc/r-abcd          -> /organizations/v2/home/root
#   go/view?arn=...:organization/o-abc         -> /organizations/v2/home/settings
#   go/view?arn=...:ou/o-abc/ou-abcd-12345678  -> /organizations/v2/home/organizational-units/ou-abcd-12345678
#   go/view?resourceType=...OrganizationalUnit&resourceId=ou-abcd-12345678
#       -> .../organizational-units/ou-ou-abcd-12345678 (the generated "ou-{id}"
#          template copies this bug; real OU ids already start with "ou-").
# Not curated: list-policies by --filter.  The per-type pages in the AWS
# docs (orgs_policies_create.md, orgs_policies_attach.md, fetched 2026-11-04)
# are hyphenated, /organizations/v2/home/policies/service-control-policy,
# tag-policy, backup-policy; lower gives service_control_policy (the
# underscore form appears only in policy ARNs and their go/view pages), so
# no single parse function produces the documented segment.

aws.organizations.list-accounts:
  intent: {verb: list, resource_type: AWS::Organizations::Account, id_args: []}
  url:
    best: "https://{host}/organizations/v2/home/accounts"
    source: curated
    verified: path-only
    note: AWS accounts page (go/list path on the global host)

aws.organizations.describe-account:
  intent: {verb: view, resource_type: AWS::Organizations::Account, id_args: [--account-id]}
  url:
    best: "https://{host}/organizations/v2/home/accounts"
    with_id: "https://{host}/organizations/v2/home/accounts/{id}"
    source: curated
    verified: path-only
    note: the account page (exact go/view shape); accounts page without --account-id

aws.organizations.create-account:
  intent: {verb: create, resource_type: AWS::Organizations::Account, id_args: []}
  url:
    best: "https://{host}/organizations/v2/home/accounts/add/create"
    source: curated
    verified: path-only
    note: create-account form (go/create path on the global host); --account-name is not an id

aws.organizations.list-roots:
  intent: {verb: view, resource_type: null, id_args: []}
  url:
    best: "https://{host}/organizations/v2/home/root"
    source: curated
    verified: "2026-11-04"
    note: the Root page (go/view?arn= of a root ARN)

aws.organizations.list-organizational-units-for-parent:
  intent: {verb: view, resource_type: AWS::Organizations::OrganizationalUnit, id_args: []}
  url:
    best: "https://{host}/organizations/v2/home/root"
    source: curated
    verified: "2026-11-04"
    note: the Root page with the OU tree; --parent-id may be a root (r-) or an OU (ou-), which no parse function tells apart

aws.organizations.describe-organizational-unit:
  intent: {verb: view, resource_type: AWS::Organizations::OrganizationalUnit, id_args: [--organizational-unit-id]}
  url:
    best: "https://{host}/organizations/v2/home/root"
    with_id: "https://{host}/organizations/v2/home/organizational-units/{id}"
    source: curated
    verified: "2026-11-04"
    note: the OU page (exact go/view?arn= shape; the id already starts with ou-)

aws.organizations.describe-organization:
  intent: {verb: view, resource_type: AWS::Organizations::Organization, id_args: []}
  url:
    best: "https://{host}/organizations/v2/home/settings"
    source: curated
    verified: "2026-11-04"
    note: organization Settings page (go/view?arn= of an organization ARN)

aws.organizations.list-policies:
  intent: {verb: list, resource_type: AWS::Organizations::Policy, id_args: []}
  url:
    best: "https://{host}/organizations/v2/home/policies"
    source: curated
    verified: path-only
    note: Policies page (go/list path on the global host)
