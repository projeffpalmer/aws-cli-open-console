# Curated tier-1 "aws inspector" (Inspector Classic): the resolver's
# service page is dead on the regional host
# (scripts/console_db/review/verify-report.md).
#
# Evidence (2026-11-04, unauthenticated GET, no redirect following):
#   go/view?service=inspector&region=us-west-2
#     -> https://us-west-2.console.aws.amazon.com/inspector/home?region=us-west-2
#     which answers 404 on the regional host.
#   go/view?service=inspector2&region=us-west-2 (snapshots/services.tsv)
#     -> https://us-west-2.console.aws.amazon.com/inspector/v2/home?region=us-west-2
#     which answers 200; that Inspector console is used here.
# The tier-1 home is also set in services.yaml so that the derived and
# service-home placeholders under aws.inspector follow it when the
# database is regenerated.

aws.inspector:
  url:
    best: "https://{region}.{host}/inspector/v2/home?region={region}"
    source: curated
    verified: "2026-11-04"
    note: AWS resolver target answers 404; the Inspector (v2) console home used
