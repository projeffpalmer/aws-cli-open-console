# Curated console pages for "aws eks" (plan step 2.4, group W4).
# EKS is a regional console: https://{region}.{host}/eks/home?region=<r>#/...
#
# Evidence (2026-11-04, go/view?arn= probes and view-by-id.tsv):
#   cluster/mycluster                 -> #/clusters/mycluster
#   nodegroup/mycluster/myng/<uuid>   -> #/clusters/mycluster/nodegroups/myng
#   fargateprofile/mycluster/myfp/<u> -> #/clusters/mycluster/fargate-profiles/myfp
#   addon/mycluster/vpc-cni/<uuid>    -> #/clusters/mycluster/add-ons/vpc-cni
#   go/list?resourceType=AWS::EKS::Cluster -> #/clusters
# Nodegroup, Fargate-profile and add-on lists live on the cluster page; the
# cluster page tabs (?selectedTab=...) are not evidenced, so none is used.

aws.eks.list-nodegroups: &eks_cluster_param
  intent:
    verb: list
    resource_type: AWS::EKS::Nodegroup
    id_args: []
    params:
      cluster: {arg: --cluster-name}
  url:
    best: "https://{region}.{host}/eks/home?region={region}#/clusters"
    variants:
      - when: [cluster]
        template: "https://{region}.{host}/eks/home?region={region}#/clusters/{cluster}"
    source: curated
    verified: "2026-11-04"
    note: the --cluster-name cluster page, which lists its node groups, Fargate profiles and add-ons
aws.eks.list-fargate-profiles: *eks_cluster_param
aws.eks.list-addons: *eks_cluster_param
aws.eks.create-nodegroup: *eks_cluster_param
aws.eks.create-fargate-profile: *eks_cluster_param
aws.eks.create-addon: *eks_cluster_param
aws.eks.get-token: *eks_cluster_param

aws.eks.update-kubeconfig:
  intent:
    verb: view
    resource_type: AWS::EKS::Cluster
    id_args: [--name]
  url:
    best: "https://{region}.{host}/eks/home?region={region}#/clusters"
    with_id: "https://{region}.{host}/eks/home?region={region}#/clusters/{id}"
    source: curated
    verified: "2026-11-04"
    note: the cluster page of --name

aws.eks.describe-nodegroup: &eks_nodegroup
  intent:
    verb: view
    resource_type: AWS::EKS::Nodegroup
    id_args: []
    params:
      cluster: {arg: --cluster-name}
      nodegroup: {arg: --nodegroup-name}
  url:
    best: "https://{region}.{host}/eks/home?region={region}#/clusters"
    variants:
      - when: [cluster, nodegroup]
        template: "https://{region}.{host}/eks/home?region={region}#/clusters/{cluster}/nodegroups/{nodegroup}"
      - when: [cluster]
        template: "https://{region}.{host}/eks/home?region={region}#/clusters/{cluster}"
    source: curated
    verified: "2026-11-04"
    note: node group page (go/view?arn= of a nodegroup ARN)
aws.eks.delete-nodegroup: *eks_nodegroup
aws.eks.update-nodegroup-config: *eks_nodegroup
aws.eks.update-nodegroup-version: *eks_nodegroup
aws.eks.wait.nodegroup-active: *eks_nodegroup
aws.eks.wait.nodegroup-deleted: *eks_nodegroup

aws.eks.describe-fargate-profile: &eks_fargate
  intent:
    verb: view
    resource_type: AWS::EKS::FargateProfile
    id_args: []
    params:
      cluster: {arg: --cluster-name}
      profile: {arg: --fargate-profile-name}
  url:
    best: "https://{region}.{host}/eks/home?region={region}#/clusters"
    variants:
      - when: [cluster, profile]
        template: "https://{region}.{host}/eks/home?region={region}#/clusters/{cluster}/fargate-profiles/{profile}"
      - when: [cluster]
        template: "https://{region}.{host}/eks/home?region={region}#/clusters/{cluster}"
    source: curated
    verified: "2026-11-04"
    note: Fargate profile page (go/view?arn= of a fargateprofile ARN)
aws.eks.delete-fargate-profile: *eks_fargate
aws.eks.wait.fargate-profile-active: *eks_fargate
aws.eks.wait.fargate-profile-deleted: *eks_fargate

aws.eks.describe-addon: &eks_addon
  intent:
    verb: view
    resource_type: AWS::EKS::Addon
    id_args: []
    params:
      cluster: {arg: --cluster-name}
      addon: {arg: --addon-name}
  url:
    best: "https://{region}.{host}/eks/home?region={region}#/clusters"
    variants:
      - when: [cluster, addon]
        template: "https://{region}.{host}/eks/home?region={region}#/clusters/{cluster}/add-ons/{addon}"
      - when: [cluster]
        template: "https://{region}.{host}/eks/home?region={region}#/clusters/{cluster}"
    source: curated
    verified: "2026-11-04"
    note: add-on page (go/view?arn= of an addon ARN)
aws.eks.update-addon: *eks_addon
aws.eks.delete-addon: *eks_addon
aws.eks.wait.addon-active: *eks_addon
aws.eks.wait.addon-deleted: *eks_addon
