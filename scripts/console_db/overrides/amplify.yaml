# Curated console pages for "aws amplify" (plan step 2.4, group W4).
# Amplify is a regional console: https://{region}.{host}/amplify/...?region=<r>
#
# Evidence (2026-11-04):
#   go/list?resourceType=AWS::Amplify::App   -> /amplify/apps?region=<r>
#   go/create?resourceType=AWS::Amplify::App -> /amplify/create/add-repo?selectTemplate
#   go/view?resourceType=AWS::Amplify::App&resourceId=zz9idzz9
#                                            -> /amplify/apps/zz9idzz9/overview?region=<r>
#   go/view?arn=arn:aws:amplify:...:apps/abc/branches/main
#                                            -> /amplify/apps/abc/branches/main?region=<r>
#   go/view?arn=...:apps/abc/branches/main/jobs/0000000001 -> amplify home
# Job pages are not evidenced (link2aws uses an older #/<app>/<branch>/<job>
# form); job operations open the branch page.

aws.amplify.create-app:
  intent:
    verb: create
    resource_type: AWS::Amplify::App
    id_args: []
  url:
    best: "https://{region}.{host}/amplify/create/add-repo?selectTemplate"
    source: curated
    verified: "2026-11-04"
    note: create-app wizard; the generated entry put --name where the app id goes

aws.amplify.list-branches: &amp_app
  intent:
    verb: view
    resource_type: AWS::Amplify::App
    id_args: [--app-id]
  url:
    best: "https://{region}.{host}/amplify/apps?region={region}"
    with_id: "https://{region}.{host}/amplify/apps/{id}/overview?region={region}"
    source: curated
    verified: "2026-11-04"
    note: app overview of --app-id (lists its branches)
aws.amplify.create-branch: *amp_app

aws.amplify.get-branch: &amp_branch
  intent:
    verb: view
    resource_type: AWS::Amplify::Branch
    id_args: []
    params:
      app: {arg: --app-id}
      branch: {arg: --branch-name}
  url:
    best: "https://{region}.{host}/amplify/apps?region={region}"
    variants:
      - when: [app, branch]
        template: "https://{region}.{host}/amplify/apps/{app}/branches/{branch}?region={region}"
      - when: [app]
        template: "https://{region}.{host}/amplify/apps/{app}/overview?region={region}"
    source: curated
    verified: "2026-11-04"
    note: branch page (go/view?arn= of a branch ARN)
aws.amplify.update-branch: *amp_branch
aws.amplify.delete-branch: *amp_branch
aws.amplify.start-job: *amp_branch
aws.amplify.list-jobs: *amp_branch
aws.amplify.get-job: *amp_branch
aws.amplify.stop-job: *amp_branch
aws.amplify.create-deployment: *amp_branch
