# Curated console pages for the custom "aws s3" subcommands (plan step
# 2.4, s3 pilot).  S3 is a global console: every template uses
# https://{host}/... and passes the region as a query parameter.
#
# Evidence (2026-11-04):
#   go/list?resourceType=AWS::S3::Bucket   -> /s3/buckets?region=<r>
#   go/create?resourceType=AWS::S3::Bucket -> <r>.console.../s3/bucket/create
#   go/view?arn=arn:aws:s3:::mybucket      -> /s3/buckets/mybucket
#   go/view?arn=arn:aws:s3:::mybucket/some/ -> /s3/buckets/mybucket?prefix=some%2F
#   go/view?arn=arn:aws:s3:::mybucket/some/key.txt
#                                          -> /s3/object/mybucket?prefix=some%2Fkey.txt
#   go/view?arn=arn:aws:s3:::my%20bucket/a%20b.txt
#                                          -> /s3/object/my%20bucket?prefix=a%20b.txt
# The resolver percent-encodes keys and prefixes in the query string with
# %20 for a space and %2F for a slash, which is the default {name} (path)
# encoding, so keys and prefixes use {prefix} / {key}, not {...:query}.
# The ?region= parameter, &showversions=false and &tab= are not produced by
# the resolver (path-only); every path answers 200 unauthenticated.
#
#   go/view?arn=arn:aws:s3:::mybucket/logs/ -> /s3/buckets/mybucket?prefix=logs%2F
# RC-B (2026-11-04): "rm s3://b/logs --recursive" treats the path as a
# folder (s3uri_dir); cp/mv open the object page when the S3 side is a single
# key (s3_target_object), and with --recursive the folder view of the target
# prefix (or the bucket page when the target has no "/"; no parse function
# appends "/" to the target key of a transfer).
#
# Not curated here: aws.s3 itself (the tier-1 node).  The brief maps it to
# the buckets list, but cases/services.yaml asserts that tier-1 s3 stays on
# /s3/home ("only tier-1 nodes here, so these stay true"); see the report.

aws.s3.ls:
  intent:
    verb: list
    resource_type: AWS::S3::Bucket
    id_args: []
    params:
      bucket: {arg: paths, parse: s3uri_bucket}
      prefix: {arg: paths, parse: s3uri_prefix}
  url:
    best: "https://{host}/s3/buckets?region={region}"
    variants:
      - when: [bucket, prefix]
        template: "https://{host}/s3/buckets/{bucket}?region={region}&prefix={prefix}&showversions=false"
      - when: [bucket]
        template: "https://{host}/s3/buckets/{bucket}?region={region}"
    needs_account: false
    source: curated
    verified: path-only
    note: buckets list; with a path, the bucket page or its folder view

aws.s3.cp:
  intent:
    verb: view
    resource_type: AWS::S3::Bucket
    id_args: []
    params:
      bucket: {arg: paths, parse: s3_target_bucket}
      key: {arg: paths, parse: s3_target_object}
      prefix: {arg: paths, parse: s3_target_prefix}
      recursive: {arg: --recursive, parse: present}
  url:
    best: "https://{host}/s3/buckets?region={region}"
    variants:
      - when: [bucket, recursive, prefix]
        template: "https://{host}/s3/buckets/{bucket}?region={region}&prefix={prefix}&showversions=false"
      - when: [bucket, recursive]
        template: "https://{host}/s3/buckets/{bucket}?region={region}"
      - when: [bucket, key]
        template: "https://{host}/s3/object/{bucket}?region={region}&prefix={key}"
      - when: [bucket, prefix]
        template: "https://{host}/s3/buckets/{bucket}?region={region}&prefix={prefix}&showversions=false"
      - when: [bucket]
        template: "https://{host}/s3/buckets/{bucket}?region={region}"
    needs_account: false
    source: curated
    verified: path-only
    note: the S3 side of the copy; object page for a single key, folder view for a key ending in / or --recursive

