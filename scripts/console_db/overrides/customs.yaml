# Curated console pages for the custom tier-1 commands owned by the CLI
# itself (configure, history, cli-dev, update, agent-toolkit, login,
# logout) and their subcommands (plan step 2.4).  ddb lives in dynamodb.yaml.
#
# Decided mapping (brief, 2026-11-04):
#   configure set / import / export-credentials / mfa-login
#       -> IAM "My security credentials" (https://{host}/iam/home#/security_credentials)
#   configure sso / sso-session
#       -> IAM Identity Center console (https://{region}.{host}/singlesignon/home?region={region})
#   every other custom command -> the console home.
#
# Evidence (2026-11-04):
#   snapshots/services.tsv: go/view?service=<configure|history|cli-dev|update|
#     agent-toolkit|login|logout> -> <r>.console.../console/home?region=<r>
#     (the global host form is used here, so path-only);
#   go/view?service=sso -> <r>.console.../singlesignon/home (path-only: the
#     ?region= query is added here);
#   https://console.aws.amazon.com/iam/home answers 302 to us-east-1 (the
#     #/security_credentials fragment cannot be checked unauthenticated).
#
# Not curated here: aws.configure itself.  The brief maps it to the security
# credentials page, but cases/services.yaml keeps "argv: [configure]" ->
# console home with source console-home, and this curator may not edit that
# row (see the report).

aws.configure.set: &security_credentials
  intent:
    verb: home
    resource_type: null
    id_args: []
  url:
    best: "https://{host}/iam/home#/security_credentials"
    source: curated
    verified: path-only
    note: IAM security credentials page of the signed-in identity (access keys, MFA)

aws.configure.import: *security_credentials
aws.configure.export-credentials: *security_credentials
aws.configure.mfa-login: *security_credentials

aws.configure.sso: &identity_center
  intent:
    verb: home
    resource_type: null
    id_args: []
  url:
    best: "https://{region}.{host}/singlesignon/home?region={region}"
    source: curated
    verified: path-only
    note: IAM Identity Center console of the region (decided mapping for SSO profiles)

aws.configure.sso-session: *identity_center

aws.configure.list: &console_home
  intent:
    verb: home
    resource_type: null
    id_args: []
  url:
    best: "https://{host}/console/home?region={region}"
    source: curated
    verified: path-only
    note: local CLI command with no console page; opens the console home

aws.configure.get: *console_home
aws.configure.list-profiles: *console_home
aws.configure.wizard: *console_home
aws.configure.add-model: *console_home
aws.configure.agent-toolkit: *console_home

aws.history: *console_home
aws.history.list: *console_home
aws.history.show: *console_home

aws.cli-dev: *console_home
aws.cli-dev.wizard-dev: *console_home

aws.update: *console_home

aws.agent-toolkit: *console_home
aws.agent-toolkit.add-skill: *console_home
aws.agent-toolkit.check-skill-updates: *console_home
aws.agent-toolkit.get-skill-file: *console_home
aws.agent-toolkit.get-skill-metadata: *console_home
aws.agent-toolkit.list-available-skills: *console_home
aws.agent-toolkit.list-installed-skills: *console_home
aws.agent-toolkit.remove-skill: *console_home
aws.agent-toolkit.search-skills: *console_home
aws.agent-toolkit.update-skill: *console_home

aws.login: *console_home
aws.logout: *console_home
