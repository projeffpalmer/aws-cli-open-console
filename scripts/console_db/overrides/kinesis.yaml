# Curated console pages for "aws kinesis" (plan step 2.4, curator W3).
# Kinesis is regional: https://{region}.{host}/kinesis/home?region={region}#/...
#
# Evidence (2026-11-04):
#   go/view?resourceType=AWS::Kinesis::Stream&resourceId=zz9idzz9
#                     -> #/streams/details/zz9idzz9/monitoring (view-by-id.tsv)
#   go/view?arn=arn:aws:kinesis:us-west-2:123456789012:stream/mystream
#                     -> #/streams/details/mystream/monitoring (view-samples.tsv)
#   go/list / go/create?resourceType=AWS::Kinesis::Stream
#                     -> #/streams/list, #/streams/create (types.tsv)
#   link2aws stream:  #/streams/details/<name>/details (Configuration tab)
# The generated entries put the first of --stream-name, --stream-arn,
# --stream-id into the page path, so an ARN landed in the fragment; these
# overrides take the name from --stream-name or from the ARN (arn_resource).
# --stream-id cannot be turned into a name.  get-records keeps its generated
# home page (it takes only a shard iterator, no stream name).

aws.kinesis.describe-stream: &stream_details
  intent:
    verb: view
    resource_type: AWS::Kinesis::Stream
    id_args: []
    params:
      stream: {arg: --stream-name}
      stream_from_arn: {arg: --stream-arn, parse: arn_resource}
  url:
    best: "https://{region}.{host}/kinesis/home?region={region}#/streams/list"
    variants:
      - when: [stream]
        template: "https://{region}.{host}/kinesis/home?region={region}#/streams/details/{stream}/details"
      - when: [stream_from_arn]
        template: "https://{region}.{host}/kinesis/home?region={region}#/streams/details/{stream_from_arn}/details"
    source: curated
    verified: path-only
    note: stream Configuration tab (link2aws /details); streams list without a stream

aws.kinesis.describe-stream-summary: *stream_details

aws.kinesis.wait.stream-exists: &stream_page
  intent:
    verb: view
    resource_type: AWS::Kinesis::Stream
    id_args: []
    params:
      stream: {arg: --stream-name}
      stream_from_arn: {arg: --stream-arn, parse: arn_resource}
  url:
    best: "https://{region}.{host}/kinesis/home?region={region}#/streams/list"
    variants:
      - when: [stream]
        template: "https://{region}.{host}/kinesis/home?region={region}#/streams/details/{stream}/monitoring"
      - when: [stream_from_arn]
        template: "https://{region}.{host}/kinesis/home?region={region}#/streams/details/{stream_from_arn}/monitoring"
    source: curated
    verified: "2026-11-04"
    note: stream page (resolver's monitoring tab); streams list without a stream

aws.kinesis.wait.stream-not-exists: *stream_page
aws.kinesis.put-record: *stream_page
aws.kinesis.put-records: *stream_page
aws.kinesis.delete-stream: *stream_page

aws.kinesis.create-stream:
  intent:
    verb: create
    resource_type: AWS::Kinesis::Stream
    id_args: []
  url:
    best: "https://{region}.{host}/kinesis/home?region={region}#/streams/create"
    source: curated
    verified: "2026-11-04"
    note: create-stream wizard (go/create); the stream does not exist yet
