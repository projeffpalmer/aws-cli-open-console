# Curated console pages for "aws route53" (plan step 2.4, group W4).
# Route 53 is a global console: every template uses https://{host}/route53/v2/...
#
# Evidence (2026-11-04):
#   go/list?resourceType=AWS::Route53::HostedZone -> <r>.console.../route53/v2/hostedzones
#   go/create AWS::Route53::HostedZone -> .../route53/v2/hostedzones?region=<r>#CreateHostedZone
#   go/view?resourceType=AWS::Route53::HostedZone&resourceId=zz9idzz9
#     and go/view?arn=arn:aws:route53:::hostedzone/Z0123456789ABC
#     -> https://console.../route53/v2/hostedzones#ListRecordSets/<zone id>
#   go/view?resourceType=...HostedZone&resourceId=/hostedzone/Z0123456789ABC
#     -> #ListRecordSets//hostedzone/Z0123456789ABC (the resolver does not strip it)
#   go/view?arn=arn:aws:route53:::change/C0123456789ABC -> hostedzones#Change/C0123456789ABC
#   go/list AWS::Route53::HealthCheck -> .../route53/v2/healthchecks/home?region=<r>#/
#   go/create AWS::Route53::HealthCheck -> .../route53/v2/healthchecks/home#/create
#   go/view?arn=arn:aws:route53:::healthcheck/<id> -> healthchecks/home#/details/<id>
# Zone and change ids may be typed as Z123 or /hostedzone/Z123 (/change/C123,
# as the API returns them); basename keeps the bare id.  List and create
# pages use the global host (path-only).

aws.route53.list-hosted-zones: &r53_zones
  intent:
    verb: list
    resource_type: AWS::Route53::HostedZone
    id_args: []
  url:
    best: "https://{host}/route53/v2/hostedzones"
    source: curated
    verified: path-only
    note: hosted zones list on the global host
aws.route53.list-hosted-zones-by-name: *r53_zones

aws.route53.create-hosted-zone:
  intent:
    verb: create
    resource_type: AWS::Route53::HostedZone
    id_args: []
  url:
    best: "https://{host}/route53/v2/hostedzones#CreateHostedZone"
    source: curated
    verified: path-only
    note: create-hosted-zone form; the generated entry put --name (a domain) where the zone id goes

aws.route53.get-hosted-zone: &r53_zone_id
  intent:
    verb: view
    resource_type: AWS::Route53::HostedZone
    id_args: []
    params:
      zone: {arg: --id, parse: basename}
  url:
    best: "https://{host}/route53/v2/hostedzones"
    variants:
      - when: [zone]
        template: "https://{host}/route53/v2/hostedzones#ListRecordSets/{zone}"
    source: curated
    verified: "2026-11-04"
    note: records of the --id zone (Z123 or /hostedzone/Z123)
aws.route53.delete-hosted-zone: *r53_zone_id
aws.route53.update-hosted-zone-comment: *r53_zone_id

aws.route53.list-resource-record-sets: &r53_zone_hz
  intent:
    verb: view
    resource_type: AWS::Route53::RecordSet
    id_args: []
    params:
      zone: {arg: --hosted-zone-id, parse: basename}
  url:
    best: "https://{host}/route53/v2/hostedzones"
    variants:
      - when: [zone]
        template: "https://{host}/route53/v2/hostedzones#ListRecordSets/{zone}"
    source: curated
    verified: "2026-11-04"
    note: records of the --hosted-zone-id zone (Z123 or /hostedzone/Z123)
aws.route53.change-resource-record-sets: *r53_zone_hz

aws.route53.get-change: &r53_change
  intent:
    verb: view
    resource_type: null
    id_args: []
    params:
      change: {arg: --id, parse: basename}
  url:
    best: "https://{host}/route53/v2/hostedzones"
    variants:
      - when: [change]
        template: "https://{host}/route53/v2/hostedzones#Change/{change}"
    source: curated
    verified: "2026-11-04"
    note: change status page of --id (C123 or /change/C123)
aws.route53.wait.resource-record-sets-changed: *r53_change

aws.route53.list-health-checks:
  intent:
    verb: list
    resource_type: AWS::Route53::HealthCheck
    id_args: []
  url:
    best: "https://{host}/route53/v2/healthchecks/home#/"
    source: curated
    verified: path-only
    note: health checks list on the global host

aws.route53.create-health-check:
  intent:
    verb: create
    resource_type: AWS::Route53::HealthCheck
    id_args: []
  url:
    best: "https://{host}/route53/v2/healthchecks/home#/create"
    source: curated
    verified: path-only
    note: create-health-check form on the global host

aws.route53.get-health-check: &r53_hc
  intent:
    verb: view
    resource_type: AWS::Route53::HealthCheck
    id_args: [--health-check-id]
  url:
    best: "https://{host}/route53/v2/healthchecks/home#/"
    with_id: "https://{host}/route53/v2/healthchecks/home#/details/{id}"
    source: curated
    verified: "2026-11-04"
    note: health check page of --health-check-id
aws.route53.update-health-check: *r53_hc
aws.route53.delete-health-check: *r53_hc
aws.route53.get-health-check-status: *r53_hc
aws.route53.get-health-check-last-failure-reason: *r53_hc
