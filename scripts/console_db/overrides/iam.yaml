# Curated console pages for "aws iam" (plan step 2.4).  IAM is a global
# console: every template uses https://{host}/iam/home#/... (the tier-1 host
# form); the resolver's list and create redirects use the regional host
# (<r>.console.../iam/home[?region=<r>]#/...), so lists and wizards here are
# path-only.  Detail pages are the resolver's exact shapes.
#
# Evidence (2026-11-04):
#   types.tsv go/list:   #/users  #/roles  #/groups  #/policies  #/identity_providers
#   types.tsv go/create: #/users/create  #/roles/create  #/groups/create  #/policies/create
#   view-by-id.tsv:      #/users/details/<id>  #/roles/details/<id>  #/groups/details/<id>
#   view-samples.tsv / live go/view?arn=:
#     policy/MyPolicy  -> #/policies/details/arn%3Aaws%3Aiam%3A%3A123456789012%3Apolicy%2FMyPolicy
#     arn:aws:iam::aws:policy/AdministratorAccess
#                      -> #/policies/details/arn%3Aaws%3Aiam%3A%3Aaws%3Apolicy%2FAdministratorAccess
#     saml-provider/myidp -> #/identity_providers/details/SAML/arn%3Aaws%3Aiam%3A...
#     oidc-provider/...   -> #/identity_providers/details/OPENID/arn%3Aaws%3Aiam%3A...
#   so policy and provider ARNs use the default {id} (path) encoding, which
#   produces exactly that %3A/%2F form; the generated {id:raw} does not.
#   Instance profiles and access keys have no resolver page (go/list and
#   go/view answer /iam/home), so list-instance-profiles keeps its entry.
# Not used: ?section=permissions / ?section=security_credentials tabs; the
# fragment cannot be checked unauthenticated and no reference shows it.
# #/home and #/security_credentials have no resolver evidence (path-only,
# brief's mapping).

aws.iam.list-users:
  intent: {verb: list, resource_type: AWS::IAM::User, id_args: []}
  url:
    best: "https://{host}/iam/home#/users"
    source: curated
    verified: path-only
    note: users list (go/list fragment on the global host)

aws.iam.get-user:
  intent: {verb: view, resource_type: AWS::IAM::User, id_args: [--user-name]}
  url:
    best: "https://{host}/iam/home#/users"
    with_id: "https://{host}/iam/home#/users/details/{id}"
    source: curated
    verified: path-only
    note: the user page (exact go/view shape); users list without --user-name

aws.iam.create-user:
  intent: {verb: create, resource_type: AWS::IAM::User, id_args: []}
