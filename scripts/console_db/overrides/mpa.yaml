# Curated Multi-party approval pages: the resolver sends the service and
# both resource types to a path that is dead on the regional host
# (scripts/console_db/review/verify-report.md).
#
# Evidence (2026-11-04, unauthenticated GET, no redirect following):
#   go/view?service=mpa&region=us-west-2, go/list and go/create for
#   AWS::MPA::ApprovalTeam and AWS::MPA::IdentitySource
#     -> https://us-west-2.console.aws.amazon.com/organizations/v2/home/mpa
#   that path answers 404 on us-west-2.console.aws.amazon.com and 302 to
#   the same path on us-east-1.console.aws.amazon.com (200) from
#   console.aws.amazon.com.  The resolver adds no ?region=, so none here.
# The Organizations console is a single-page app (any /organizations/v2/
# home/ path answers 200 on us-east-1), so the check proves the host and
# prefix; the page path is the resolver's own.
# The tier-1 home is also set in services.yaml so that the service-home
# placeholders under aws.mpa follow it when the database is regenerated.

aws.mpa:
  url: &mpa
    best: "https://{host}/organizations/v2/home/mpa"
    source: curated
    verified: "2026-11-04"
    note: resolver MPA page on the global host; the regional host answers 404
aws.mpa.create-approval-team:
  url: *mpa
aws.mpa.create-identity-source:
  url: *mpa
aws.mpa.delete-identity-source:
  url: *mpa
aws.mpa.delete-inactive-approval-team-version:
  url: *mpa
aws.mpa.get-approval-team:
  url: *mpa
aws.mpa.get-identity-source:
  url: *mpa
aws.mpa.list-approval-teams:
  url: *mpa
aws.mpa.list-identity-sources:
  url: *mpa
aws.mpa.start-active-approval-team-deletion:
  url: *mpa
aws.mpa.start-approval-team-baseline:
  url: *mpa
aws.mpa.update-approval-team:
  url: *mpa
