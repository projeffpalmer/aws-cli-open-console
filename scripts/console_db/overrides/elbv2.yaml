# Curated console pages for "aws elbv2" (plan step 2.4/2.5, group W1).
# Load balancers, target groups and listeners live in the EC2 console.
# Evidence, 2026-11-04: snapshots/types.tsv (go/list, go/create),
# snapshots/view-by-id.tsv and view-samples.tsv (LoadBalancer and
# TargetGroup pages keyed by the raw ARN) and a live go/view?arn= GET for
# a listener ARN (#ELBListenerV2:listenerArn=<arn>).  Every template here
# is the resolver's exact shape.  ARNs are inserted raw ({id:raw}), as the
# resolver does.  Generated entries kept as reviewed: describe-load-balancers
# (--load-balancer-arns opens the load balancer; --names has no evidenced
# name filter and opens the list), describe-target-groups, the
# load-balancer waiters.

aws.elbv2.create-load-balancer:
  intent:
    verb: create
    resource_type: AWS::ElasticLoadBalancingV2::LoadBalancer
    id_args: []
  url:
    best: "https://{region}.{host}/ec2/home?region={region}#SelectCreateELBWizard:"
    source: curated
    verified: "2026-11-04"
    note: choose-a-load-balancer-type wizard (go/create); the generated entry put --name into the loadBalancerArn page

aws.elbv2.create-target-group:
  intent:
    verb: create
    resource_type: AWS::ElasticLoadBalancingV2::TargetGroup
    id_args: []
  url:
    best: "https://{region}.{host}/ec2/home?region={region}#CreateTargetGroup:"
    source: curated
    verified: "2026-11-04"
    note: create-target-group wizard (go/create); the generated entry put --name into the targetGroupArn page

# --- Target group page: targets are registered and their health shown ---

aws.elbv2.describe-target-health:
  intent: &tg_intent
    verb: view
    resource_type: AWS::ElasticLoadBalancingV2::TargetGroup
    id_args: [--target-group-arn]
  url: &tg_url
    best: "https://{region}.{host}/ec2/v2/home?region={region}#TargetGroups:"
    with_id: "https://{region}.{host}/ec2/home?region={region}#TargetGroup:targetGroupArn={id:raw}"
    source: curated
    verified: "2026-11-04"
    note: the target group page, which lists its registered targets and their health (tab name not evidenced)

aws.elbv2.register-targets:
  intent: *tg_intent
  url: *tg_url

aws.elbv2.deregister-targets:
  intent: *tg_intent
  url: *tg_url

aws.elbv2.wait.target-in-service:
  intent: *tg_intent
  url: *tg_url

aws.elbv2.wait.target-deregistered:
  intent: *tg_intent
  url: *tg_url

# --- Listeners ------------------------------------------------------------

aws.elbv2.describe-listeners:
  intent:
    verb: list
    resource_type: AWS::ElasticLoadBalancingV2::Listener
    id_args: []
    params:
      listener: {arg: --listener-arns}
      lb: {arg: --load-balancer-arn}
  url:
    best: "https://{region}.{host}/ec2/home?region={region}#LoadBalancers:"
    variants:
      - when: [listener]
        template: "https://{region}.{host}/ec2/home?region={region}#ELBListenerV2:listenerArn={listener:raw}"
      - when: [lb]
        template: "https://{region}.{host}/ec2/home?region={region}#LoadBalancer:loadBalancerArn={lb:raw}"
    source: curated
    verified: "2026-11-04"
    note: the first --listener-arns value opens that listener; --load-balancer-arn opens the load balancer (listeners tab not evidenced)

aws.elbv2.create-listener:
  intent:
    verb: create
    resource_type: AWS::ElasticLoadBalancingV2::Listener
    id_args: [--load-balancer-arn]
  url:
    best: "https://{region}.{host}/ec2/home?region={region}#LoadBalancers:"
    with_id: "https://{region}.{host}/ec2/home?region={region}#LoadBalancer:loadBalancerArn={id:raw}"
    source: curated
    verified: "2026-11-04"
    note: the load balancer page, where listeners are added; no listener create page is evidenced

aws.elbv2.modify-listener:
  intent: &listener_intent
    verb: view
    resource_type: AWS::ElasticLoadBalancingV2::Listener
    id_args: [--listener-arn]
  url: &listener_url
    best: "https://{region}.{host}/ec2/home?region={region}#LoadBalancers:"
    with_id: "https://{region}.{host}/ec2/home?region={region}#ELBListenerV2:listenerArn={id:raw}"
    source: curated
    verified: "2026-11-04"
    note: the listener page (go/view?arn=...:listener/app/...), which also shows its rules

aws.elbv2.describe-rules:
  intent:
    verb: list
    resource_type: AWS::ElasticLoadBalancingV2::ListenerRule
    id_args: [--listener-arn]
  url: *listener_url

aws.elbv2.create-rule:
  intent:
    verb: create
    resource_type: AWS::ElasticLoadBalancingV2::ListenerRule
    id_args: [--listener-arn]
  url: *listener_url
