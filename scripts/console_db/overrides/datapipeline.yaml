# Curated "aws datapipeline" pages: every resolver target of the service is
# dead on every console host (scripts/console_db/review/verify-report.md),
# so the curated nodes open the console home.
#
# Evidence (2026-11-04, unauthenticated GET, no redirect following):
#   go/view?service=datapipeline&region=us-west-2 and
#   go/list?resourceType=AWS::DataPipeline::Pipeline&region=us-west-2
#     -> https://us-west-2.console.aws.amazon.com/datapipeline/
#   go/view?resourceType=AWS::DataPipeline::Pipeline&resourceId=<id>
#     -> https://us-west-2.console.aws.amazon.com/datapipeline/home?region=us-west-2#ExecutionDetailsPlace:...
#   /datapipeline/ and /datapipeline/home?region=us-west-2 answer 404 on
#   us-west-2.console.aws.amazon.com, console.aws.amazon.com and
#   us-east-1.console.aws.amazon.com alike.
#   https://console.aws.amazon.com/console/home?region=us-west-2  200
# The generated with_id (the dead detail page) is dropped.  The tier-1
# entry in services.yaml (source console-home) moves the service-home
# placeholders under aws.datapipeline when the database is regenerated.

aws.datapipeline:
  url: &home
    best: "https://{host}/console/home?region={region}"
    source: curated
    verified: "2026-11-04"
    note: AWS resolver target answers 404; console home used
aws.datapipeline.activate-pipeline:
  url: *home
aws.datapipeline.create-pipeline:
  url: *home
aws.datapipeline.deactivate-pipeline:
  url: *home
aws.datapipeline.delete-pipeline:
  url: *home
aws.datapipeline.describe-pipelines:
  url: *home
aws.datapipeline.get-pipeline-definition:
  url: *home
aws.datapipeline.list-pipelines:
  url: *home
aws.datapipeline.put-pipeline-definition:
  url: *home
aws.datapipeline.validate-pipeline-definition:
  url: *home
