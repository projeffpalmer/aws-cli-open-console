# Curated console pages for "aws configservice" (plan step 2.4, curator
# W5).  There is no tier-1 "config" CLI command; configservice is the only
# name, so this one file covers both names of the brief.  AWS Config is
# regional: https://{region}.{host}/config/home?region={region}#/...
#
# Evidence (2026-11-04):
#   go/create AWS::Config::ConfigRule          -> #/rules/add
#   go/create AWS::Config::ConfigurationRecorder -> #/settings
#   go/view?resourceType=AWS::Config::ConfigurationRecorder&resourceId=<arn>
#       -> #/settings/recorder-details?arn=<arn> (raw)
#   go/create AWS::Config::StoredQuery          -> #/queries/editor
# describe-configuration-recorders took --configuration-recorder-names
# values as an ARN and its best page was the service home; describe-
# delivery-channels, get-status and subscribe concern the recorder and
# delivery channel, which the Settings page holds.  Not curated (no
# evidence): a config rule detail page, the resources inventory, the
# resource timeline.

aws.configservice.put-config-rule:
  intent: {verb: create, resource_type: AWS::Config::ConfigRule, id_args: []}
  url:
    best: "https://{region}.{host}/config/home?region={region}#/rules/add"
    source: curated
    verified: "2026-11-04"
    note: add-rule wizard (go/create AWS::Config::ConfigRule)

aws.configservice.describe-configuration-recorders:
  intent: {verb: view, resource_type: AWS::Config::ConfigurationRecorder, id_args: [--arn]}
  url:
    best: "https://{region}.{host}/config/home?region={region}#/settings"
    with_id: "https://{region}.{host}/config/home?region={region}#/settings/recorder-details?arn={id:raw}"
    source: curated
    verified: "2026-11-04"
    note: Settings page; --arn opens that recorder's details

aws.configservice.describe-delivery-channels: &config_settings
  intent: {verb: view, resource_type: AWS::Config::DeliveryChannel, id_args: []}
  url:
    best: "https://{region}.{host}/config/home?region={region}#/settings"
    source: curated
    verified: "2026-11-04"
    note: Settings page, which holds the recorder and the delivery channel

aws.configservice.get-status: *config_settings
aws.configservice.subscribe: *config_settings

aws.configservice.select-resource-config:
  intent: {verb: view, resource_type: AWS::Config::StoredQuery, id_args: []}
  url:
    best: "https://{region}.{host}/config/home?region={region}#/queries/editor"
    source: curated
    verified: "2026-11-04"
    note: advanced query editor (go/create AWS::Config::StoredQuery)
