# Curated console pages for "aws efs" (plan step 2.4, curator W3).
# EFS is regional: https://{region}.{host}/efs/home?region={region}#/...
#
# Evidence (2026-11-04):
#   go/list?resourceType=AWS::EFS::FileSystem -> #/file-systems (types.tsv)
#   go/view?resourceType=AWS::EFS::FileSystem&resourceId=zz9idzz9
#                                             -> #/file-systems/zz9idzz9 (view-by-id.tsv)
#   go/view?resourceType=AWS::EFS::AccessPoint&resourceId=zz9idzz9
#                                             -> #/access-points/zz9idzz9 (view-by-id.tsv)
#   go/list and go/view of AWS::EFS::MountTarget -> /efs/home
# Mount targets have no page of their own; they are shown on the file
# system page (no evidence for its Network tab fragment).
# describe-file-systems and create-file-system keep their generated entries.

aws.efs.describe-mount-targets:
  intent:
    verb: list
    resource_type: AWS::EFS::FileSystem
    id_args: [--file-system-id]
  url:
    best: "https://{region}.{host}/efs/home?region={region}#/file-systems"
    with_id: "https://{region}.{host}/efs/home?region={region}#/file-systems/{id}"
    source: curated
    verified: "2026-11-04"
    note: the file system page of --file-system-id; file systems list without one

aws.efs.describe-access-points:
  intent:
    verb: list
    resource_type: AWS::EFS::AccessPoint
    id_args: []
    params:
      access_point: {arg: --access-point-id}
      file_system: {arg: --file-system-id}
  url:
    best: "https://{region}.{host}/efs/home?region={region}#/access-points"
    variants:
      - when: [access_point]
        template: "https://{region}.{host}/efs/home?region={region}#/access-points/{access_point}"
      - when: [file_system]
        template: "https://{region}.{host}/efs/home?region={region}#/file-systems/{file_system}"
    source: curated
    verified: "2026-11-04"
    note: access point page; the file system page for --file-system-id alone
