# Curated console pages for "aws dynamodb" (plan step 2.4, curator W3).
# DynamoDB is regional: https://{region}.{host}/dynamodbv2/home?region={region}.
#
# Evidence (2026-11-04):
#   go/list?resourceType=AWS::DynamoDB::Table   -> #table           (types.tsv)
#   go/create?resourceType=AWS::DynamoDB::Table -> #create-table    (types.tsv)
#   go/view?resourceType=AWS::DynamoDB::Table&resourceId=zz9idzz9
#                                               -> #table?name=zz9idzz9 (view-by-id.tsv)
#   go/view?arn=...:table/MyTable/index/myindex  -> #table?name=MyTable&tab=indexes
#   go/view?arn=...:table/MyTable/stream/<ts>    -> #table?name=MyTable&tab=streams
# Item operations (scan, query, get-item, put-item, ...) open the table page:
# the #item-explorer?table= and #partiql-editor fragments appear only in
# third-party code, not in the resolver, the reference projects or AWS
# documentation, so they are not used.  No evidence was found for a backups
# or TTL tab either.  batch-get-item, batch-write-item and execute-statement
# keep their generated entries (no table option to read).

aws.dynamodb.create-table:
  intent:
    verb: create
    resource_type: AWS::DynamoDB::Table
    id_args: []
  url:
    best: "https://{region}.{host}/dynamodbv2/home?region={region}#create-table"
    source: curated
    verified: "2026-11-04"
    note: create-table wizard (go/create); the table does not exist yet

aws.dynamodb.wizard.new-table:
  intent:
    verb: create
    resource_type: AWS::DynamoDB::Table
    id_args: []
  url:
    best: "https://{region}.{host}/dynamodbv2/home?region={region}#create-table"
    source: curated
    verified: "2026-11-04"
    note: the console's create-table wizard, the console twin of this wizard

aws.dynamodb.scan: &table_page
  intent:
    verb: view
    resource_type: AWS::DynamoDB::Table
    id_args: [--table-name]
  url:
    best: "https://{region}.{host}/dynamodbv2/home?region={region}#table"
    with_id: "https://{region}.{host}/dynamodbv2/home?region={region}#table?name={id}"
    source: curated
    verified: "2026-11-04"
    note: the table page of --table-name; tables list without one

aws.dynamodb.query: *table_page
aws.dynamodb.get-item: *table_page
aws.dynamodb.put-item: *table_page
aws.dynamodb.update-item: *table_page
aws.dynamodb.delete-item: *table_page
aws.dynamodb.describe-time-to-live: *table_page
aws.dynamodb.update-time-to-live: *table_page
aws.dynamodb.describe-continuous-backups: *table_page

aws.dynamodb.list-backups:
  intent:
    verb: list
    resource_type: AWS::DynamoDB::Table
    id_args: [--table-name]
  url:
    best: "https://{region}.{host}/dynamodbv2/home"
    with_id: "https://{region}.{host}/dynamodbv2/home?region={region}#table?name={id}"
    source: curated
    verified: "2026-11-04"
    note: the table page of --table-name; the DynamoDB home without one

aws.dynamodb.describe-backup:
  intent:
    verb: view
    resource_type: null
    id_args: [--backup-arn]
  url:
    best: "https://{region}.{host}/dynamodbv2/home"
    with_id: "https://{region}.{host}/dynamodbv2/home?region={region}#backup-details?backupArn={id:raw}"
    source: curated
    verified: "2026-11-04"
    note: backup details page (go/view?arn= of a table backup ARN, ARN raw)
