# Curated console pages for "aws kms" (plan step 2.4).  KMS is regional:
# https://{region}.{host}/kms/home?region={region}#/kms/keys...
#
# Evidence (2026-11-04):
#   go/list AWS::KMS::Key -> <r>.../kms/home?region=<r>#/kms/keys
#   view-by-id.tsv AWS::KMS::Key   -> #/kms/keys/<id>
#   view-by-id.tsv AWS::KMS::Alias -> #/kms/keys/alias/<name>
#   go/view?resourceType=AWS::KMS::Key&resourceId=alias/myalias
#       -> #/kms/keys/alias/myalias  (so --key-id is placed raw: an "alias/x"
#          value lands on the alias page; the generated {id} gives alias%2Fx)
#   go/view?arn=arn:aws:kms:us-west-2:...:key/1111...5555 -> us-west-2 ... #/kms/keys/1111...5555
#   go/view?arn=arn:aws:kms:us-east-1:...:alias/myalias   -> us-east-1 ... #/kms/keys/alias/myalias
# A key ARN therefore opens the key id in the ARN's region (arn_resource +
# arn_region).  An alias ARN gives "myalias" from arn_resource and opens
# #/kms/keys/myalias, which is not the alias page.  RC-B (2026-11-04,
# live probe of go/view?arn=...:alias/myalias -> #/kms/keys/alias/myalias):
# still not curated.  arn_type gives "alias" for an alias ARN but "key" for a
# key ARN, and url.variants test only whether a param is present, never its
# value, so no variant can be limited to alias ARNs.
# Not curated: list-keys and create-key (the generated entries are the
# resolver's exact pages); key rotation / key policy tabs (no evidence).

aws.kms.describe-key: &key_page
  intent:
    verb: view
    resource_type: AWS::KMS::Key
    id_args: [--key-id]
    params:
      key_arn_id: {arg: --key-id, parse: arn_resource}
      key_arn_region: {arg: --key-id, parse: arn_region}
  url:
    best: "https://{region}.{host}/kms/home?region={region}#/kms/keys"
    with_id: "https://{region}.{host}/kms/home?region={region}#/kms/keys/{id:raw}"
    variants:
      - when: [key_arn_id, key_arn_region]
        template: "https://{key_arn_region}.{host}/kms/home?region={key_arn_region}#/kms/keys/{key_arn_id}"
    source: curated
    verified: "2026-11-04"
    note: the key page; a key ARN opens in its own region, "alias/x" opens the alias page

aws.kms.get-key-policy: *key_page
aws.kms.enable-key-rotation: *key_page
aws.kms.schedule-key-deletion: *key_page

aws.kms.list-aliases:
  intent: {verb: list, resource_type: AWS::KMS::Key, id_args: []}
  url:
    best: "https://{region}.{host}/kms/home?region={region}#/kms/keys"
    source: curated
    verified: "2026-11-04"
    note: customer managed keys list, which shows each key's aliases (go/list for aliases is the bare home)
