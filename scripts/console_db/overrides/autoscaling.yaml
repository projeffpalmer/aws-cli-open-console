# Curated console pages for "aws autoscaling" (plan step 2.4/2.5, group
# W1).  Auto Scaling groups live in the EC2 console.  Evidence,
# 2026-11-04: snapshots/types.tsv (go/list, go/create),
# snapshots/view-by-id.tsv (#AutoScalingGroupDetails:id=<name>;view=details)
# and a live go/view?arn= GET for a scalingPolicy ARN, which answers
# #AutoScalingGroupDetails:id=myasg;view=scaling (the automatic scaling
# tab).  Every template here is the resolver's exact shape; group names use
# the default path encoding like the generated entries.  No tab for
# activity or instance refresh is evidenced, so those commands open the
# details tab.  Generated entries kept as reviewed:
# describe-auto-scaling-groups, update-auto-scaling-group,
# delete-auto-scaling-group, describe-launch-configurations.

aws.autoscaling.create-auto-scaling-group:
  intent:
    verb: create
    resource_type: AWS::AutoScaling::AutoScalingGroup
    id_args: []
  url:
    best: "https://{region}.{host}/ec2/home?region={region}#CreateAutoScalingGroup:"
    source: curated
    verified: "2026-11-04"
    note: create Auto Scaling group wizard (go/create), also when the required --auto-scaling-group-name is typed

aws.autoscaling.create-launch-configuration:
  intent:
    verb: create
    resource_type: AWS::AutoScaling::LaunchConfiguration
    id_args: []
  url:
    best: "https://{region}.{host}/ec2/home?region={region}#CreateLaunchConfiguration:"
    source: curated
    verified: "2026-11-04"
    note: create launch configuration wizard (go/create), also when the required --launch-configuration-name is typed

# --- Group details tab ----------------------------------------------------

aws.autoscaling.set-desired-capacity:
  intent: &asg_intent
    verb: view
    resource_type: AWS::AutoScaling::AutoScalingGroup
    id_args: [--auto-scaling-group-name]
  url: &asg_url
    best: "https://{region}.{host}/ec2/home?region={region}#AutoScalingGroups:"
    with_id: "https://{region}.{host}/ec2/home?region={region}#AutoScalingGroupDetails:id={id};view=details"
    source: curated
    verified: "2026-11-04"
    note: the group's details tab (go/view resourceType=AWS::AutoScaling::AutoScalingGroup)

aws.autoscaling.describe-scaling-activities:
  intent: *asg_intent
  url: *asg_url

aws.autoscaling.start-instance-refresh:
  intent: *asg_intent
  url: *asg_url

aws.autoscaling.describe-instance-refreshes:
  intent: *asg_intent
  url: *asg_url

# --- Automatic scaling tab (scaling policies) -----------------------------

aws.autoscaling.put-scaling-policy:
  intent: &policy_intent
    verb: view
    resource_type: AWS::AutoScaling::ScalingPolicy
    id_args: [--auto-scaling-group-name]
  url: &policy_url
    best: "https://{region}.{host}/ec2/home?region={region}#AutoScalingGroups:"
    with_id: "https://{region}.{host}/ec2/home?region={region}#AutoScalingGroupDetails:id={id};view=scaling"
    source: curated
    verified: "2026-11-04"
    note: the group's automatic scaling tab, where go/view?arn= sends a scaling policy ARN

aws.autoscaling.describe-policies:
  intent:
    verb: list
    resource_type: AWS::AutoScaling::ScalingPolicy
    id_args: [--auto-scaling-group-name]
  url: *policy_url

aws.autoscaling.execute-policy:
  intent: *policy_intent
  url: *policy_url

aws.autoscaling.delete-policy:
  intent: *policy_intent
  url: *policy_url
