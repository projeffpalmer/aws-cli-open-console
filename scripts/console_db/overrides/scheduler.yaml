# Curated console pages for "aws scheduler" (EventBridge Scheduler, plan
# step 2.4, W2).  Regional console: https://{region}.{host}/scheduler/home?region=...
#
# Evidence (2026-11-04):
#   go/view?arn=arn:aws:scheduler:...:schedule/default/mysched -> #/schedules/default/mysched
#   go/view?arn=arn:aws:scheduler:...:schedule/mygroup/mysched -> #/schedules/mygroup/mysched
#   go/list?resourceType=AWS::Scheduler::Schedule -> #/schedules
# go/view?resourceType=AWS::Scheduler::Schedule&resourceId=... has no detail
# page, so the generated schedule commands stop at the list.  Without
# --group-name the API uses the group "default", and so do these templates.
# list-schedules and create-schedule (go/create wizard) were already right.

aws.scheduler.get-schedule: &schedule_node
  intent:
    verb: view
    resource_type: AWS::Scheduler::Schedule
    id_args: []
    params:
      schedule: {arg: --name}
      group: {arg: --group-name}
  url:
    best: "https://{region}.{host}/scheduler/home?region={region}#/schedules"
    variants:
      - when: [schedule, group]
        template: "https://{region}.{host}/scheduler/home?region={region}#/schedules/{group}/{schedule}"
      - when: [schedule]
        template: "https://{region}.{host}/scheduler/home?region={region}#/schedules/default/{schedule}"
    needs_account: false
    source: curated
    verified: "2026-11-04"
    note: schedule page in its group (default group without --group-name)
aws.scheduler.update-schedule: *schedule_node
aws.scheduler.delete-schedule: *schedule_node
