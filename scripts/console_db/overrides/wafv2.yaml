# Curated create pages for "aws wafv2" whose resolver target is dead on the
# regional host (scripts/console_db/review/verify-report.md).
#
# Evidence (2026-11-04, unauthenticated GET, no redirect following):
#   go/create?resourceType=AWS::WAFv2::IPSet&region=us-west-2
#     -> https://us-west-2.console.aws.amazon.com/wafv2/homev2/ip-sets/new?region=us-west-2
#   (RegexPatternSet -> .../regex-pattern-sets/new, RuleGroup -> .../rule-groups/new)
#   https://us-west-2.console.aws.amazon.com/wafv2/homev2/<page>/new?...  404
#   https://console.aws.amazon.com/wafv2/homev2/<page>/new?...  302 to the
#     same path on us-east-1.console.aws.amazon.com, which answers 200
# link2aws.js builds WAF v2 pages on the global host too
# (https://console.aws.amazon.com/wafv2/homev2/web-acl/...?region=<r>).
# The WAF console is a single-page app (any /wafv2/homev2/ path answers 200
# on us-east-1), so the check proves the host and prefix; the page path is
# the resolver's own.

aws.wafv2.create-ip-set:
  url:
    best: "https://{host}/wafv2/homev2/ip-sets/new?region={region}"
    source: curated
    verified: "2026-11-04"
    note: resolver create page on the global host; the regional host answers 404

aws.wafv2.create-regex-pattern-set:
  url:
    best: "https://{host}/wafv2/homev2/regex-pattern-sets/new?region={region}"
    source: curated
    verified: "2026-11-04"
    note: resolver create page on the global host; the regional host answers 404

aws.wafv2.create-rule-group:
  url:
    best: "https://{host}/wafv2/homev2/rule-groups/new?region={region}"
    source: curated
    verified: "2026-11-04"
    note: resolver create page on the global host; the regional host answers 404
