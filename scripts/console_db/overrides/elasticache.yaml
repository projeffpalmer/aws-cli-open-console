# Curated console pages for "aws elasticache" (plan step 2.4, curator W3).
# ElastiCache is regional: https://{region}.{host}/elasticache/home?region={region}#/...
#
# Evidence (2026-11-04):
#   go/create?resourceType=AWS::ElastiCache::CacheCluster -> #/caches/create (types.tsv)
#   go/create?resourceType=AWS::ElastiCache::ReplicationGroup -> /elasticache/home
#   go/view?arn=...:snapshot:mysnap -> #/snapshots/mysnap (live probe)
# describe-cache-clusters (#/memcached[/<id>]), describe-replication-groups
# (#/redis[/<id>]) and their waiters keep their generated resolver entries.
# describe-serverless-caches keeps its generated home page: go/list, go/view
# of AWS::ElastiCache::ServerlessCache and a serverlesscache ARN all land on
# /elasticache/home.

aws.elasticache.create-cache-cluster:
  intent:
    verb: create
    resource_type: AWS::ElastiCache::CacheCluster
    id_args: []
  url:
    best: "https://{region}.{host}/elasticache/home?region={region}#/caches/create"
    source: curated
    verified: "2026-11-04"
    note: create-cache wizard (go/create); the cluster does not exist yet

aws.elasticache.create-replication-group:
  intent:
    verb: create
    resource_type: AWS::ElastiCache::ReplicationGroup
    id_args: []
  url:
    best: "https://{region}.{host}/elasticache/home?region={region}#/caches/create"
    source: curated
    verified: "2026-11-04"
    note: the create-cache wizard, which also creates Redis OSS and Valkey replication groups

aws.elasticache.describe-snapshots:
  intent:
    verb: list
    resource_type: AWS::ElastiCache::Snapshot
    id_args: [--snapshot-name]
  url:
    best: "https://{region}.{host}/elasticache/home"
    with_id: "https://{region}.{host}/elasticache/home?region={region}#/snapshots/{id}"
    source: curated
    verified: "2026-11-04"
    note: backup page of --snapshot-name (go/view?arn= of a snapshot ARN)
