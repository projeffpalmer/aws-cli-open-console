# Curated tier-1 "aws marketplace-catalog": the resolver's service page is dead on the
# regional host (scripts/console_db/review/verify-report.md).
#
# Evidence (2026-11-04, unauthenticated GET, no redirect following):
#   go/view?service=marketplace-catalog&region=us-west-2 (snapshots/services.tsv)
#     -> https://us-west-2.console.aws.amazon.com/marketplace/subscriptions?region=us-west-2
#   that path answers 404 on us-west-2.console.aws.amazon.com and 302 to
#   the same path on us-east-1.console.aws.amazon.com (200) from
#   console.aws.amazon.com.  The Marketplace console is a single-page app
#   (any /marketplace/ path answers 200 on us-east-1), so the check proves
#   the host and prefix; the page path is the resolver's own.
# The tier-1 home is also set in services.yaml so that the service-home
# placeholders under aws.marketplace-catalog follow it when the database is regenerated.

aws.marketplace-catalog:
  url:
    best: "https://{host}/marketplace/subscriptions?region={region}"
    source: curated
    verified: "2026-11-04"
    note: resolver Marketplace page on the global host; the regional host answers 404
