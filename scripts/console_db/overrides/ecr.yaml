# Curated console pages for "aws ecr" (plan step 2.4, group W4).
# ECR is a regional console: https://{region}.{host}/ecr/...?region=<r>
#
# Evidence (2026-11-04):
#   go/list?resourceType=AWS::ECR::Repository   -> /ecr/private-registry/repositories?region=<r>
#   go/create?resourceType=AWS::ECR::Repository -> /ecr/private-registry/repositories/create?region=<r>
#   go/view?resourceType=AWS::ECR::Repository&resourceId=zz9idzz9
#                                               -> /ecr/repositories/zz9idzz9/?region=<r>
#   go/view?arn=arn:aws:ecr:...:repository/myrepo -> /ecr/repositories/myrepo/?region=<r>
#   GET /ecr/repositories/myrepo/?region=<r> -> 302 /ecr/repositories/myrepo?region=<r>
#     (the console drops the trailing slash), so curated templates use the
#     slash-less target and every generated entry with the slash is curated.
# Image operations open the repository page (its default view is the image
# list); a repository name with slashes is path-encoded ({id}), as the
# contract prescribes, while the resolver writes it decoded.

aws.ecr.describe-images: &ecr_repo
  intent:
    verb: view
    resource_type: AWS::ECR::Repository
    id_args: [--repository-name]
  url:
    best: "https://{region}.{host}/ecr/private-registry/repositories?region={region}"
    with_id: "https://{region}.{host}/ecr/repositories/{id}?region={region}"
    source: curated
    verified: path-only
    note: repository page (image list) of --repository-name
aws.ecr.list-images: *ecr_repo
aws.ecr.batch-delete-image: *ecr_repo
aws.ecr.batch-get-image: *ecr_repo
aws.ecr.put-image: *ecr_repo
aws.ecr.start-image-scan: *ecr_repo
aws.ecr.describe-image-scan-findings: *ecr_repo
aws.ecr.wait.image-scan-complete: *ecr_repo
aws.ecr.wait.lifecycle-policy-preview-complete: *ecr_repo

aws.ecr.delete-repository: *ecr_repo
aws.ecr.get-repository-policy: *ecr_repo
aws.ecr.set-repository-policy: *ecr_repo
aws.ecr.delete-repository-policy: *ecr_repo

aws.ecr.describe-repositories: &ecr_repos
  intent:
    verb: list
    resource_type: AWS::ECR::Repository
    id_args: [--repository-names]
  url:
    best: "https://{region}.{host}/ecr/private-registry/repositories?region={region}"
    with_id: "https://{region}.{host}/ecr/repositories/{id}?region={region}"
    source: curated
    verified: path-only
    note: repositories list; one --repository-names value opens that repository, several the list
aws.ecr.batch-get-repository-scanning-configuration: *ecr_repos

aws.ecr.create-repository:
  intent:
    verb: create
    resource_type: AWS::ECR::Repository
    id_args: []
  url:
    best: "https://{region}.{host}/ecr/private-registry/repositories/create?region={region}"
    source: curated
    verified: "2026-11-04"
    note: create-repository wizard; the generated entry opened the not-yet-existing repository page

aws.ecr.get-login-password: &ecr_registry
  intent:
    verb: list
    resource_type: AWS::ECR::Repository
    id_args: []
  url:
    best: "https://{region}.{host}/ecr/private-registry/repositories?region={region}"
    source: curated
    verified: "2026-11-04"
    note: private registry repositories list (go/list?resourceType=AWS::ECR::Repository)
aws.ecr.get-authorization-token: *ecr_registry
aws.ecr.describe-registry: *ecr_registry
