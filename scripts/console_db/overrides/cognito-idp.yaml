# Curated console pages for "aws cognito-idp" (plan step 2.4, curator W5).
# Amazon Cognito is regional: https://{region}.{host}/cognito/v2/idp/...
#
# Evidence (2026-11-04):
#   go/list   AWS::Cognito::UserPool -> /cognito/v2/idp/user-pools?region=<r>
#   go/create AWS::Cognito::UserPool -> /cognito/v2/idp/set-up-your-application?region=<r>
#   go/view?arn=...:userpool/us-west-2_AbCdEfGhI and view-by-id
#       -> /cognito/v2/idp/user-pools/<pool id>/overview?region=<r>
#   UserPoolClient, UserPoolGroup, UserPoolUser, UserPoolIdentityProvider
#   resolve to /cognito/v2/home only.
# The Users page (/user-pools/<id>/users?region=) is path-only (brief; the
# path answers 200).  Clients, groups and identity providers have no
# evidenced page, so those commands open the user pool overview, which
# the resolver produces.  create-user-pool had a with_id on --pool-name.
# list-user-pools and describe-user-pool are already right.

aws.cognito-idp.create-user-pool:
  intent: {verb: create, resource_type: AWS::Cognito::UserPool, id_args: []}
  url:
    best: "https://{region}.{host}/cognito/v2/idp/set-up-your-application?region={region}"
    source: curated
    verified: "2026-11-04"
    note: create-user-pool flow (go/create); --pool-name is not a pool id

aws.cognito-idp.list-users: &users_page
  intent:
    verb: list
    resource_type: AWS::Cognito::UserPoolUser
    id_args: []
    params:
      pool: {arg: --user-pool-id}
  url:
    best: "https://{region}.{host}/cognito/v2/idp/user-pools?region={region}"
    variants:
      - when: [pool]
        template: "https://{region}.{host}/cognito/v2/idp/user-pools/{pool}/users?region={region}"
    source: curated
    verified: path-only
    note: the user pool's Users page (--user-pool-id)

aws.cognito-idp.admin-get-user: *users_page
aws.cognito-idp.admin-create-user: *users_page
aws.cognito-idp.admin-delete-user: *users_page
aws.cognito-idp.admin-disable-user: *users_page
aws.cognito-idp.admin-enable-user: *users_page

aws.cognito-idp.list-user-pool-clients: &pool_overview
  intent:
    verb: view
    resource_type: AWS::Cognito::UserPool
    id_args: []
    params:
      pool: {arg: --user-pool-id}
  url:
    best: "https://{region}.{host}/cognito/v2/idp/user-pools?region={region}"
    variants:
      - when: [pool]
        template: "https://{region}.{host}/cognito/v2/idp/user-pools/{pool}/overview?region={region}"
    source: curated
    verified: "2026-11-04"
    note: the user pool overview (--user-pool-id); no evidenced sub-page

aws.cognito-idp.describe-user-pool-client: *pool_overview
aws.cognito-idp.list-groups: *pool_overview
aws.cognito-idp.admin-list-groups-for-user: *pool_overview
aws.cognito-idp.list-identity-providers: *pool_overview
