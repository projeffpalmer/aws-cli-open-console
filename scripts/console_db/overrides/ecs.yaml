# Curated console pages for "aws ecs" (plan step 2.4, group W4).
# ECS is a regional console: https://{region}.{host}/ecs/v2/...?region=...
#
# Evidence (2026-11-04):
#   go/list?resourceType=AWS::ECS::Cluster        -> /ecs/v2/clusters?region=<r>
#   go/view?arn=<cluster, service, task, container-instance or
#     task-definition ARN> -> /ecs/v2/redirect?arn=<ARN, fully %-encoded>&region=<r>
#     (view-samples.tsv and live probes); with a plain name the resolver
#     still emits redirect?arn=<name>, which is not a page for that name.
#   link2aws.js: /ecs/v2/clusters/<c>?region=, /ecs/v2/clusters/<c>/services/<s>,
#     /ecs/v2/clusters/<c>/tasks/<t>; arn-to-url: /ecs/v2/clusters/<c>/services/<s>
#   The brief gives the tab paths /clusters/<c>/services, /services/<s>/health
#   and /clusters/<c>/tasks; every path answers 200 unauthenticated (SPA), so
#   tabs are path-only.
# --cluster, --services and --tasks take a name, an id or an ARN; basename
# reduces each ARN form (cluster/<c>, service/<c>/<s>, service/<s>,
# task/<c>/<id>, task/<id>) to the name or id the console paths need, and is
# the identity for plain names.  Without --cluster ECS uses the cluster
# named "default", so the variants without a cluster use clusters/default.
# --task-definition (family, family:revision or ARN): a typed ARN
# (arn_account present) opens the resolver's redirect page.  RC-B
# (2026-11-04): family:revision is split with before_colon / after_colon into
# link2aws.js's task-definition page
#   /ecs/v2/task-definitions/${resource}/${resource_revision}?region=
# (path answers 200, SPA, so path-only); the ARN variant goes first because
# the split of an ARN gives "arn" and "aws:ecs:...".  arn_name of an ARN
# gives only the revision, so ARNs keep the redirect page.  A family without
# a revision opens the list (no family-page evidence).

aws.ecs.describe-clusters:
  intent:
    verb: view
    resource_type: AWS::ECS::Cluster
    id_args: []
    params:
      cluster: {arg: --clusters, parse: basename}
  url:
    best: "https://{region}.{host}/ecs/v2/clusters?region={region}"
    variants:
      - when: [cluster]
        template: "https://{region}.{host}/ecs/v2/clusters/{cluster}/services?region={region}"
    source: curated
    verified: path-only
    note: cluster page (services tab) of the first --clusters value; clusters list without one

