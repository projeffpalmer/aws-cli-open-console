aws.ecs.describe-task-definition:
  intent:
    verb: view
    resource_type: AWS::ECS::TaskDefinition
    id_args: []
    params:
      td: {arg: --task-definition}
      td_account: {arg: --task-definition, parse: arn_account}
      td_family: {arg: --task-definition, parse: before_colon}
      td_revision: {arg: --task-definition, parse: after_colon}
  url:
    best: "https://{region}.{host}/ecs/v2/task-definitions?region={region}"
    variants:
      - when: [td, td_account]
        template: "https://{region}.{host}/ecs/v2/redirect?arn={td:query}&region={region}"
      - when: [td_family, td_revision]
        template: "https://{region}.{host}/ecs/v2/task-definitions/{td_family}/{td_revision}?region={region}"
    source: curated
    verified: path-only
    note: family:revision opens that revision's page (link2aws shape); an ARN the resolver's redirect page; a family alone the list

