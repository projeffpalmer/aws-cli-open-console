# Curated console pages for "aws glue" (plan step 2.4, curator W3).
# Glue is regional: https://{region}.{host}/glue/home?region={region}#...
#
# Evidence (2026-11-04):
#   go/list?resourceType=AWS::Glue::Table -> #/v2/data-catalog/tables (types.tsv)
#   go/view?resourceType=AWS::Glue::Database&resourceId=zz9idzz9
#                               -> #database:name=zz9idzz9 (view-by-id.tsv)
#   go/view?arn=arn:aws:glue:us-west-2:123456789012:table/mydb/mytable
#                               -> #table:name=mytable;namespace=mydb (view-samples.tsv)
# Databases, crawlers and jobs (get-database(s), get-crawler(s),
# start-crawler, get-job(s), start-job-run, get-job-runs) keep their
# generated resolver entries; no evidence was found for a job-runs tab.

aws.glue.get-tables:
  intent:
    verb: list
    resource_type: AWS::Glue::Database
    id_args: [--database-name]
  url:
    best: "https://{region}.{host}/glue/home?region={region}#/v2/data-catalog/tables"
    with_id: "https://{region}.{host}/glue/home?region={region}#database:name={id}"
    source: curated
    verified: "2026-11-04"
    note: the database page of --database-name, which lists its tables

aws.glue.get-table: &table_page
  intent:
    verb: view
    resource_type: AWS::Glue::Table
    id_args: []
    params:
      database: {arg: --database-name}
      table: {arg: --name}
  url:
    best: "https://{region}.{host}/glue/home?region={region}#/v2/data-catalog/tables"
    variants:
      - when: [database, table]
        template: "https://{region}.{host}/glue/home?region={region}#table:name={table};namespace={database}"
      - when: [database]
        template: "https://{region}.{host}/glue/home?region={region}#database:name={database}"
    source: curated
    verified: "2026-11-04"
    note: table page (--database-name, --name); tables list without them

aws.glue.update-table:
