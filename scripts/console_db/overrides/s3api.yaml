# Curated console pages for "aws s3api" operations (plan step 2.4, s3
# pilot).  S3 is a global console: every template uses https://{host}/...
# and passes the region as a query parameter.  Same evidence and encoding
# rule as s3.yaml: keys and prefixes use the default {name} (path)
# encoding, which matches the resolver's %2F / %20 in go/view?arn= redirects.
# Only the buckets list is the resolver's exact shape (verified 2026-11-04);
# every other template is checked for host+path only.
# list-objects and list-objects-v2 cut --prefix back to its last "/"
# (prefix_dir: photos/2026 opens the photos/ folder view; a prefix with no
# "/" opens the bucket page).  go/view?arn=arn:aws:s3:::mybucket/photos/2026
# answers the object page (s3/object/...?prefix=photos%2F2026, probed
# 2026-11-04), which is not a listing.  list-object-versions still passes
# --prefix as typed.

aws.s3api.list-buckets:
  intent:
    verb: list
    resource_type: AWS::S3::Bucket
    id_args: []
  url:
    best: "https://{host}/s3/buckets?region={region}"
    needs_account: false
    source: curated
    verified: "2026-11-04"
    note: buckets list (go/list?resourceType=AWS::S3::Bucket)

aws.s3api.create-bucket:
  intent:
    verb: create
    resource_type: AWS::S3::Bucket
    id_args: []
  url:
    best: "https://{host}/s3/bucket/create?region={region}"
    needs_account: false
    source: curated
    verified: path-only
    note: create-bucket wizard on the global host (resolver uses the regional host)

aws.s3api.head-bucket:
  intent:
    verb: view
    resource_type: AWS::S3::Bucket
    id_args: []
    params:
      bucket: {arg: --bucket}
  url:
    best: "https://{host}/s3/buckets?region={region}"
    variants:
      - when: [bucket]
        template: "https://{host}/s3/buckets/{bucket}?region={region}"
    needs_account: false
    source: curated
    verified: path-only
    note: the bucket page (--bucket)

