aws.s3api.list-objects:
  intent:
    verb: list
    resource_type: AWS::S3::Bucket
    id_args: []
    params:
      bucket: {arg: --bucket}
      prefix: {arg: --prefix, parse: prefix_dir}
  url:
    best: "https://{host}/s3/buckets?region={region}"
    variants:
      - when: [bucket, prefix]
        template: "https://{host}/s3/buckets/{bucket}?region={region}&prefix={prefix}&showversions=false"
      - when: [bucket]
        template: "https://{host}/s3/buckets/{bucket}?region={region}"
    needs_account: false
    source: curated
    verified: path-only
    note: the bucket's objects; --prefix opens the folder up to its last /

