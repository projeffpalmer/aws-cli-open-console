# Curated console pages for "aws events" (EventBridge, plan step 2.4, W2).
# Regional console: https://{region}.{host}/events/home?region=...
#
# Evidence (2026-11-04):
#   go/view?arn=arn:aws:events:...:rule/myrule       -> #/eventbus/default/rules/myrule
#   go/view?arn=arn:aws:events:...:rule/mybus/myrule -> #/eventbus/mybus/rules/myrule
#   go/view?arn=arn:aws:events:...:event-bus/mybus   -> #/eventbus/mybus
#   go/list?resourceType=AWS::Events::Rule           -> #/rules
# go/view?resourceType=AWS::Events::Rule&resourceId=... has no detail page,
# so the generated rule commands stop at the rules list.  A rule lives on
# a bus; without --event-bus-name the API uses the bus "default", and so do
# these templates.  --event-bus-name takes a name or a bus ARN; arn_resource
# cuts "event-bus/mybus" back to the name, so the ARN variants go first.
# put-events, list-rules, list-event-buses and list-archives keep their
# generated entries (home or the resolver's list pages).

aws.events.describe-rule: &rule_node
  intent:
    verb: view
    resource_type: AWS::Events::Rule
    id_args: []
    params:
      rule: {arg: --name}
      bus_from_arn: {arg: --event-bus-name, parse: arn_resource}
      bus: {arg: --event-bus-name}
  url:
    best: "https://{region}.{host}/events/home?region={region}#/rules"
    variants:
      - when: [rule, bus_from_arn]
        template: "https://{region}.{host}/events/home?region={region}#/eventbus/{bus_from_arn}/rules/{rule}"
      - when: [rule, bus]
        template: "https://{region}.{host}/events/home?region={region}#/eventbus/{bus}/rules/{rule}"
      - when: [rule]
        template: "https://{region}.{host}/events/home?region={region}#/eventbus/default/rules/{rule}"
    needs_account: false
    source: curated
    verified: "2026-11-04"
    note: rule page on its event bus (default bus without --event-bus-name)
aws.events.enable-rule: *rule_node
aws.events.disable-rule: *rule_node
aws.events.put-rule: *rule_node
aws.events.delete-rule: *rule_node

aws.events.list-targets-by-rule: &rule_targets_node
  intent:
    verb: view
    resource_type: AWS::Events::Rule
    id_args: []
    params:
      rule: {arg: --rule}
      bus_from_arn: {arg: --event-bus-name, parse: arn_resource}
      bus: {arg: --event-bus-name}
  url:
    best: "https://{region}.{host}/events/home?region={region}#/rules"
    variants:
      - when: [rule, bus_from_arn]
        template: "https://{region}.{host}/events/home?region={region}#/eventbus/{bus_from_arn}/rules/{rule}"
      - when: [rule, bus]
        template: "https://{region}.{host}/events/home?region={region}#/eventbus/{bus}/rules/{rule}"
      - when: [rule]
        template: "https://{region}.{host}/events/home?region={region}#/eventbus/default/rules/{rule}"
    needs_account: false
    source: curated
    verified: "2026-11-04"
    note: rule page (--rule) on its event bus, which lists the rule's targets
aws.events.put-targets: *rule_targets_node
aws.events.remove-targets: *rule_targets_node

aws.events.describe-event-bus:
  intent:
    verb: view
    resource_type: AWS::Events::EventBus
    id_args: []
    params:
      bus_from_arn: {arg: --name, parse: arn_resource}
      bus: {arg: --name}
  url:
    best: "https://{region}.{host}/events/home?region={region}#/eventbus/default"
    variants:
      - when: [bus_from_arn]
        template: "https://{region}.{host}/events/home?region={region}#/eventbus/{bus_from_arn}"
      - when: [bus]
        template: "https://{region}.{host}/events/home?region={region}#/eventbus/{bus}"
    needs_account: false
    source: curated
    verified: "2026-11-04"
    note: event bus page (name or ARN); without --name the API describes the default bus
