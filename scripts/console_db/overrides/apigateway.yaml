# Curated console pages for "aws apigateway" (REST APIs; plan step 2.4, group W4).
# API Gateway is a regional console: https://{region}.{host}/apigateway/...?region=<r>
#
# Evidence (2026-11-04):
#   go/create?resourceType=AWS::ApiGateway::RestApi -> /apigateway/main/create-rest?experience=rest&region=<r>
#   go/view?arn=arn:aws:apigateway:us-west-2::/restapis/abc123 -> /apigateway/home?region=<r>#/apis/abc123
#   go/view?arn=...::/restapis/abc123/stages/prod -> #/apis/abc123/stages/prod
#   go/view?arn=...::/apikeys/k123 -> #/api-keys/k123
#   link2aws.js: /apigateway/main/apis/<id>/resources?api=<id>&region=<r>
# The stages list fragment #/apis/<id>/stages is the parent of the evidenced
# stage fragment (path-only); deployments are shown per stage, so
# get-deployments and create-deployment without --stage-name open it too.

aws.apigateway.create-rest-api:
  intent:
    verb: create
    resource_type: AWS::ApiGateway::RestApi
    id_args: []
  url:
    best: "https://{region}.{host}/apigateway/main/create-rest?experience=rest&region={region}"
    source: curated
    verified: "2026-11-04"
    note: create-REST-API wizard; the generated entry put --name where the API id goes

aws.apigateway.get-resources: &agw_resources
  intent:
    verb: list
    resource_type: AWS::ApiGateway::Resource
    id_args: [--rest-api-id]
  url:
    best: "https://{region}.{host}/apigateway/main/apis?region={region}"
    with_id: "https://{region}.{host}/apigateway/main/apis/{id}/resources?api={id:query}&region={region}"
    source: curated
    verified: path-only
    note: resources tree of --rest-api-id (link2aws.js form)
aws.apigateway.get-resource: *agw_resources
aws.apigateway.create-resource: *agw_resources
aws.apigateway.put-method: *agw_resources
aws.apigateway.get-method: *agw_resources
aws.apigateway.put-integration: *agw_resources

aws.apigateway.get-stages: &agw_stages
  intent:
    verb: list
    resource_type: AWS::ApiGateway::Stage
    id_args: [--rest-api-id]
  url:
    best: "https://{region}.{host}/apigateway/main/apis?region={region}"
    with_id: "https://{region}.{host}/apigateway/home?region={region}#/apis/{id}/stages"
    source: curated
    verified: path-only
    note: stages of --rest-api-id (parent of the evidenced stage fragment)
aws.apigateway.get-deployments: *agw_stages

aws.apigateway.get-stage: &agw_stage
  intent:
    verb: view
    resource_type: AWS::ApiGateway::Stage
    id_args: []
    params:
      api: {arg: --rest-api-id}
      stage: {arg: --stage-name}
  url:
    best: "https://{region}.{host}/apigateway/main/apis?region={region}"
    variants:
      - when: [api, stage]
        template: "https://{region}.{host}/apigateway/home?region={region}#/apis/{api}/stages/{stage}"
      - when: [api]
        template: "https://{region}.{host}/apigateway/home?region={region}#/apis/{api}/stages"
    source: curated
    verified: "2026-11-04"
    note: stage page (go/view?arn= of a REST API stage ARN)
aws.apigateway.update-stage: *agw_stage
aws.apigateway.delete-stage: *agw_stage
aws.apigateway.create-stage: *agw_stage
aws.apigateway.create-deployment: *agw_stage

aws.apigateway.get-api-key: &agw_key
  intent:
    verb: view
    resource_type: AWS::ApiGateway::ApiKey
    id_args: [--api-key]
  url:
    best: "https://{region}.{host}/apigateway/main/api-keys?region={region}"
    with_id: "https://{region}.{host}/apigateway/home?region={region}#/api-keys/{id}"
    source: curated
    verified: "2026-11-04"
    note: API key page of --api-key (go/view?arn= of an apikeys ARN)
aws.apigateway.update-api-key: *agw_key
aws.apigateway.delete-api-key: *agw_key
