# Curated console pages for "aws sqs" (plan step 2.4, W2).
# Regional console: https://{region}.{host}/sqs/v3/home?region=...
#
# Evidence (2026-11-04):
#   go/list?resourceType=AWS::SQS::Queue   -> #/queues
#   go/create?resourceType=AWS::SQS::Queue -> #/create-queue
#   go/view?resourceType=AWS::SQS::Queue&resourceId=zz9idzz9 -> #/queues/zz9idzz9
#   go/view?resourceType=AWS::SQS::Queue&resourceId=<queue URL>
#        -> #/queues/https://sqs.us-west-2.amazonaws.com/123456789012/myqueue
#   reference projects (arn-to-url awsurl.go, link2aws.js) build
#        #/queues/https%3A%2F%2Fsqs.<r>.amazonaws.com%2F<account>%2F<name>
# The queue page id is the queue URL.  Per the brief it is placed with {id}
# (path encoding, the reference projects' form); the resolver returns it
# decoded, so the exact shape is not the resolver's and verified is
# path-only.  --queue-name is not a queue URL: get-queue-url opens the
# queues list and create-queue the create wizard (the generated entries put
# the bare name into #/queues/).

aws.sqs.get-queue-attributes: &queue_node
  intent:
    verb: view
    resource_type: AWS::SQS::Queue
    id_args: [--queue-url]
  url:
    best: "https://{region}.{host}/sqs/v3/home?region={region}#/queues"
    with_id: "https://{region}.{host}/sqs/v3/home?region={region}#/queues/{id}"
    needs_account: false
    source: curated
    verified: path-only
    note: queue page keyed by the URL-encoded --queue-url; no URL gives the queues list
aws.sqs.set-queue-attributes: *queue_node
aws.sqs.send-message: *queue_node
aws.sqs.send-message-batch: *queue_node
aws.sqs.receive-message: *queue_node
aws.sqs.purge-queue: *queue_node
aws.sqs.delete-queue: *queue_node

aws.sqs.get-queue-url:
  intent:
    verb: list
    resource_type: AWS::SQS::Queue
    id_args: []
  url:
    best: "https://{region}.{host}/sqs/v3/home?region={region}#/queues"
    needs_account: false
    source: curated
    verified: "2026-11-04"
    note: queues list (go/list); a --queue-name is not the queue URL the queue page needs

aws.sqs.create-queue:
  intent:
    verb: create
    resource_type: AWS::SQS::Queue
    id_args: []
  url:
    best: "https://{region}.{host}/sqs/v3/home?region={region}#/create-queue"
    needs_account: false
    source: curated
    verified: "2026-11-04"
    note: create-queue wizard (go/create), also when --queue-name is typed
