# Curated console pages for "aws service-quotas" (plan step 2.4, curator
# W5; the brief's "servicequotas" is the CLI command service-quotas).
# Regional host; the resolver adds no ?region= parameter.
#
# Evidence (2026-11-04):
#   go/view?arn=arn:aws:servicequotas:us-west-2:123456789012:ec2/L-1216C47A
#       -> https://us-west-2.console.aws.amazon.com/servicequotas/home/services/ec2/quotas/L-1216C47A
#   ram service-2.json (AWS API docs) links
#       https://console.aws.amazon.com/servicequotas/home/services/ram/quotas
# Not curated (no evidence): list-services, the quota request history.

aws.service-quotas.list-service-quotas: &quota_list
  intent:
    verb: list
    resource_type: null
    id_args: []
    params:
      service: {arg: --service-code}
  url:
    best: "https://{region}.{host}/servicequotas/home"
    variants:
      - when: [service]
        template: "https://{region}.{host}/servicequotas/home/services/{service}/quotas"
    source: curated
    verified: path-only
    note: the service's quotas list (--service-code)

aws.service-quotas.list-aws-default-service-quotas: *quota_list

aws.service-quotas.get-service-quota: &quota_view
  intent:
    verb: view
    resource_type: null
    id_args: []
    params:
      service: {arg: --service-code}
      quota: {arg: --quota-code}
  url:
    best: "https://{region}.{host}/servicequotas/home"
    variants:
      - when: [service, quota]
        template: "https://{region}.{host}/servicequotas/home/services/{service}/quotas/{quota}"
      - when: [service]
        template: "https://{region}.{host}/servicequotas/home/services/{service}/quotas"
    source: curated
    verified: "2026-11-04"
    note: the quota's page, where an increase is requested

aws.service-quotas.request-service-quota-increase: *quota_view
aws.service-quotas.get-aws-default-service-quota: *quota_view
