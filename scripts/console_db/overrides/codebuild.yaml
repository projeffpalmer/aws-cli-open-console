# Curated console pages for "aws codebuild" (plan step 2.4, group W4).
# CodeBuild is a regional console under https://{region}.{host}/codesuite/codebuild/.
#
# Evidence (2026-11-04):
#   go/list?resourceType=AWS::CodeBuild::Project -> /codesuite/codebuild/projects?region=<r>
#   go/view?arn=arn:aws:codebuild:us-west-2:123456789012:project/myproj
#     -> /codesuite/codebuild/123456789012/projects/myproj   (no ?region=)
#   go/view?arn=...:build/myproj:<uuid>
#     -> /codesuite/codebuild/123456789012/projects/myproj/build/myproj:<uuid>
#   go/view?resourceType=AWS::CodeBuild::Project&resourceId=myproj (with or
#     without accountId) -> codebuild home, so project pages need {account}.
# The project page needs the account id; without one the template cannot be
# filled and the projects list is used.  The /history?region= tab comes from
# the brief (path-only).  RC-B (2026-11-04): build pages use the resolver's
# build-ARN shape above (live probe 2026-11-04; link2aws.js has no build
# template, "build": null): the project is the build id before the first ":"
# (before_colon) and the id is inserted raw like the resolver does; like the
# project pages it carries no ?region= and needs the account id.  Several
# --ids values open the projects list (url.with_id is used for one id only).

aws.codebuild.batch-get-projects: &cb_project
  intent:
    verb: view
    resource_type: AWS::CodeBuild::Project
    id_args: [--names]
  url:
    best: "https://{region}.{host}/codesuite/codebuild/projects?region={region}"
    with_id: "https://{region}.{host}/codesuite/codebuild/{account}/projects/{id}"
    source: curated
    verified: "2026-11-04"
    note: project page of a single --names value (needs the account id); several names open the list
aws.codebuild.update-project:
  <<: *cb_project
  intent:
    verb: view
    resource_type: AWS::CodeBuild::Project
    id_args: [--name]
aws.codebuild.delete-project:
  <<: *cb_project
  intent:
    verb: view
    resource_type: AWS::CodeBuild::Project
    id_args: [--name]

aws.codebuild.start-build: &cb_history
  intent:
    verb: view
    resource_type: AWS::CodeBuild::Project
    id_args: [--project-name]
  url:
    best: "https://{region}.{host}/codesuite/codebuild/projects?region={region}"
    with_id: "https://{region}.{host}/codesuite/codebuild/{account}/projects/{id}/history?region={region}"
    source: curated
    verified: path-only
    note: build history tab of --project-name (needs the account id)
aws.codebuild.list-builds-for-project: *cb_history
aws.codebuild.start-build-batch: *cb_history

aws.codebuild.batch-get-builds:
  intent:
    verb: view
    resource_type: null
    id_args: [--ids]
    params:
      project: {arg: --ids, parse: before_colon}
  url:
    best: "https://{region}.{host}/codesuite/codebuild/projects?region={region}"
    with_id: &cb_build_page "https://{region}.{host}/codesuite/codebuild/{account}/projects/{project}/build/{id:raw}"
    source: curated
    verified: "2026-11-04"
    note: build page of a single --ids value (project:uuid, needs the account id); several ids or no account open the projects list
aws.codebuild.stop-build: &cb_build
  intent:
    verb: view
    resource_type: null
    id_args: [--id]
    params:
      project: {arg: --id, parse: before_colon}
  url:
    best: "https://{region}.{host}/codesuite/codebuild/projects?region={region}"
    with_id: *cb_build_page
    source: curated
    verified: "2026-11-04"
    note: build page of --id (project:uuid, needs the account id); projects list without an account
aws.codebuild.retry-build: *cb_build

aws.codebuild.list-builds:
  intent:
    verb: list
    resource_type: AWS::CodeBuild::Project
    id_args: []
  url:
    best: "https://{region}.{host}/codesuite/codebuild/projects?region={region}"
    source: curated
    verified: "2026-11-04"
    note: projects list (go/list AWS::CodeBuild::Project)
