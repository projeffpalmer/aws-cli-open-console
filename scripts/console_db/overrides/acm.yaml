# Curated console pages for "aws acm" (plan step 2.4).  ACM is regional:
# https://{region}.{host}/acm/home?region={region}#/certificates/...
#
# Evidence (2026-11-04):
#   go/list   AWS::CertificateManager::Certificate -> #/certificates/list
#   go/create AWS::CertificateManager::Certificate -> #/certificates/request
#   go/view?arn=arn:aws:acm:us-west-2:...:certificate/1111...5555
#       -> us-west-2 ... #/certificates/1111...5555          (view-samples.tsv)
#   go/view?arn=arn:aws:acm:eu-west-1:...:certificate/1111...5555
#       -> eu-west-1 ... ?region=eu-west-1#/certificates/1111...5555 (live)
# The generated with_id puts the whole --certificate-arn in the fragment;
# the console page takes the certificate id (arn_resource) in the ARN's
# region (arn_region).  request-certificate's generated with_id used
# --domain-name as a certificate id.
# Not curated: list-certificates (the generated entry is the exact go/list page).

aws.acm.describe-certificate: &certificate_page
  intent:
    verb: view
    resource_type: AWS::CertificateManager::Certificate
    id_args: []
    params:
      cert_id: {arg: --certificate-arn, parse: arn_resource}
      cert_region: {arg: --certificate-arn, parse: arn_region}
  url:
    best: "https://{region}.{host}/acm/home?region={region}#/certificates/list"
    variants:
      - when: [cert_id, cert_region]
        template: "https://{cert_region}.{host}/acm/home?region={cert_region}#/certificates/{cert_id}"
      - when: [cert_id]
        template: "https://{region}.{host}/acm/home?region={region}#/certificates/{cert_id}"
    source: curated
    verified: "2026-11-04"
    note: the certificate page in the ARN's region (exact go/view?arn= shape); list otherwise

aws.acm.delete-certificate: *certificate_page
aws.acm.get-certificate: *certificate_page
aws.acm.export-certificate: *certificate_page
aws.acm.renew-certificate: *certificate_page
aws.acm.wait.certificate-validated: *certificate_page

aws.acm.request-certificate:
  intent: {verb: create, resource_type: AWS::CertificateManager::Certificate, id_args: []}
  url:
    best: "https://{region}.{host}/acm/home?region={region}#/certificates/request"
    source: curated
    verified: "2026-11-04"
    note: request-certificate wizard (go/create); --domain-name is not a certificate id

aws.acm.import-certificate:
  intent:
    verb: create
    resource_type: AWS::CertificateManager::Certificate
    id_args: []
    params:
      cert_id: {arg: --certificate-arn, parse: arn_resource}
      cert_region: {arg: --certificate-arn, parse: arn_region}
  url:
    best: "https://{region}.{host}/acm/home?region={region}#/certificates/list"
    variants:
      - when: [cert_id, cert_region]
        template: "https://{cert_region}.{host}/acm/home?region={cert_region}#/certificates/{cert_id}"
    source: curated
    verified: "2026-11-04"
    note: certificates list (no resolver import page); a reimport (--certificate-arn) opens that certificate
