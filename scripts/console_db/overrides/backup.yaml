# Curated console pages for "aws backup" (plan step 2.4, curator W3).
# AWS Backup is regional: https://{region}.{host}/backup/home?region={region}#/...
#
# Evidence (2026-11-04):
#   go/list?resourceType=AWS::Backup::BackupVault -> #/backupvaults (types.tsv)
#   go/view?arn=arn:aws:backup:us-west-2:123456789012:backup-vault:myvault
#     -> #/backupvaults/details/myvault?owner-account-id=123456789012 (view-samples.tsv)
#   link2aws backup-vault: /backup/home?region=<r>#/backupvaults/details/<name>
# The vault page shows the vault's recovery points.  With an account id the
# resolver's exact shape is used; without one, the link2aws shape on the
# regional host (path-only, the fragment differs from the resolver).
# list-backup-jobs, describe-backup-job keep their generated home page: no
# evidence for a jobs page (a recovery-point ARN lands on #/backupvaults).

aws.backup.describe-backup-vault: &vault_page
  intent:
    verb: view
    resource_type: AWS::Backup::BackupVault
    id_args: []
    params:
      vault: {arg: --backup-vault-name}
  url:
    best: "https://{region}.{host}/backup/home?region={region}#/backupvaults"
    variants:
      - when: [vault]
        template: "https://{region}.{host}/backup/home?region={region}#/backupvaults/details/{vault}?owner-account-id={account}"
      - when: [vault]
        template: "https://{region}.{host}/backup/home?region={region}#/backupvaults/details/{vault}"
    source: curated
    verified: path-only
    note: vault page of --backup-vault-name (owner-account-id when the account is known)

aws.backup.list-recovery-points-by-backup-vault: *vault_page
aws.backup.start-backup-job: *vault_page
