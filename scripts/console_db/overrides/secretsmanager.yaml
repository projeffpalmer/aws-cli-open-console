# Curated console pages for "aws secretsmanager" (plan step 2.4).
#
# Evidence (2026-11-04):
#   go/list   AWS::SecretsManager::Secret -> <r>.../secretsmanager/listsecrets?region=<r>
#   go/create AWS::SecretsManager::Secret -> <r>.../secretsmanager/newsecret?region=<r>
#   view-by-id.tsv -> <r>.../secretsmanager/secret?region=<r>&name=<id>
#   go/view?arn=...:secret:mysecret-AbCdEf -> ...&name=mysecret (suffix dropped)
#   go/view?arn=...:secret:prod/db/password-AbCdEf -> ...&name=prod/db/password
# create-secret is curated: its generated with_id took --name as the id of a
# secret that does not exist yet.  RC-B (2026-11-04): the --secret-id
# operations whose generated with_id was the secret page are curated with
# secret_name, so a secret ARN opens secret?name=<name> without the
# -AbCdEf suffix, as the resolver does; a plain name is unchanged and stays
# {..:query} encoded like the generated entries (prod%2Fdb%2Fpassword).
# Not curated: tabs such as Rotation (no evidence); an ARN of another region
# still opens in the configured region.

aws.secretsmanager.create-secret:
  intent: {verb: create, resource_type: AWS::SecretsManager::Secret, id_args: []}
  url:
    best: "https://{region}.{host}/secretsmanager/newsecret?region={region}"
    source: curated
    verified: "2026-11-04"
    note: store-a-new-secret wizard (go/create); --name is the new secret's name, not an existing page

aws.secretsmanager.describe-secret: &secret_page
  intent:
    verb: view
    resource_type: AWS::SecretsManager::Secret
    id_args: []
    params:
      secret: {arg: --secret-id, parse: secret_name}
  url:
    best: "https://{region}.{host}/secretsmanager/listsecrets?region={region}"
    variants:
      - when: [secret]
        template: "https://{region}.{host}/secretsmanager/secret?region={region}&name={secret:query}"
    source: curated
    verified: "2026-11-04"
    note: secret page of --secret-id; a secret ARN gives its name without the -AbCdEf suffix
aws.secretsmanager.get-secret-value: *secret_page
aws.secretsmanager.put-secret-value: *secret_page
aws.secretsmanager.update-secret: *secret_page
aws.secretsmanager.update-secret-version-stage: *secret_page
aws.secretsmanager.list-secret-version-ids: *secret_page
aws.secretsmanager.rotate-secret: *secret_page
aws.secretsmanager.cancel-rotate-secret: *secret_page
aws.secretsmanager.replicate-secret-to-regions: *secret_page
aws.secretsmanager.delete-secret: *secret_page
aws.secretsmanager.restore-secret: *secret_page
