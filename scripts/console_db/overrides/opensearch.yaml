# Curated console pages for "aws opensearch" (plan step 2.4, curator W5).
# OpenSearch Service is regional: https://{region}.{host}/aos/home?region={region}#opensearch/...
#
# Evidence (2026-11-04): AWS::OpenSearchService::Domain answers 404 at
# go/list, go/create and go/view, so the generated entries fell back to the
# service home; the legacy type answers instead:
#   go/list   AWS::Elasticsearch::Domain -> #opensearch/domains
#   go/create AWS::Elasticsearch::Domain -> #opensearch/domains/create-domain
#   view-by-id AWS::Elasticsearch::Domain -> #opensearch/domains/<name>
#   go/view?arn=arn:aws:es:...:domain/mydomain -> #opensearch/domains/mydomain
#   link2aws.js es domain -> the same template

aws.opensearch.list-domain-names:
  intent: {verb: list, resource_type: AWS::OpenSearchService::Domain, id_args: []}
  url:
    best: "https://{region}.{host}/aos/home?region={region}#opensearch/domains"
    source: curated
    verified: "2026-11-04"
    note: domains list (go/list AWS::Elasticsearch::Domain)

aws.opensearch.describe-domain: &domain_view
  intent: {verb: view, resource_type: AWS::OpenSearchService::Domain, id_args: [--domain-name]}
  url:
    best: "https://{region}.{host}/aos/home?region={region}#opensearch/domains"
    with_id: "https://{region}.{host}/aos/home?region={region}#opensearch/domains/{id}"
    source: curated
    verified: "2026-11-04"
    note: domain page (go/view?arn=arn:aws:es:...:domain/<name>)

aws.opensearch.delete-domain: *domain_view
aws.opensearch.describe-domain-config: *domain_view
aws.opensearch.update-domain-config: *domain_view

aws.opensearch.describe-domains:
  intent: {verb: list, resource_type: AWS::OpenSearchService::Domain, id_args: [--domain-names]}
  url:
    best: "https://{region}.{host}/aos/home?region={region}#opensearch/domains"
    with_id: "https://{region}.{host}/aos/home?region={region}#opensearch/domains/{id}"
    source: curated
    verified: "2026-11-04"
    note: domain page for one name, the domains list for several

aws.opensearch.create-domain:
  intent: {verb: create, resource_type: AWS::OpenSearchService::Domain, id_args: []}
  url:
    best: "https://{region}.{host}/aos/home?region={region}#opensearch/domains/create-domain"
    source: curated
    verified: "2026-11-04"
    note: create-domain wizard (go/create AWS::Elasticsearch::Domain)
