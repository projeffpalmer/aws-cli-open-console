# Curated console pages for "aws ssm" (plan step 2.4, curator W5).
# Systems Manager is regional: https://{region}.{host}/systems-manager/...
#
# Evidence (2026-11-04):
#   go/view?resourceType=AWS::SSM::Parameter&resourceId=/my/param
#       -> /systems-manager/parameters//my/param/description?region=<r>
#   go/view?resourceType=...Parameter&resourceId=%2Fmy%2Fparam -> the same
#       (the resolver decodes the slashes and inserts the name raw)
#   go/view?arn=...:parameter/my/param -> /parameters/my/param/description
#     (view-samples.tsv; live probe 2026-11-04)
#   go/view?arn=...:parameter/myparam  -> /parameters/myparam/description
#   Path probes: parameters//my/param/..., parameters/my/param/... and
#   parameters/%2Fmy%2Fparam/... all answer 200 (single-page app), so the
#   path check cannot tell them apart.  RC-B (2026-11-04): parameter pages
#   use the resolver's ARN shape, the name with one leading "/" removed
#   (strip_leading_slash) and inserted raw, instead of the by-name "//"
#   shape; path-only, because the leading-slash form has not been opened
#   signed in.  The generated {id} produced %2F, which the resolver never
#   returns.
#   go/list|view AWS::SSM::ManagedInstance
#       -> /systems-manager/fleet-manager/managed-nodes[/<id>]?region=<r>
#   go/view?arn=...:session/<id> -> /systems-manager/session-manager/sessions?region=<r>
#   go/view?arn=...:automation-execution/<id>
#       -> /systems-manager/automation/execution/<id>?region=<r>
#   go/view?arn=...:automation-definition/<doc>
#       -> /systems-manager/documents/<doc>/description?region=<r>
#   docs run-command.html links https://console.aws.amazon.com/systems-manager/run-command
#   The resolver's list page /systems-manager/parameters/?region=<r>&tab=Table
#   answers 302 to /systems-manager/parameters?region=<r>&tab=Table (the
#   trailing "/" dropped), so every parameters-list template uses the
#   redirect target; describe-parameters and get-parameters-by-path are
#   curated only for that.
# Not curated (no evidence): automation executions list, command detail
# pages, the parameter History tab.  The documents, associations,
# maintenance windows and patch baselines entries are already right.
# start-session: the brief's session-manager/<instance-id> form was not
# found in the AWS docs; --target opens the Fleet Manager node page.

aws.ssm.get-parameter: &param_view
  intent:
    verb: view
    resource_type: AWS::SSM::Parameter
    id_args: [--name]
    params:
      pname: {arg: --name, parse: strip_leading_slash}
  url:
    best: "https://{region}.{host}/systems-manager/parameters?region={region}&tab=Table"
    with_id: "https://{region}.{host}/systems-manager/parameters/{pname:raw}/description?region={region}"
    source: curated
    verified: path-only
    note: parameter page in the resolver's ARN shape (/my/param -> parameters/my/param/description)

aws.ssm.get-parameter-history: *param_view
aws.ssm.put-parameter: *param_view
aws.ssm.delete-parameter: *param_view

aws.ssm.describe-parameters: &param_list
  intent: {verb: list, resource_type: AWS::SSM::Parameter, id_args: []}
  url:
    best: "https://{region}.{host}/systems-manager/parameters?region={region}&tab=Table"
    source: curated
    verified: path-only
    note: parameters list, at the URL the console redirects the resolver's list to

aws.ssm.get-parameters-by-path: *param_list

aws.ssm.get-parameters:
  intent:
    verb: list
    resource_type: AWS::SSM::Parameter
    id_args: [--names]
    params:
      pname: {arg: --names, parse: strip_leading_slash}
  url:
    best: "https://{region}.{host}/systems-manager/parameters?region={region}&tab=Table"
    with_id: "https://{region}.{host}/systems-manager/parameters/{pname:raw}/description?region={region}"
    source: curated
    verified: path-only
    note: one name opens its parameter page; several names the parameters list

aws.ssm.start-session:
  intent: {verb: view, resource_type: AWS::SSM::ManagedInstance, id_args: [--target]}
  url:
    best: "https://{region}.{host}/systems-manager/session-manager/sessions?region={region}"
    with_id: "https://{region}.{host}/systems-manager/fleet-manager/managed-nodes/{id}?region={region}"
    source: curated
    verified: "2026-11-04"
    note: Fleet Manager page of the --target node; Session Manager sessions without one

aws.ssm.describe-instance-information:
  intent: {verb: list, resource_type: AWS::SSM::ManagedInstance, id_args: []}
  url:
    best: "https://{region}.{host}/systems-manager/fleet-manager/managed-nodes?region={region}"
    source: curated
    verified: "2026-11-04"
    note: Fleet Manager managed nodes list (go/list AWS::SSM::ManagedInstance)

aws.ssm.send-command: &run_command
  intent: {verb: list, resource_type: null, id_args: []}
  url:
    best: "https://{region}.{host}/systems-manager/run-command?region={region}"
    source: curated
    verified: path-only
    note: Run Command page (AWS docs run-command.html)

aws.ssm.list-commands: *run_command
aws.ssm.list-command-invocations: *run_command
aws.ssm.get-command-invocation: *run_command
aws.ssm.wait.command-executed: *run_command

aws.ssm.get-automation-execution:
  intent: {verb: view, resource_type: null, id_args: [--automation-execution-id]}
  url:
    best: "https://{region}.{host}/systems-manager/home"
    with_id: "https://{region}.{host}/systems-manager/automation/execution/{id}?region={region}"
    source: curated
    verified: "2026-11-04"
    note: automation execution page (go/view?arn=...:automation-execution/<id>)

aws.ssm.start-automation-execution:
  intent: {verb: view, resource_type: AWS::SSM::Document, id_args: [--document-name]}
  url:
    best: "https://{region}.{host}/systems-manager/documents?region={region}"
    with_id: "https://{region}.{host}/systems-manager/documents/{id}/description?region={region}"
    source: curated
    verified: "2026-11-04"
    note: the runbook's document page, which holds Execute automation
